# Two-service stack for the first-run suite. `web` is the first service with a
# published port, so it is what Temps routes the environment's URL to; the
# `sidecar` proves a multi-container project starts as one deployment.
services:
  web:
    image: traefik/whoami:v1.10
    environment:
      WHOAMI_NAME: first-run-compose
    ports:
      - "127.0.0.1::80"
  sidecar:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
