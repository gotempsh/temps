# Two-service stack for the first-run suite. The scenario explicitly exposes
# web:80 through the proxy; published host ports alone keep a stack private.
# The sidecar proves a multi-container project starts as one deployment.
services:
  web:
    image: traefik/whoami:v1.10
    environment:
      WHOAMI_NAME: first-run-compose
    ports:
      - "127.0.0.1::80"
  sidecar:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
