[package]
name = "temps-lighthouse-plugin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lighthouse Performance Audit plugin for Temps - runs automated Lighthouse audits after deployments and tracks Core Web Vitals over time"

[[bin]]
name = "temps-lighthouse-plugin"
path = "src/main.rs"

[dependencies]
temps-plugin-sdk = { path = "../../crates/temps-plugin-sdk" }
utoipa = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
include_dir = { workspace = true }
mime_guess = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
