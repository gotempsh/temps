worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 4m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        auth_basic "Workflow engine";
        auth_basic_user_file /tmp/engine.htpasswd;
        location = /healthz { auth_basic off; set $health "ENGINE_HEALTH_UPSTREAM"; proxy_pass $health; }
        location / {
            set $backend "ENGINE_ADMIN_UPSTREAM";
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass $backend;
        }
    }
    server {
        listen 8081;
        auth_basic "Workflow ingress";
        auth_basic_user_file /tmp/engine.htpasswd;
        location = /healthz { auth_basic off; set $health "ENGINE_HEALTH_UPSTREAM"; proxy_pass $health; }
        location / {
            set $backend "ENGINE_INGRESS_UPSTREAM";
            proxy_set_header Authorization "";
            proxy_pass $backend;
        }
    }
}
