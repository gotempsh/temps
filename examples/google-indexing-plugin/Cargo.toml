[package]
name = "temps-google-indexing-plugin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Google Indexing API plugin for Temps - automatically notifies Google when pages are updated or removed"

[[bin]]
name = "temps-google-indexing-plugin"
path = "src/main.rs"

[dependencies]
temps-plugin-sdk = { path = "../../crates/temps-plugin-sdk" }
utoipa = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = { workspace = true }
thiserror = { workspace = true }
include_dir = { workspace = true }
mime_guess = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rsa = { workspace = true, features = ["pem"] }

[lints]
workspace = true
