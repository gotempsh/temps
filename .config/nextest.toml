# Nextest configuration for the whole workspace.
#
# Why this file exists: before it, nothing killed a stuck test. One test that
# awaited something that never completed held a CI job until the job's
# `timeout-minutes` cancelled it, ~90 minutes later, with no test named in the
# log -- nextest buffers a test's output until the test ends, so a hung test
# prints nothing at all. A timeout turns that into a `TIMEOUT` line naming the
# test, a few minutes in, and (with nextest's default fail-fast) stops the run.
#
# The timeouts are deliberately loose: they are a backstop for hangs, not a
# performance budget. The slowest legitimate tests seen in CI are the Docker
# ones; measured on a warm runner, the heaviest take 2-3 minutes, and a cold
# runner pulling the PostgreSQL / TimescaleDB images roughly doubles that.
#
# `period` is how often a slow test is reported (`SLOW [> 60s]`), and
# `terminate-after` is how many periods pass before the test is killed, so the
# kill happens at `period * terminate-after`.

[profile.default]
# 60s * 10 = 10 minutes for any single test. Every unit/integration group in
# rust-tests.yml inherits it through `--profile ci` (bottom of this file).
slow-timeout = { period = "60s", terminate-after = 10 }

# Tests that legitimately run for minutes. Each provisions several containers
# and streams a real dump/restore or backup, so they get 20 minutes.
#
#   orchestrator_*                PostgreSQL major-version upgrade runs; two
#                                 image pulls plus dump/restore, 2-6 minutes
#                                 each on a cold runner.
#   *_backup_and_restore_to_s3    An S3-compatible container plus a service
#                                 container and a WAL-G / mongodump stream.
#   mariadb_pitr_full_chain_e2e   Full binlog point-in-time-recovery chain; its
#                                 CI step already caps the whole run at 20m.
#   binary(starters)              temps-presets starters: real builds with a
#                                 900s build budget of their own.
[[profile.default.overrides]]
filter = 'test(~orchestrator_) or test(~backup_and_restore_to_s3) or test(~mariadb_pitr_full_chain_e2e) or binary(starters)'
slow-timeout = { period = "120s", terminate-after = 10 }

# ---------------------------------------------------------------------------
# Parallelism
# ---------------------------------------------------------------------------
#
# CI used to pass `--test-threads=1` to every group because tests deadlocked
# against one shared database. They no longer share one: each
# `TestDatabase::with_migrations()` test gets a database of its own, cloned
# from a template migrated once per run (crates/temps-test-utils/src/
# lib.rs). What is left to serialize is the handful of tests that
# share something outside the process, listed below by what they share.
# Everything else runs at nextest's default of one test per CPU.
#
# `#[serial]` (serial_test) does nothing here: nextest runs every test in its
# own process, and those locks are per process. A cross-process conflict has
# to be declared as a test group.

[test-groups]
# Share one resource that tolerates a single user at a time.
shared-host-serial = { max-threads = 1 }
# Tests CI has seen pass only on a retry, one at a time. The list is learned,
# not written here: .github/workflows/nextest-learned-serial.yml derives it
# from recent JUnit reports, and CI appends it to this file as an override
# before running (.github/scripts/nextest-flaky.py apply). Declared here so a
# local run with the same config accepts the override.
learned-serial = { max-threads = 1 }
# Start several containers or image builds each: safe to overlap, but more
# than two at once mostly adds Docker contention and memory pressure on a
# 4-vCPU / 16 GB runner.
docker-heavy = { max-threads = 2 }
# Build, use or delete the one sandbox image tag
# (`ghcr.io/gotempsh/temps-sandbox-node:<version>`). A cold build takes 8-10
# minutes on a runner. Overlapping, each test starts a build of its own, and the
# one that deletes the image breaks a create or commit in progress in another.
sandbox-image = { max-threads = 1 }

# Trivy keeps its vulnerability DB in one named Docker volume
# (`temps-trivy-db-cache`, BoltDB, single writer). Its SCAN_LOCK is per
# process, so concurrent scans from two test processes lock each other out
# or come back empty.
[[profile.default.overrides]]
filter = 'package(temps-vulnerability-scanner) and binary(integration_test)'
test-group = 'shared-host-serial'

# Whichever of these runs first waits out the cold image build, so they get the
# 20 minutes of the long-running override too. Above `docker-heavy`, because the
# first match wins and the driver eval test is in that one's binary as well; the
# learned list is appended below this, so a flaky test here stays in this group.
# A test that calls `ensure_image` belongs here: test-nextest-flaky.py checks.
[[profile.default.overrides]]
filter = '''
package(temps-sandbox-providers) and (
    (kind(=lib) and (
        test(=docker::tests::test_docker_sandbox_e2e_lifecycle)
        or test(=docker::tests::docker_directory_upload_and_bounded_read_stay_inside_their_limits)
        or test(=docker::tests::test_pull_fallback_on_missing_hub_image)
        or test(=docker::tests::test_kill_processes_term_and_kill)
        or test(=docker::tests::recover_by_name_preserves_stopped_containers)
        or test(=docker::tests::destroy_frees_the_home_volume_of_a_standalone_sandbox)))
    or (binary(sandbox_driver_eval) and test(=docker_driver_passes_the_sandbox_contract)))
'''
test-group = 'sandbox-image'
slow-timeout = { period = "120s", terminate-after = 10 }

# Docker builds and multi-container deployments.
[[profile.default.overrides]]
filter = '''
(package(temps-deployer) and (test(/^docker::/) or binary(traefik_discovery_integration)))
or (package(temps-presets) and binary(registry_prefix_docker_build))
or (package(temps-sandbox-providers) and binary(sandbox_driver_eval))
or (package(temps-workload-plane) and binary(crash_recovery))
or (package(temps-deployments) and kind(=test) and (
    binary(nodejs_integration_test) or binary(container_cleanup_on_failure_test)
    or binary(public_repo_deployment_test) or binary(workflow_execution_service_test)
    or binary(multiarch_build_test)))
'''
test-group = 'docker-heavy'

# ---------------------------------------------------------------------------
# CI
# ---------------------------------------------------------------------------
#
# Every group in rust-tests.yml runs `--profile ci`. It inherits everything
# above, including the overrides, and adds:
#
#   retries    A test that fails and then passes is reported FLAKY, not
#              failed, so one bad timing does not send a pull request back
#              to the start of a 30-minute pipeline. It is not hidden:
#              .github/scripts/nextest-flaky.py annotates every flaky test on
#              the run, and the scheduled learned-serial job runs repeat
#              offenders one at a time from then on.
#   fail-fast  Off, so a run reports every failing test rather than the first.
#   junit      The report those two read, written to target/nextest/ci/.
[profile.ci]
retries = { backoff = "fixed", count = 2, delay = "1s" }
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
