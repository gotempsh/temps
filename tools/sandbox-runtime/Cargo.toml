[package]
name = "temps-sandbox-runtime"
version = "0.1.0"
edition = "2021"
publish = false

# Development-only package: the runtime checkout is a sibling of the Temps worktree.
[workspace]

[dependencies]
temps-agent-runtime = { path = "../../../temps-agent-runtime", default-features = false, features = ["claude", "codex", "opencode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
