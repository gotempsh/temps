[package]
name = "temps-sandbox-runtime"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone package: the SDK revision is shared with the Temps bridge.
[workspace]

[dependencies]
temps-agent-runtime = { git = "https://github.com/gotempsh/agent-runtime-sdk.git", rev = "0bbf0bc9e7b1079b40877064d83d56a20800c863", default-features = false, features = ["claude", "codex", "opencode", "pi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "process", "sync", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
