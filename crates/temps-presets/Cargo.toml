[package]
name = "temps-presets"
version.workspace = true
edition.workspace = true
description = "Stateless project detection and build presets: framework detection, Dockerfile generation and compose and env-example parsing"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-core = { path = "../temps-core" }
temps-entities = { path = "../temps-entities" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
anyhow = { workspace = true }
regex = { workspace = true }
picomatch-rs = { workspace = true }
toml = { workspace = true }
yaml_serde = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, optional = true }

# The build engine. Pinned to a commit rather than a branch: a build plan that
# changes underneath a release would change what every project's image contains
# without anything in this repository moving.
autopack-core = { workspace = true }
autopack-providers = { workspace = true }
autopack-dockerfile = { workspace = true }

[features]
openapi = ["utoipa"]

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
