[package]
name = "temps-ai-agents"
version.workspace = true
edition.workspace = true
description = "AI agent runs: agent definitions, workflows and triggers, AI CLI provider logins, the autofixer, and the sandbox providers they run in"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-core = { path = "../temps-core" }
temps-ai = { path = "../temps-ai" }
temps-vm-agent = { path = "../temps-vm-agent" }
temps-entities = { path = "../temps-entities" }
# ADR-055 §6: sandbox backends are runtime drivers (`SandboxExt`).
temps-workload = { path = "../temps-workload", features = ["openapi"] }
temps-database = { path = "../temps-database" }
temps-git = { path = "../temps-git" }
temps-config = { path = "../temps-config" }
temps-deployments = { path = "../temps-deployments" }
temps-notifications = { path = "../temps-notifications" }
temps-auth = { path = "../temps-auth" }
sea-orm = { workspace = true }
tokio = { workspace = true, features = ["process", "fs"] }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
cron = { workspace = true }
temps-error-tracking = { path = "../temps-error-tracking" }
temps-agents-mcp-proxy = { path = "../temps-agents-mcp-proxy" }
anyhow = { workspace = true }
bollard = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
# ADR-055 phase 6: sandbox byte channels (terminal, agent runtime) to worker nodes.
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
http-body-util = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
walkdir = { workspace = true }
pulldown-cmark = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

# microsandbox microVM backend (ADR-050). Pinned exactly: the SDK is pre-1.0
# and its runtime binary + libkrunfw ABI move in lockstep with the crate.
# Default features are off: `download-binaries` fetches the runtime from the
# network inside build.rs, `cloud` / `keyring` are unused. Not linked on musl
# (the Alpine container image) or on Intel macOS: the SDK's VMM crate does not
# compile there, and the backend reports itself unavailable with that reason
# instead. The same predicate gates every use of the SDK in this crate and in
# `temps-cli`'s `microsandbox` command — keep them in step.
[target.'cfg(not(any(target_env = "musl", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
microsandbox = { workspace = true }

[dev-dependencies]
# ADR-055 golden captures of the container-create request.
temps-docker-capture = { path = "../temps-docker-capture" }
# ADR-055 §9: the netpol translation must deserialize into the pinned SDK.
temps-workload-netpol = { path = "../temps-workload-netpol" }

[lints]
workspace = true
