[package]
name = "temps-traefik-discovery"
version.workspace = true
edition.workspace = true
description = "Discovery of routes from Traefik labels: operator controls for discovered routes, certificate import validation and their HTTP handlers"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-auth = { path = "../temps-auth" }
temps-core = { path = "../temps-core" }
temps-deployer = { path = "../temps-deployer" }
temps-entities = { path = "../temps-entities" }
serde = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
utoipa = { workspace = true, features = ["chrono"] }
async-trait = { workspace = true }
# mTLS for the terminal WebSocket proxy (ADR-020 WS-2.1): build a rustls
# ClientConfig presenting the CP's cluster-CA-signed identity.
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# ADR-041 §5: X.509 leaf parsing for certificate import validation.
x509-parser = { workspace = true }
# ADR-041 §5: rustls key types for CryptoProvider-based sign/verify.
rustls-pki-types = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
temps-test-utils = { path = "../temps-test-utils" }
testcontainers = { workspace = true }
# ADR-041 tests: generate self-signed certs for cert_validator unit tests.
rcgen = { workspace = true }
# Key re-encoding for SEC1 (EC) and PKCS#1 (RSA) coverage (ADR-041 verification table).
# All three crates are already vendored as transitive dependencies; adding them here
# only exposes their encoding APIs to the test binary, without new network downloads.
p256 = { workspace = true }
rsa = { workspace = true, features = ["pem"] }

[lints]
workspace = true
