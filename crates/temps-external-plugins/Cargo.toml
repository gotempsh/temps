[package]
name = "temps-external-plugins"
version.workspace = true
edition.workspace = true
description = "External plugin host: discovers, installs, spawns and supervises standalone plugin binaries and proxies HTTP and events to them"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-ai-api-tools = { path = "../temps-ai-api-tools" }
temps-auth = { path = "../temps-auth" }
temps-core = { path = "../temps-core" }
temps-plugin-protocol = { path = "../temps-plugin-protocol" }
temps-entities = { path = "../temps-entities" }
temps-presets = { path = "../temps-presets" }
temps-ai = { path = "../temps-ai" }
sea-orm = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["default", "client-legacy"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.30"
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "uuid"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
temps-test-utils = { path = "../temps-test-utils" }
tracing-subscriber = { workspace = true }
temps-migrations = { path = "../temps-migrations" }
temps-plugin-sdk = { path = "../temps-plugin-sdk" }

[lints]
workspace = true
