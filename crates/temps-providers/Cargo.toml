[package]
name = "temps-providers"
version.workspace = true
edition.workspace = true
description = "Managed services (Postgres, MariaDB, MongoDB, Redis, S3): container lifecycle, upgrades, data import, health and query APIs"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-docker-util = { path = "../temps-docker-util" }
temps-auth = { path = "../temps-auth" }
temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-service-protocol = { path = "../temps-service-protocol" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
temps-deployment-logs = { path = "../temps-deployment-logs" }
temps-providers-core = { path = "../temps-providers-core" }
temps-providers-mariadb = { path = "../temps-providers-mariadb" }
temps-providers-mongodb = { path = "../temps-providers-mongodb" }
temps-providers-redis = { path = "../temps-providers-redis" }
temps-query = { path = "../temps-query" }
temps-query-mariadb = { path = "../temps-query-mariadb" }
temps-query-postgres = { path = "../temps-query-postgres" }
temps-query-s3 = { path = "../temps-query-s3" }
temps-query-redis = { path = "../temps-query-redis" }
temps-query-mongodb = { path = "../temps-query-mongodb" }
temps-dns = { path = "../temps-dns" }
temps-node-dns = { path = "../temps-node-dns" }
temps-network = { path = "../temps-network" }
temps-metrics = { path = "../temps-metrics" }
temps-alarms = { path = "../temps-alarms" }
temps-workload-docker = { path = "../temps-workload-docker" }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
mongodb = { workspace = true, features = ["default"] }
aws-sdk-s3 = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
tar = { workspace = true }
http = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
utoipa = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
schemars = { workspace = true }
urlencoding = { workspace = true }
tokio-postgres = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[features]
docker-tests = ["temps-providers-core/docker-tests", "temps-providers-mariadb/docker-tests", "temps-providers-mongodb/docker-tests", "temps-providers-redis/docker-tests"]

[dev-dependencies]
anyhow = { workspace = true }
temps-providers-core = { path = "../temps-providers-core", features = ["test-support"] }
temps-test-utils = { path = "../temps-test-utils" }
# Paused-clock tests (`start_paused`, `time::advance`).
tokio = { workspace = true, features = ["test-util"] }
# ADR-055 golden captures of the container-create request.
temps-docker-capture = { path = "../temps-docker-capture" }
testcontainers = { workspace = true }
hyper = { version = "1", features = ["client", "http1", "http2"] }
temps-migrations = { path = "../temps-migrations" }

[lints]
workspace = true
