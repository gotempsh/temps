[package]
name = "temps-analytics-events"
version.workspace = true
edition.workspace = true
description = "Web analytics event ingest and queries: page and custom events, traffic filters, ingest rate limiting and ClickHouse fan-out"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Core dependencies
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
temps-auth = { path = "../temps-auth" }
temps-routes = { path = "../temps-routes" }
temps-geo = { path = "../temps-geo" }
temps-analytics = { path = "../temps-analytics" }
temps-analytics-backend = { path = "../temps-analytics-backend" }
temps-config = { path = "../temps-config" }
temps-clickhouse = { path = "../temps-clickhouse" }

# ClickHouse Rust client. Always linked. The actual ClickHouse backend is
# only constructed at runtime when ServerConfig::is_clickhouse_enabled()
# returns true (i.e. operator set TEMPS_CLICKHOUSE_* env vars).
clickhouse = { workspace = true }

# Web framework
axum = { workspace = true }
utoipa = { workspace = true }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Time
chrono = { workspace = true }

# Bounded TTL cache for per-project traffic settings read on ingest
moka = { workspace = true }
ipnet = { workspace = true }

# User agent parsing
woothee = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
testcontainers = { workspace = true, features = ["http_wait_plain"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
