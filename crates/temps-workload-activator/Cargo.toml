[package]
name = "temps-workload-activator"
description = "One activator for scale-to-zero: wakes a workload on its first request and puts it back to sleep when idle (ADR-055 §11, §14)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# A concern crate: nothing in Temps. The proxy calls it on the request path
# (lock-free reads only); products register what may be woken and supply
# the backend that wakes it.
[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
