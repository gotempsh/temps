[package]
name = "temps-deployments"
version.workspace = true
edition.workspace = true
description = "Deployment pipeline: workflow jobs that build and roll out a project's containers, node scheduling and placement, and their HTTP handlers"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-runtime-health = { path = "../temps-runtime-health" }
jsonwebtoken = { workspace = true }
# Adding servers over SSH (ADR 048 D2c).
russh = { workspace = true }
zeroize = { workspace = true }
temps-auth = { path = "../temps-auth" }
temps-blob = { path = "../temps-blob" }
temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-deployer = { path = "../temps-deployer" }
temps-dns = { path = "../temps-dns" }
temps-monitoring = { path = "../temps-monitoring" }
temps-entities = { path = "../temps-entities" }
temps-log-aggregator = { path = "../temps-log-aggregator" }
temps-error-tracking = { path = "../temps-error-tracking" }
temps-file-store = { path = "../temps-file-store" }
temps-git = { path = "../temps-git" }
temps-deployment-logs = { path = "../temps-deployment-logs" }
temps-metrics = { path = "../temps-metrics" }
temps-queue = { path = "../temps-queue" }
temps-providers = { path = "../temps-providers" }
temps-presets = { path = "../temps-presets", features = ["openapi"] }
temps-screenshots = { path = "../temps-screenshots" }
temps-vulnerability-scanner = { path = "../temps-vulnerability-scanner" }
temps-network = { path = "../temps-network", features = ["control_plane"] }
temps-wireguard = { path = "../temps-wireguard" }
temps-otel = { path = "../temps-otel" }
temps-workload = { path = "../temps-workload" }
temps-workload-docker = { path = "../temps-workload-docker" }
temps-workload-env = { path = "../temps-workload-env" }
temps-workload-plane = { path = "../temps-workload-plane" }
temps-workload-volumes = { path = "../temps-workload-volumes" }
ipnet = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
yaml_serde = { workspace = true }
thiserror = { workspace = true }
sea-orm = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
url	= { workspace = true }
octocrab = { workspace = true }
utoipa = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
bollard = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
# Raw `GET /system/df` over the Docker Unix socket (see services/docker_disk_usage.rs)
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["default"] }
cron = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
urlencoding = { workspace = true }
tokio-tungstenite = { workspace = true }
regex = { workspace = true }
# mTLS for the terminal WebSocket proxy (ADR-020 WS-2.1): build a rustls
# ClientConfig presenting the CP's cluster-CA-signed identity.
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# ADR-041 §5: X.509 leaf parsing for certificate import validation.
x509-parser = { workspace = true }
# ADR-041 §5: rustls key types for CryptoProvider-based sign/verify.
rustls-pki-types = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
sea-orm-migration = { workspace = true }
temps-migrations = { path = "../temps-migrations" }
testcontainers = { workspace = true }
tokio-test = { workspace = true }
mockall = { workspace = true }
tower = { workspace = true }
env_logger = { workspace = true }
serial_test = { workspace = true }
# ADR-041 tests: generate self-signed certs for cert_validator unit tests.
rcgen = { workspace = true }
# Key re-encoding for SEC1 (EC) and PKCS#1 (RSA) coverage (ADR-041 verification table).
# All three crates are already vendored as transitive dependencies; adding them here
# only exposes their encoding APIs to the test binary, without new network downloads.
p256 = { workspace = true }
rsa = { workspace = true, features = ["pem"] }

[lints]
workspace = true
