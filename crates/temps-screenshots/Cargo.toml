[package]
name = "temps-screenshots"
version.workspace = true
edition.workspace = true
description = "Screenshot capture of deployed apps via local headless Chrome or a remote provider"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true }

# Screenshot dependencies
# No `fetch` feature: its zip 8 dependency has no patched release, so
# chromium_installer.rs downloads the same Chromium build instead.
headless_chrome = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
zip = { workspace = true }
directories = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# Decodes captured screenshots to prove they are readable images before storing them
image = { workspace = true, features = ["png", "jpeg", "webp"] }

temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-file-store = { path = "../temps-file-store" }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
sea-orm = { workspace = true }
temps-entities = { path = "../temps-entities" }
temps-database = { path = "../temps-database" }
chrono = { workspace = true }

[lints]
workspace = true
