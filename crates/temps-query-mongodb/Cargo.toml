[package]
name = "temps-query-mongodb"
version = "0.1.0"
edition = "2021"
description = "MongoDB backend for temps-query: browse databases and collections and query documents"
license.workspace = true

[dependencies]
temps-query = { path = "../temps-query" }

# MongoDB driver - use bson-3 feature so mongodb::bson re-exports bson 3.x,
# matching our explicit bson = "3.1" dep and avoiding a two-version conflict.
# The default compat-3-0-0 feature enables bson-2 which we explicitly exclude.
mongodb = { workspace = true, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver"] }

# Async runtime
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde_json = { workspace = true }
bson = { workspace = true }

# Logging
tracing = { workspace = true }

# Async trait
async-trait = { workspace = true }

[dev-dependencies]
testcontainers = { workspace = true }

[lints]
workspace = true
