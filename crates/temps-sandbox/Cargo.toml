[package]
name = "temps-sandbox"
version.workspace = true
edition.workspace = true
description = "Standalone sandbox HTTP API (/v1/sandbox), compatible with the Vercel Sandbox SDK, backed by the shared SandboxProvider"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-core = { path = "../temps-core" }
temps-entities = { path = "../temps-entities" }
temps-auth = { path = "../temps-auth" }
temps-ai-agents = { path = "../temps-ai-agents" }
temps-config = { path = "../temps-config" }
temps-git = { path = "../temps-git" }
# Frame codec for the in-sandbox PTY agent (ADR-008). Library half only —
# the binary is built into the sandbox image, not linked here.
temps-pty-agent = { path = "../temps-pty-agent" }
anyhow = { workspace = true }
base64 = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
ipnetwork = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["io"] }
futures = { workspace = true }
async-stream = { workspace = true }
flate2 = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
