[package]
name = "temps-backup"
version.workspace = true
edition.workspace = true
description = "Backups and restores: per-engine backup engines (Postgres, MariaDB, MongoDB, Redis, S3), schedules, S3 storage and HTTP handlers"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-backup-core = { path = "../temps-backup-core" }
temps-monitoring = { path = "../temps-monitoring" }
temps-auth = { path = "../temps-auth" }
temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
temps-providers = { path = "../temps-providers" }
temps-deployment-logs = { path = "../temps-deployment-logs" }
temps-workload = { path = "../temps-workload" }
temps-workload-plane = { path = "../temps-workload-plane" }
temps-workload-volumes = { path = "../temps-workload-volumes" }
serde = { workspace = true }
tokio = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
aws-sdk-s3 = { workspace = true }
# S3 clients must use a deterministic root-cert bundle. Without it, the
# default-https-client falls back to `rustls-native-certs`, which is broken
# on some macOS configurations (returns zero parsed roots) and triggers a
# `debug_assert!` panic in `aws-smithy-http-client`. Bundling Mozilla's CA
# list at compile time also makes prod hosts immune to a missing/broken
# /etc/ssl/certs, and keeps test runs hermetic.
aws-smithy-http-client = { workspace = true }
webpki-root-certs = { workspace = true }
pem = { workspace = true }
# `Content-MD5` on every upload (see `ContentMd5Interceptor` in
# engines/v2_common.rs): the interceptor reads the operation name from the
# SDK's config bag, which `aws-sdk-s3` does not re-export.
aws-smithy-runtime-api = { workspace = true }
md5 = { workspace = true }
base64 = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
yaml_serde = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
cron = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
axum = { workspace = true }
bollard = { workspace = true }
futures = { workspace = true }
tar = { workspace = true }
async-trait = { workspace = true }
urlencoding = { workspace = true }

[features]
# Docker-dependent integration tests. Mirrors temps-providers: gated behind a
# feature so `cargo test` on a host without a reachable Docker socket skips
# the heavy end-to-end tests, while CI opts in explicitly. The test files
# themselves also skip gracefully at runtime when Docker is unreachable.
docker-tests = []

[dev-dependencies]
sea-orm = { workspace = true, features = ["mock"] }
sea-orm-migration = { workspace = true }
testcontainers = { workspace = true }
sqlx = { workspace = true }
temps-migrations = { path = "../temps-migrations" }
temps-workload-env = { path = "../temps-workload-env" }
temps-workload-docker = { path = "../temps-workload-docker" }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
