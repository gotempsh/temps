[package]
name = "temps-analytics-session-replay"
version.workspace = true
edition.workspace = true
description = "Session replay: record, store and play back visitor browser sessions for user interaction analysis"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Core dependencies
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
temps-auth = { path = "../temps-auth" }
temps-routes = { path = "../temps-routes" }
# ADR-040 analytics ingest keys. Downward-only: temps-analytics depends on
# neither temps-routes nor this crate, so there is no cycle.
temps-analytics = { path = "../temps-analytics" }
# Web framework
axum = { workspace = true }
utoipa = { workspace = true }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

woothee = { workspace = true }

# Time
chrono = { workspace = true }

# Sharded bounded map for the visitor-creation IP limiter (no shared-lock
# contention on the ingest hot path). Matches temps-proxy's precedent.
dashmap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Schema-backed ingest tests (ADR-040 keyed ingest + no-key regression).
tower = { workspace = true }

[lints]
workspace = true
