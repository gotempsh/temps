[package]
name = "temps-cli"
version.workspace = true
edition.workspace = true
description = "The temps binary: command dispatch for serve, proxy, agent, join, migrate, backup and admin commands, also usable as a library"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "temps"
path = "src/main.rs"

# Expose a library target so out-of-tree binaries (e.g. the EE-bundled
# `temps` in temps-ee/apps/temps-cli) can call into the CLI dispatch
# without duplicating subcommand wiring. See ADR 0001 §"Extension points".
[lib]
name = "temps_cli"
path = "src/lib.rs"

[features]
default = []
# Embed the network policy eBPF programs (needs nightly Rust with rust-src
# and bpf-linker at build time). Without it nodes enforce with nftables.
ebpf = ["temps-network-policy/ebpf", "temps-node-agent/ebpf"]

[dependencies]
# All library crates
temps-node-agent = { path = "../temps-node-agent" }
temps-ai-api-tools = { path = "../temps-ai-api-tools" }
temps-edge = { path = "../temps-edge" }
temps-ai-gateway = { path = "../temps-ai-gateway" }
temps-ai-chat = { path = "../temps-ai-chat" }
temps-analytics = { path = "../temps-analytics" }
temps-analytics-events = { path = "../temps-analytics-events" }
temps-blob = { path = "../temps-blob" }
temps-kv = { path = "../temps-kv" }
temps-flags = { path = "../temps-flags" }
temps-ingress = { path = "../temps-ingress" }
temps-file-store = { path = "../temps-file-store" }
temps-analytics-funnels = { path = "../temps-analytics-funnels" }
temps-analytics-performance = { path = "../temps-analytics-performance" }
temps-analytics-session-replay = { path = "../temps-analytics-session-replay" }
temps-audit = { path = "../temps-audit" }
temps-auth = { path = "../temps-auth" }
temps-ai-agents = { path = "../temps-ai-agents" }
temps-sandbox = { path = "../temps-sandbox" }
temps-backup = { path = "../temps-backup" }
temps-revenue = { path = "../temps-revenue" }
temps-observability = { path = "../temps-observability" }
temps-config = { path = "../temps-config" }
temps-cloud = { path = "../temps-cloud" }
# `temps backfill cloud-telemetry` loads the instance's own Cloud link state
# (ADR-040) out of process, so it needs the client directly rather than the
# plugin that normally owns it inside `temps serve`.
temps-cloud-client = { path = "../temps-cloud-client" }
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-deployer = { path = "../temps-deployer" }
temps-deployments = { path = "../temps-deployments" }
temps-dns = { path = "../temps-dns" }
temps-network = { path = "../temps-network", features = ["control_plane"] }
temps-domains = { path = "../temps-domains" }
temps-email = { path = "../temps-email" }
temps-email-tracking = { path = "../temps-email-tracking" }
temps-entities = { path = "../temps-entities" }
temps-environments = { path = "../temps-environments" }
temps-error-tracking = { path = "../temps-error-tracking" }
temps-external-plugins = { path = "../temps-external-plugins" }
temps-geo = { path = "../temps-geo" }
temps-git = { path = "../temps-git" }
temps-import = { path = "../temps-import" }
temps-infra = { path = "../temps-infra" }
temps-log-aggregator = { path = "../temps-log-aggregator" }
temps-clickhouse = { path = "../temps-clickhouse" }
temps-deployment-logs = { path = "../temps-deployment-logs" }
temps-mcp-server = { path = "../temps-mcp-server" }
temps-metrics = { path = "../temps-metrics" }
temps-monitoring = { path = "../temps-monitoring" }
temps-notifications = { path = "../temps-notifications" }
temps-otel = { path = "../temps-otel" }
temps-product-telemetry = { path = "../temps-product-telemetry" }
temps-projects = { path = "../temps-projects" }
temps-providers = { path = "../temps-providers" }
temps-proxy = { path = "../temps-proxy" }
temps-workload = { path = "../temps-workload" }
temps-workload-activator = { path = "../temps-workload-activator" }
temps-workload-plane = { path = "../temps-workload-plane" }
temps-routes = { path = "../temps-routes" }
temps-queue = { path = "../temps-queue" }
temps-screenshots = { path = "../temps-screenshots" }
temps-status-page = { path = "../temps-status-page" }
temps-static-files = { path = "../temps-static-files" }
temps-teams = { path = "../temps-teams" }
temps-project-groups = { path = "../temps-project-groups" }
temps-vulnerability-scanner = { path = "../temps-vulnerability-scanner" }
temps-webhooks = { path = "../temps-webhooks" }
temps-wireguard = { path = "../temps-wireguard" }
temps-network-policy = { path = "../temps-network-policy" }
tokio-util = { workspace = true }

# CLI and runtime dependencies - reference from crates workspace
clap = { workspace = true }
colored = { workspace = true }
chrono = { workspace = true }
# ClickHouse client for the `temps backfill clickhouse --domain ...` data copy.
# Same version/features as the domain crates so the row structs line up.
clickhouse = { workspace = true }
argon2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
# Blocking HTTPS client handed to the OTLP/HTTP exporter. Must be the same
# reqwest major opentelemetry-http uses (0.13), not the workspace 0.12.
reqwest-otlp = { workspace = true }
anyhow = { workspace = true }
yaml_serde = { workspace = true }
dirs = { workspace = true }
gethostname = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
bollard = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
async-trait = { workspace = true }
sea-orm = { workspace = true }
# Used for Postgres LISTEN/NOTIFY (`settings_change`) so the standalone
# `temps proxy` picks up admin-gate edits made in another process.
sqlx = { workspace = true }
sysinfo = { workspace = true }
include_dir = { workspace = true }
ipnet = { workspace = true }
mime_guess = { workspace = true }
thiserror = { workspace = true }
aws-sdk-s3 = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
indicatif = { workspace = true }
tar = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["default", "http1", "http2", "server-auto"] }
tower = { workspace = true }
