[package]
name = "temps-shield"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shield: proof-of-work challenges, clearance cookies and reputation lists (ADR 066)"

[dependencies]
base64 = { workspace = true }
hmac = "0.13"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
temps-signatures = { path = "../temps-signatures" }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
hickory-resolver = { version = "0.26", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
zstd = { workspace = true }
utoipa = { workspace = true, optional = true }

[features]
# `ja4::read_client_hello`, for the ingresses that read a ClientHello off
# a socket.
tokio = ["dep:tokio"]
# `crawler_check`: verifying claimed crawlers by DNS, for the ingresses.
crawlers = ["tokio", "tokio/time", "dep:async-trait", "dep:hickory-resolver", "dep:moka"]
# OpenAPI schemas for the types the console API exchanges (`ShieldMode`).
utoipa = ["dep:utoipa"]

[dev-dependencies]
# Turns on `tokio` for this crate's own tests.
temps-shield = { path = ".", features = ["tokio", "crawlers"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
