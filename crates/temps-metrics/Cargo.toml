[package]
name = "temps-metrics"
version.workspace = true
edition.workspace = true
description = "Metrics collection: node, proxy and managed-service collectors, the scraper, and buffered TimescaleDB and ClickHouse metric stores"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# ClickHouse metrics store (opt-in via TEMPS_CLICKHOUSE_*; TimescaleDB remains
# the default). Version/features mirror temps-otel's CH backend.
clickhouse = { workspace = true }

# Scraper: entity access and config
temps-core = { path = "../temps-core" }
temps-clickhouse = { path = "../temps-clickhouse" }
temps-config = { path = "../temps-config" }
temps-entities = { path = "../temps-entities" }

# Postgres collector
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }

# MariaDB collector (a single short-lived MySqlConnection per scrape).
sqlx = { workspace = true }

# MongoDB collector. Use mongodb's own re-exported `mongodb::bson` types
# rather than a standalone `bson` dependency — a standalone version can drift
# out of sync with whatever bson version `mongodb` pins internally.
mongodb = { workspace = true, features = ["default"] }

# Redis collector
redis = { workspace = true }

# S3 collector
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-http-client = { workspace = true }
webpki-root-certs = { workspace = true }
pem = { workspace = true }
reqwest = { workspace = true }

# Node collector (Linux /proc + statvfs)
libc = { workspace = true }

# Node collector fallback for hosts without /proc (macOS dev boxes): CPU,
# memory, block and network I/O. Linux keeps reading /proc directly.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { workspace = true }

[dev-dependencies]
temps-database = { path = "../temps-database" }
testcontainers = { workspace = true, features = ["http_wait_plain"] }
tempfile = { workspace = true }

[lints]
workspace = true
