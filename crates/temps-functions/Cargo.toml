[package]
name = "temps-functions"
description = "Functions: an uploaded WASM module or OCI image run as a scale-to-zero workload behind the activator (ADR-055 phase 10)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# A product on the workload plane. It never links a runtime driver: the
# plane picks one by capability (the WASM driver exists only in a `temps`
# built with `--features wasm`).
[dependencies]
temps-core = { path = "../temps-core" }
temps-auth = { path = "../temps-auth" }
temps-config = { path = "../temps-config" }
temps-entities = { path = "../temps-entities" }
temps-workload = { path = "../temps-workload" }
temps-workload-activator = { path = "../temps-workload-activator" }
temps-workload-ingress = { path = "../temps-workload-ingress" }
temps-workload-plane = { path = "../temps-workload-plane" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
temps-database = { path = "../temps-database" }
# The end-to-end test runs a real WASM function; the crate itself does not
# depend on the driver (the binary adds it behind its `wasm` feature).
temps-workload-wasm = { path = "../temps-workload-wasm" }
wat = "1"
