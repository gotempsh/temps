[package]
name = "temps-dns"
version.workspace = true
edition.workspace = true
description = "DNS provider management (Cloudflare, Route 53, DigitalOcean and others) for automatic record setup, with manual instructions as fallback"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-auth = { path = "../temps-auth" }
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
# ADR-024: the control plane runs the same per-node Hickory resolver as workers,
# fed directly from the local service_endpoints DB.
temps-node-dns = { path = "../temps-node-dns" }
hickory-proto = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sea-orm = { workspace = true }

# HTTP client for DNS APIs
reqwest = { workspace = true }

# Cloudflare API client
cloudflare = "0.14"

# AWS Signature V4 signing for Route53
hmac = { workspace = true }
sha2 = { workspace = true }
sha2_010 = { workspace = true }
hex = { workspace = true }

# GCP service account authentication
rsa = { workspace = true }
base64 = { workspace = true }

# XML parsing for Route53
quick-xml = { workspace = true }

# URL encoding
urlencoding = { workspace = true }

# Web framework
axum = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Error handling & logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
testcontainers = { workspace = true }
temps-migrations = { path = "../temps-migrations" }
sea-orm-migration = { workspace = true }
temps-projects = { path = "../temps-projects" }
wiremock = { workspace = true }
serial_test = { workspace = true }
tower.workspace = true
# ADR-024 integration test: in-process DNS client to query the real
# control-plane resolver over a UDP socket (mirrors temps-node-dns's
# own end_to_end.rs client).
hickory-resolver = { workspace = true }
# The policy slot test: a restricted snapshot for the test client's address.
temps-workload = { path = "../temps-workload" }
temps-workload-netpol = { path = "../temps-workload-netpol" }

[lints]
workspace = true
