[package]
name = "temps-blob"
version.workspace = true
edition.workspace = true
description = "Project-isolated S3-compatible blob storage service and HTTP API backed by RustFS"
license.workspace = true
authors.workspace = true

[dependencies]
# Internal crates
temps-core = { path = "../temps-core" }
temps-config = { path = "../temps-config" }
temps-auth = { path = "../temps-auth" }
temps-providers = { path = "../temps-providers" }
temps-entities = { path = "../temps-entities" }

# Async runtime
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true

# Web framework
axum.workspace = true
http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling & logging
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Date/Time & UUID
chrono.workspace = true
uuid.workspace = true

# API Documentation
utoipa = { workspace = true, features = ["chrono"] }

# S3/MinIO client
aws-sdk-s3.workspace = true

# Docker container management
bollard.workspace = true

# Utilities
rand.workspace = true
bytes.workspace = true
sea-orm.workspace = true
urlencoding.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
