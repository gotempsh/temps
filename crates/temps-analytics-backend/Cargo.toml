[package]
name = "temps-analytics-backend"
version.workspace = true
edition.workspace = true
description = "Analytics storage abstraction: the AnalyticsBackend trait with TimescaleDB and ClickHouse implementations, migrations and retention"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Core
temps-core = { path = "../temps-core" }
temps-clickhouse = { path = "../temps-clickhouse" }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Time
uuid = { workspace = true }

# ClickHouse client. Always linked — operators flip CH on by setting
# TEMPS_CLICKHOUSE_*; we don't make them rebuild with a feature flag for it.
clickhouse = { workspace = true }

[dev-dependencies]
temps-database = { path = "../temps-database" }
testcontainers = { workspace = true, features = ["http_wait_plain"] }
bollard = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
