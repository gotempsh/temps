[package]
name = "temps-analytics-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Enables the ClickHouse analytics backend. Off by default so a stock build
# stays a single binary against PostgreSQL/TimescaleDB only.
clickhouse = ["dep:clickhouse"]

[dependencies]
# Core
temps-core = { path = "../temps-core" }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Time
chrono = { workspace = true }
uuid = { workspace = true }

# Optional: ClickHouse client. Pulled in only when the `clickhouse` feature
# is enabled so default builds stay a single static binary against PG.
clickhouse = { version = "0.13", optional = true, features = ["uuid", "chrono"] }

[dev-dependencies]
tokio = { workspace = true }
