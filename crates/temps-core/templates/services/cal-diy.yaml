# Cal.diy is Cal.com's MIT-licensed, self-hosted community edition. Upstream
# recommends it for personal/non-production use, not customer-facing booking
# infrastructure -- see https://github.com/calcom/cal.diy. The same
# release-docker.yaml CI build pushes this image to several Docker Hub
# namespaces (calcom/cal.com, calcom/cal.diy, calendso/calendso); only
# calcom/cal.com and calendso/calendso actually have published tags
# (calcom/cal.diy has none as of this writing) -- pinned here to v6.2.0,
# the latest cal.diy git tag at the time this was added. It does not publish
# a real multi-arch manifest under one tag/digest -- amd64 and arm64 are
# separate, separately-versioned tags (v6.2.0 vs v6.2.0-arm) -- hence the
# separate image_arm64 pin below.
slug: cal-diy
name: Cal.diy
version: 6.2.0
kind: service
description: Self-hosted scheduling and booking pages backed by a Temps-managed PostgreSQL database -- Cal.com's open-source community edition. MIT-licensed, no license key. Upstream recommends personal/non-production use only.
git:
  url: https://github.com/calcom/cal.diy.git
  ref: v6.2.0
preset: dockerfile
image: docker.io/calcom/cal.com@sha256:ace3bb1219fb7306585ab9f4d94d41af7ee064c343db0498173436bbe857bd49
image_arm64: docker.io/calcom/cal.com@sha256:4b0fa72eec13bd3ddb608a6d13f05bf0ebc136e73832abfe1a8ec145db9e4651
resources:
  cpu_request: 500000
  cpu_limit: 1000000
  memory_request: 512
  memory_limit: 1024
exposed_port: 3000
health_check_path: /
tags:
  - scheduling
  - booking
  - calendar
  - self-hosted
features:
  - Booking pages, availability rules, and buffers
  - Calendar sync with Google, Outlook, and Apple Calendar
  - "Team scheduling: round-robin and collective event types"
  - PostgreSQL managed, backed up, and restored by Temps
services:
  - postgres
managed_service_bindings:
  postgres:
    DATABASE_URL: POSTGRES_URL
    DATABASE_DIRECT_URL: POSTGRES_URL
env_vars:
  - name: NEXT_PUBLIC_WEBAPP_URL
    description: Public URL this app is served on.
    required: true
    default_generator: app_url
  - name: NEXTAUTH_URL
    description: Must equal NEXT_PUBLIC_WEBAPP_URL.
    required: true
    default_generator: app_url
  - name: NEXTAUTH_SECRET
    description: Session-signing secret for NextAuth.
    required: true
    secret: true
    default_generator: random_secret
  - name: CALENDSO_ENCRYPTION_KEY
    description: Symmetric key (AES-256, 32 bytes) used to encrypt stored calendar credentials.
    required: true
    secret: true
    default_generator: random_secret
  - name: EMAIL_FROM
    description: From address for booking confirmation and reminder emails.
    example: notifications@yourselfhostedcal.example
    required: false
  - name: EMAIL_SERVER_HOST
    description: SMTP server host for outgoing email.
    required: false
  - name: EMAIL_SERVER_PORT
    description: SMTP server port.
    example: "587"
    required: false
is_public: true
is_featured: true
sort_order: 2
