[package]
name = "temps-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional client that links a self-hosted Temps instance to a managed backend."

[dependencies]
temps-cloud-protocol = { path = "../temps-cloud-protocol" }
temps-core = { path = "../temps-core" }
# ADR-041 §3a: the Cloud-primary write path's durable outbox is a Postgres
# table, deliberately reusing the proven `events_ch_outbox` pattern rather than
# inventing a file queue. Postgres is unconditionally present on every
# deployment shape, so this adds no new runtime dependency — only a compile-time
# one on the entity definitions and the ORM the rest of the workspace already
# uses.
temps-entities = { path = "../temps-entities" }
sea-orm = { workspace = true }

async-trait.workspace = true
base64.workspace = true
# ADR-045 §3: the console-proxy dispatcher (`src/console_proxy.rs`) hands a
# synthesized request to the instance's own console `Router` and, for a
# WebSocket-upgrading request, drives hyper's own client/server upgrade
# machinery over an in-process `tokio::io::duplex` pair rather than
# reimplementing RFC 6455 (ADR-045 §3's "WebSocket upgrade passthrough").
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
# Points a stock ClickHouse client at Temps Cloud's HTTP-interface read proxy
# (`src/query.rs`). Same 0.15 line as `temps-otel` and `temps-analytics-backend`
# so the workspace resolves one version.
#
# The TLS features are what those two crates do not need: they talk to a local
# ClickHouse over plain HTTP, whereas the Cloud backend is HTTPS. `ring` matches
# the provider the workspace already pins for `rustls`/`tokio-rustls`, and
# webpki roots match what `reqwest`'s `rustls-tls` feature already gives
# `CloudClient`. The connector stays `https_or_http`, so the existing plain-HTTP
# ClickHouse callers are unaffected by the feature unification.
clickhouse = { version = "0.15", features = ["rustls-tls-ring", "rustls-tls-webpki-roots"] }
hmac = "0.13"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# The heartbeat sender's transport (`src/heartbeat.rs`): a long-lived
# WebSocket to the managed backend's `/v1/management` endpoint. Same version
# and TLS feature set already pinned at the workspace level and used the same
# way by `temps-deployments`' remote-terminal proxy, so this resolves one
# tokio-tungstenite across the workspace rather than a second one.
tokio-tungstenite.workspace = true
tower.workspace = true
# `hyper`'s client/server connection drivers, used only by the console-proxy
# upgrade relay (see the `axum` comment above). Same workspace-pinned version
# every other crate resolves, so this adds no second copy.
hyper.workspace = true
# Adapts `tokio::io::duplex`'s halves to `hyper::rt::{Read, Write}`. Not a
# workspace dependency elsewhere yet, but the version below matches what the
# lockfile already resolves transitively through `axum`/`hyper`, so this does
# not add a second copy either.
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
futures.workspace = true
# `test-util` backs `#[tokio::test(start_paused = true)]`, used by
# `console_proxy`'s idle-timer tests to advance virtual time instantly
# instead of sleeping for real minutes.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
