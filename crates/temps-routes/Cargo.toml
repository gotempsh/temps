[package]
name = "temps-routes"
version.workspace = true
edition.workspace = true
description = "Proxy route table kept in sync via Postgres LISTEN/NOTIFY, plus ingress endpoints, the gate, Shield and public-ingress sync"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
arc-swap.workspace = true
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
# The Shield mode and policy a worker route carries (ADR 066, D10).
temps-shield = { path = "../temps-shield" }

# Database
sea-orm = { workspace = true }
sqlx = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# Logging
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
x509-parser = { workspace = true }
rustls-pemfile = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP for the internal route-sync endpoint that workers long-poll
# against. Same wire model as `temps-dns::handlers::dns_sync`.
axum = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

# Constant-time byte comparison for the per-node bearer-token hash check.
# Same crate already pulled in by temps-revenue.
subtle = { workspace = true }

# ADR-055 ingress endpoints compiled into the route snapshot.
temps-workload-ingress = { path = "../temps-workload-ingress" }
ipnetwork = { workspace = true }
# Shield event uploads from workers are gzip JSON (ADR 066, I8).
flate2 = { workspace = true }
base64 = { workspace = true }

# Fetches Cloudflare Access signing keys (ADR 065 D9).
reqwest = { workspace = true }

[lints]
workspace = true
