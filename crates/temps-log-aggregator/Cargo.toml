[package]
name = "temps-log-aggregator"
version.workspace = true
edition.workspace = true
description = "Container runtime log aggregation: collection, compressed chunk storage on disk or S3, indexed search, live tail and retention"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-auth = { path = "../temps-auth" }
temps-core = { path = "../temps-core" }
temps-config = { path = "../temps-config" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }

sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
utoipa = { workspace = true }
bollard = { workspace = true }
aws-sdk-s3 = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
memchr = { workspace = true }
xxhash-rust = { workspace = true }
crc32fast = { workspace = true }
arc-swap = { workspace = true }
clickhouse = { workspace = true }
temps-clickhouse = { path = "../temps-clickhouse" }
temps-cloud-client = { path = "../temps-cloud-client" }

[dev-dependencies]
sea-orm = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
axum-test = { workspace = true }
serial_test = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
temps-database = { path = "../temps-database" }
temps-auth = { path = "../temps-auth" }
temps-entities = { path = "../temps-entities" }
regex = { workspace = true }
testcontainers = { workspace = true, features = ["http_wait_plain"] }

[lints]
workspace = true
