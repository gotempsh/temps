[package]
name = "temps-email"
version.workspace = true
edition.workspace = true
description = "Transactional email: provider credentials (AWS SES, Scaleway), sending domains with SPF and DKIM verification, and sent-email storage"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-auth = { path = "../temps-auth" }
temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-database = { path = "../temps-database" }
temps-dns = { path = "../temps-dns" }
temps-entities = { path = "../temps-entities" }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sea-orm = { workspace = true }

# HTTP client for Scaleway
reqwest = { workspace = true }

# AWS SES
aws-sdk-sesv2 = { workspace = true }
# AWS SNS — event-tracking auto-setup (topic creation + webhook subscription).
# Same feature set as aws-sdk-sesv2: modern default-https-client, NOT the
# deprecated `rustls` feature, which drags in the legacy rustls 0.21 /
# rustls-webpki 0.101 stack (RUSTSEC-2026-0098/0099/0104).
aws-sdk-sns = { workspace = true }
aws-config = { workspace = true }

# Generic SMTP transport
lettre = { workspace = true }

# Web framework
axum = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Error handling & logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# DNS resolution
hickory-resolver = { workspace = true }

# Email validation (native): SMTP probing over SOCKS5 + Gravatar hashing
tokio-socks = { workspace = true }
md5 = { workspace = true }

[dev-dependencies]
testcontainers = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true
