[package]
name = "temps-sandbox-providers"
version.workspace = true
edition.workspace = true
description = "Sandbox backends behind one provider trait: Docker, Firecracker, microsandbox, local, and worker nodes over their remote protocol"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# ELF builders the sandbox plugin's tests in temps-ai-agents share with this crate's.
test-support = []

[dependencies]
temps-agent-core = { path = "../temps-agent-core" }
temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-service-access-runtime = { path = "../temps-service-access-runtime" }
uuid.workspace = true
temps-docker-util = { path = "../temps-docker-util" }
temps-entities = { path = "../temps-entities" }
temps-vm-agent = { path = "../temps-vm-agent" }
# ADR-055 §6: sandbox backends are runtime drivers (`SandboxExt`).
temps-workload = { path = "../temps-workload", features = ["openapi"] }
sea-orm = { workspace = true }
tokio = { workspace = true, features = ["process", "fs"] }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bollard = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
# ADR-055 phase 6: sandbox byte channels (terminal, agent runtime) to worker nodes.
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
http-body-util = { workspace = true }
tar = { workspace = true }
walkdir = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

# microsandbox microVM backend (ADR-050). Pinned exactly: the SDK is pre-1.0
# and its runtime binary + libkrunfw ABI move in lockstep with the crate.
# Default features are off: `download-binaries` fetches the runtime from the
# network inside build.rs, `cloud` / `keyring` are unused. Not linked on musl
# (the Alpine container image) or on Intel macOS: the SDK's VMM crate does not
# compile there, and the backend reports itself unavailable with that reason
# instead. The same predicate gates every use of the SDK in this crate and in
# `temps-cli`'s `microsandbox` command — keep them in step.
[target.'cfg(not(any(target_env = "musl", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
microsandbox = { workspace = true }

[dev-dependencies]
tokenless-core = { git = "https://github.com/gotempsh/tokenless", rev = "1475fa0fa9684124976e2e68e472e5bf529029d2" }
tokenless-control = { git = "https://github.com/gotempsh/tokenless", rev = "1475fa0fa9684124976e2e68e472e5bf529029d2" }
temps-test-utils = { path = "../temps-test-utils" }
# ADR-055 golden captures of the container-create request.
temps-docker-capture = { path = "../temps-docker-capture" }
# ADR-055 §9: the netpol translation must deserialize into the pinned SDK.
temps-workload-netpol = { path = "../temps-workload-netpol" }

[lints]
workspace = true
