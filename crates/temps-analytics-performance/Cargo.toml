[package]
name = "temps-analytics-performance"
version.workspace = true
edition.workspace = true
description = "Web performance analytics: ingest and query Core Web Vitals (LCP, CLS, INP, FCP, TTFB) per project"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-core = { path = "../temps-core" }
temps-entities = { path = "../temps-entities" }
temps-routes = { path = "../temps-routes" }
temps-geo = { path = "../temps-geo" }
temps-auth = { path = "../temps-auth" }
# ADR-040 analytics ingest keys. Downward-only: temps-analytics depends on
