[package]
name = "temps-workflows"
version.workspace = true
edition.workspace = true
description = "Durable workflows orchestrated by the control plane: run state, the step journal, waits, leases, the scheduler and invoker, and the workflows API (ADR-106)"
license.workspace = true
authors.workspace = true

[dependencies]
# Internal crates: core traits, entities, authorization. Never deployments,
# the proxy, analytics or error tracking (ADR-106 §0).
temps-core = { path = "../temps-core" }
temps-authz = { path = "../temps-authz" }
temps-entities = { path = "../temps-entities" }

# Web framework
axum.workspace = true
http-body-util.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling & logging
thiserror.workspace = true
tracing.workspace = true

# Date/Time & IDs
chrono.workspace = true
uuid.workspace = true

# API Documentation
utoipa = { workspace = true, features = ["chrono", "uuid"] }

# Data access
sea-orm.workspace = true
sqlx.workspace = true

# Invocations
reqwest.workspace = true
bytes.workspace = true

# Tokens and credentials
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true

[dev-dependencies]
temps-workflows-sdk = { path = "../temps-workflows-sdk" }
tempfile.workspace = true
sea-orm-migration.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
tower.workspace = true
temps-test-utils = { path = "../temps-test-utils" }
temps-migrations = { path = "../temps-migrations" }
testcontainers.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true

[lints]
workspace = true
