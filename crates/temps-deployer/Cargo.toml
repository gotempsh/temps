[package]
name = "temps-deployer"
version.workspace = true
edition.workspace = true
description = "Container runtime layer: Docker image builds, container lifecycle, compose, static deploys, remote node deployers and Traefik discovery"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nix = { workspace = true, features = ["fs"] }
temps-runtime-health = { path = "../temps-runtime-health" }
# ADR-055 phase 1: containers are created through the Docker driver.
temps-workload = { path = "../temps-workload" }
temps-workload-docker = { path = "../temps-workload-docker" }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tar = { workspace = true }
# `.dockerignore` matching for worker build contexts (already in the lockfile).
globset = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
num_cpus = { workspace = true }
sea-orm = { workspace = true }
aws-sdk-s3 = { workspace = true }
temps-core = { path = "../temps-core" }
temps-config = { path = "../temps-config" }
# Shared S3-client-construction helper and backend-selection config for the
# S3-compatible StaticDeployer, so it can never disagree with S3FileStore
# (used for the CAS store) about how to build a client.
temps-file-store = { path = "../temps-file-store" }
# Traefik label discovery persists its routes as `traefik_discovered_routes`
# rows so the existing route-table NOTIFY machinery propagates them.
temps-entities = { path = "../temps-entities" }
temps-presets = { path = "../temps-presets" }
temps-network = { path = "../temps-network", features = ["control_plane"] }
# ADR-024: control-plane DNS resolver bootstrap (CP-only path; workers wire DNS
# via `temps agent`).
temps-node-dns = { path = "../temps-node-dns" }
utoipa = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
regex = { workspace = true }
# Compose `command:` strings are split the way Compose splits them (ADR-055 §14).
shlex = { workspace = true }

[dev-dependencies]
# Paused-clock tests (`start_paused`, `time::advance`).
tokio = { workspace = true, features = ["test-util"] }
# ADR-055 golden captures of the container-create request.
temps-docker-capture = { path = "../temps-docker-capture" }
http = { workspace = true }
# A fake agent that serves mutual TLS, for the mesh-dial client test.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
# Traefik discovery integration tests: real Postgres (schema-isolated) plus
# real labelled containers on a real Docker network, asserted through the real
# route table. All skip gracefully when Docker is unavailable.
testcontainers = { workspace = true }
temps-database = { path = "../temps-database" }
temps-routes = { path = "../temps-routes" }

[lints]
workspace = true
