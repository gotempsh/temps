[package]
name = "temps-deployer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
http-body-util = "0.1"
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tar = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
num_cpus = "1.16"
sea-orm = { workspace = true }
temps-core = { path = "../temps-core" }
temps-config = { path = "../temps-config" }
# Traefik label discovery persists its routes as `traefik_discovered_routes`
# rows so the existing route-table NOTIFY machinery propagates them.
temps-entities = { path = "../temps-entities" }
temps-network = { path = "../temps-network" }
# ADR-024: control-plane DNS resolver bootstrap (CP-only path; workers wire DNS
# via `temps agent`).
temps-dns = { path = "../temps-dns" }
utoipa = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
env_logger = "0.11"
tokio-test = "0.4"
mockall = "0.15"
serial_test = "4.0"
# Traefik discovery integration tests: real Postgres (schema-isolated) plus
# real labelled containers on a real Docker network, asserted through the real
# route table. All skip gracefully when Docker is unavailable.
testcontainers = { workspace = true }
temps-database = { path = "../temps-database" }
temps-routes = { path = "../temps-routes" }
