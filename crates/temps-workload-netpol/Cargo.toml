[package]
name = "temps-workload-netpol"
description = "Workload network policy: the rule model, the nftables compiler keyed by workload identity, nft executors and the microsandbox translation (ADR-052 §4, ADR-055 §9, §17)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-workload = { path = "../temps-workload" }
temps-netpol-ebpf-common = { path = "../temps-netpol-ebpf-common" }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
bytes = { workspace = true }
crossbeam-queue = "0.3"
futures = { workspace = true }
httparse = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Builds the network policy eBPF programs (nightly Rust with rust-src and
# bpf-linker) and embeds them; without it the datapath reports that this
# build does not contain them.
ebpf = []

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
libc = { workspace = true }
temps-netpol-ebpf-common = { path = "../temps-netpol-ebpf-common", features = ["user"] }

[dev-dependencies]
rand = { workspace = true }
