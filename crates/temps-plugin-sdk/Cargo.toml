[package]
name = "temps-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDK for building external Temps plugins as standalone binaries"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP framework (plugins build axum routers)
axum = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# CLI args
clap = { version = "4", features = ["derive"] }

# Unix socket support
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["default", "http1", "http2"] }
tower = { workspace = true }

# WebSocket support for the platform channel
tokio-tungstenite = "0.30"
futures = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Shared types from temps
temps-core = { path = "../temps-core" }

# UUID for request IDs
subtle = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
