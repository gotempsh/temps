[package]
name = "temps-plugin-sdk"
version = "0.1.0-beta.61"
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "SDK for building external Temps plugins as standalone binaries"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP framework (plugins build axum routers)
axum = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# CLI args
clap = { version = "4", features = ["derive"] }

# Unix socket support
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["default", "http1", "http2"] }
tower = { workspace = true }

# WebSocket support for the platform channel
tokio-tungstenite = "0.30"
futures = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Constant-time comparison of the platform's proxy secret.
subtle = { workspace = true }

# Wire protocol shared with the platform
temps-plugin-protocol = { path = "../temps-plugin-protocol", version = "=0.1.0-beta.61" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
