[package]
name = "temps-flags"
version.workspace = true
edition.workspace = true
description = "Feature flags: per-project flags with per-environment values, evaluation and bucketing, changed without a redeploy"
license.workspace = true
authors.workspace = true

[dependencies]
# Internal crates
temps-core = { path = "../temps-core" }
temps-authz = { path = "../temps-authz" }
temps-entities = { path = "../temps-entities" }
temps-routes = { path = "../temps-routes" }
temps-geo = { path = "../temps-geo" }

# Web framework
axum.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling & logging
thiserror.workspace = true
tracing.workspace = true

# Date/Time & IDs
chrono.workspace = true
uuid.workspace = true

# API Documentation
utoipa.workspace = true

# Data access
sea-orm.workspace = true

# Bucketing hash + ETag
sha2.workspace = true
hex.workspace = true

# `matches` conditions: linear-time, size-limited patterns
regex.workspace = true

# Evaluation endpoints: lock-free flag cache, bounded loads, implicit context
arc-swap.workspace = true
tokio = { workspace = true, features = ["sync"] }
woothee.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
async-trait.workspace = true

[lints]
workspace = true
