[package]
name = "temps-network-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network policy rules for every workload kind, per-node modes, and the node-0 enforcer (ADR-052 §4, ADR-055 phase 7)"

[dependencies]
temps-auth = { path = "../temps-auth" }
temps-core = { path = "../temps-core" }
temps-entities = { path = "../temps-entities" }
temps-routes = { path = "../temps-routes" }
temps-workload = { path = "../temps-workload" }
temps-workload-netpol = { path = "../temps-workload-netpol" }

anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bollard = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["chrono"] }

[features]
default = []
# Embeds the eBPF datapath programs; see temps-workload-netpol.
ebpf = ["temps-workload-netpol/ebpf"]

[dev-dependencies]
temps-database = { path = "../temps-database" }
