[package]
name = "temps-wireguard"
version.workspace = true
edition.workspace = true
description = "WireGuard mesh for multi-node clusters: kernel mesh via netlink, userspace boringtun helpers and node pairing"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
temps-core = { path = "../temps-core" }

# Embedded WireGuard (no external wireguard-tools dependency)
defguard_wireguard_rs = { workspace = true }
x25519-dalek = { workspace = true }

# In-process link up/MTU and address reads for the mesh interface, so the mesh
# path needs CAP_NET_ADMIN and nothing else (no `ip` binary, no euid 0).
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["net"] }

[features]
# Real-kernel tests (tests/it_mesh_kernel.rs); never part of a plain `cargo test`.
integration_kernel = []

[lints]
workspace = true
