[package]
name = "temps-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Embeds the network policy eBPF programs; see temps-workload-netpol.
ebpf = ["temps-workload-netpol/ebpf"]

[dependencies]
temps-runtime-health = { path = "../temps-runtime-health" }
arc-swap = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
sysinfo = { workspace = true }
uuid = { workspace = true }
http-body-util = "0.1"
bollard = { workspace = true }
bytes = { workspace = true }
temps-core = { path = "../temps-core" }
temps-auth = { path = "../temps-auth" }
temps-deployer = { path = "../temps-deployer" }
temps-vulnerability-scanner = { path = "../temps-vulnerability-scanner" }
temps-network = { path = "../temps-network" }
temps-wireguard = { path = "../temps-wireguard" }
temps-dns-resolver = { path = "../temps-dns-resolver" }
chrono = { workspace = true }
temps-providers = { path = "../temps-providers" }
# The node runtime (ADR-055 §7).
temps-workload = { path = "../temps-workload" }
temps-workload-node = { path = "../temps-workload-node" }
temps-workload-docker = { path = "../temps-workload-docker" }
temps-workload-netpol = { path = "../temps-workload-netpol" }
temps-metrics = { path = "../temps-metrics" }
temps-shield = { path = "../temps-shield", features = ["tokio", "crawlers", "netwatch"] }
flate2 = { workspace = true }
ipnet = "2.10"
hickory-resolver = "0.26"
parking_lot = "0.12"
libc = { workspace = true }
if-addrs = "0.15"
x25519-dalek = { workspace = true }
rand = { workspace = true }
# Needed for hyper::upgrade::on in the internal proxy's WS tunnel path,
# and for the mTLS server accept loop (ADR-020 WS-2.1).
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto"] }
# mTLS: the agent serves rustls TLS with client-cert verification (WS-2.1).
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = "0.18"
tokio-rustls = { workspace = true }
tar = { workspace = true }
temps-agents = { path = "../temps-agents" }
temps-external-plugins = { path = "../temps-external-plugins" }
base64 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# ADR-055 golden captures of the container-create request.
temps-docker-capture = { path = "../temps-docker-capture" }
# ADR-055 Phase 4: `external_services` rows for the shadow-pass proof.
temps-entities = { path = "../temps-entities" }
tempfile = "3"
rcgen = { workspace = true }
# `test-util` provides the paused clock the build-queue tests use.
tokio = { workspace = true, features = ["test-util"] }
