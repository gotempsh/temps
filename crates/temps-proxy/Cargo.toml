[package]
name = "temps-proxy"
version.workspace = true
edition.workspace = true
description = "Pingora reverse proxy: request routing, TLS and on-demand certificates, request logs, IP access control, rate limits and Shield"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
temps-analytics = { path = "../temps-analytics" }
temps-auth = { path = "../temps-auth" }
temps-config = { path = "../temps-config" }
temps-core = { path = "../temps-core" }
temps-clickhouse = { path = "../temps-clickhouse" }
temps-database = { path = "../temps-database" }
temps-entities = { path = "../temps-entities" }
temps-file-store = { path = "../temps-file-store" }
temps-geo = { path = "../temps-geo" }
temps-routes = { path = "../temps-routes" }
temps-workload-ingress = { path = "../temps-workload-ingress" }
temps-workload-activator = { path = "../temps-workload-activator" }
temps-edge-rules = { path = "../temps-edge-rules" }
temps-shield = { path = "../temps-shield", features = ["tokio", "crawlers", "netwatch", "utoipa"] }
temps-metrics = { path = "../temps-metrics" }
serde = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
cookie = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
htmd = { workspace = true }
scraper = { workspace = true }
pingora = { workspace = true, features = ["lb"] }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
pingora-proxy = { workspace = true }
pingora-openssl = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
argon2 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clickhouse = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
utoipa = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
moka = { workspace = true }
ipnetwork = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
once_cell = { workspace = true }
woothee = { workspace = true }
rustls = { workspace = true, features = ["default"] }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
url = { workspace = true }

[features]
# Enable DB-backed integration tests (require a running PostgreSQL instance)
integration = []

[dev-dependencies]
testcontainers = { workspace = true, features = ["http_wait_plain"] }
temp-dir = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
temps-presets = { path = "../temps-presets" }
# The edge rule change-feed test listens on Postgres NOTIFY directly.
sqlx = { workspace = true }

[lints]
workspace = true
