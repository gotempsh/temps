name: Publish TypeScript plugin SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches Temps version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(awk '/^\[workspace.package\]/{found=1; next} found && /^version = /{gsub(/[\" ]/, "", $3); print $3; exit}' Cargo.toml)"
          test "$tag_version" = "$workspace_version"
      - name: Verify release commit is on main
        shell: bash
        run: |
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main
      - name: Set package version from Temps release
        working-directory: sdks/node/packages/plugin-sdk
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Install locked dependencies
        working-directory: sdks/node
        run: bun install --frozen-lockfile
      - name: Build and test SDK
        working-directory: sdks/node/packages/plugin-sdk
        run: |
          bun run build
          bun run test:run
      - name: Pack and inspect package
        working-directory: sdks/node/packages/plugin-sdk
        run: npm pack --dry-run
      - name: Publish with npm trusted publishing
        working-directory: sdks/node/packages/plugin-sdk
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi
          npm publish --access public --provenance --tag "$npm_tag"
