name: Publish TypeScript plugin SDK

on:
  push:
    tags:
      - "plugin-sdk-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches package version
        working-directory: sdks/node/packages/plugin-sdk
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#plugin-sdk-v}"
          package_version="$(node -p 'require("./package.json").version')"
          test "$tag_version" = "$package_version"
      - name: Verify release commit is on main
        shell: bash
        run: |
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main
      - name: Install locked dependencies
        working-directory: sdks/node
        run: bun install --frozen-lockfile
      - name: Build and test SDK
        working-directory: sdks/node/packages/plugin-sdk
        run: |
          bun run build
          bun run test:run
      - name: Create artifact directory
        run: mkdir -p artifacts
      - name: Pack SDK
        working-directory: sdks/node/packages/plugin-sdk
        run: npm pack --pack-destination ../../../../artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-sdk-package
          path: artifacts/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-sdk-package
          path: artifacts
      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#plugin-sdk-v}"
          package_path="artifacts/temps-sdk-plugin-${version}.tgz"
          test -f "$package_path"
          if [[ "$version" == *-* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi
          npm publish "$package_path" --access public --provenance --tag "$npm_tag" --ignore-scripts
