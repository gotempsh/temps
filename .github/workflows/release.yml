name: Release

# Actions cache is read-only here (`cache-from` without `cache-to`, explicit
# `actions/cache/restore`, and `Swatinem/rust-cache` with saving disabled).
#
# GitHub scopes Actions cache *writes* to the ref that produced them, and
# scopes *reads* to the current ref plus the default branch. Publishing runs
# execute on a tag ref — either the `push: tags:` trigger below, or
# `workflow_dispatch --ref <tag>` from `nightly-release.yml`. A cache written
# on a tag is therefore readable by exactly one thing: another run on that
# same tag, which normally never happens. Manual branch dry-runs follow the
# same restore-only policy so this workflow cannot unexpectedly consume the
# shared cache budget.
#
# So every byte `cache-to: type=gha,mode=max` wrote here was unreadable, and
# it was not free: the repo cache is a single 10GB LRU pool. One nightly run
# left 206 `buildkit-blob-*` entries totalling 7.4GB behind, evicting the
# Rust build caches that `rust-tests.yml` and the e2e job depend on. That is
# what turned the Compose Security job's musl build from ~5 minutes into 81.
#
# Reads stay: `sandbox-images-beta.yml` writes the `sandbox-*` and
# `preview-gateway` scopes from `main`, where they *are* readable from a tag.
# If cross-nightly layer reuse becomes worth it, use a registry-backed cache
# (`type=registry,ref=ghcr.io/...:buildcache`) — it does not touch the 10GB
# Actions cache budget and is readable across refs.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  # Manual dispatch lets us dry-run the pipeline without minting a junk
  # tag. Useful when iterating on the workflow itself or verifying a fix
  # before cutting a real release. The artifact tags include the run id
  # so a manual run can never overwrite a real release artifact.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: skip pushes, only build to verify the pipeline works"
        required: false
        type: boolean
        default: true
      skip_test_gate:
        description: "EMERGENCY ONLY: publish without a green rust-tests.yml run for this commit (logged in the run summary)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: 1

permissions: {}

jobs:
  daemon-images:
    needs: validate-release-ref
    uses: ./.github/workflows/daemon-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      revision_only: true
      # Publish content-addressed dependencies before compiling the server.
      channel: ${{ (inputs.dry_run == true || contains(github.ref_name, '-')) && 'beta' || 'stable' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

  validate-release-ref:
    name: Validate Release Ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject unsafe publishing refs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: .github/scripts/validate-release-ref.sh "$DRY_RUN" "$REF_TYPE" "$REF_NAME"

  # The release runs no tests of its own, so it must not publish a commit the
  # test workflow has not passed. Rather than re-running the whole suite here
  # (hours of runner time, plus caches written to a tag scope nothing can
  # read -- see the note at the top of this file), ask GitHub whether
  # rust-tests.yml already succeeded for this exact SHA, waiting for an
  # in-flight run (e.g. the `main` push that `scripts/release.sh` sends next
  # to the tag). Builds start in parallel; only the jobs that make anything
  # public (alias promotion, the GitHub Release and the server image after
  # it) wait for this gate.
  #
  # Emergency bypass: a maintainer (workflow_dispatch needs write access)
  # dispatches this workflow at the tag with
  #   gh workflow run release.yml --ref <tag> -f dry_run=false -f skip_test_gate=true
  # The bypass is recorded as a warning and in the run summary.
  require-tests:
    name: Require passing Rust Tests
    needs: validate-release-ref
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Wait for rust-tests.yml to pass for this commit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_TEST_GATE: ${{ inputs.skip_test_gate }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry-run: nothing is published, so the test gate is not enforced."
            exit 0
          fi
          if [[ "$SKIP_TEST_GATE" == "true" ]]; then
            echo "::warning::Test gate BYPASSED by $TRIGGERING_ACTOR for $REF_NAME ($RELEASE_SHA)"
            {
              echo "## Release test gate bypassed"
              echo ""
              echo "\`$REF_NAME\` ($RELEASE_SHA) was published by **$TRIGGERING_ACTOR** with \`skip_test_gate=true\`,"
              echo "without a verified green \`rust-tests.yml\` run for this commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/release_test_gate.py \
            --repository "$REPOSITORY" \
            --sha "$RELEASE_SHA" \
            --ref-name "$REF_NAME" \
            --workflow rust-tests.yml \
            --timeout-minutes 180

  build-web-assets:
    name: Build web assets (WASM + dist)
    # The web console + captcha WASM are pure static output with no
    # platform/arch dependency, but crates/temps-cli/build.rs rebuilds them
    # on every `cargo build --release` invocation. Build them once here and
    # hand the compiled dist/ to each platform job (via SKIP_WEB_BUILD)
    # instead of paying bun install + wasm-pack + rsbuild build 4x — the
    # most expensive repeat was the macOS Intel job's wasm-pack step alone
    # (7m26s on the last release), on top of a redundant rsbuild build in
    # each of the other 3 jobs.
    needs: validate-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Restore Bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: |
          cd web
          bun install --frozen-lockfile

      - name: Install wasm-pack and Build WASM
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cd crates/temps-captcha-wasm
          bun run build

      - name: Build web dist
        run: |
          cd web
          bun run build
        env:
          RSBUILD_OUTPUT_PATH: ${{ github.workspace }}/crates/temps-cli/dist
          TEMPS_VERSION: ${{ github.ref_name }}

      - name: Upload web dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: crates/temps-cli/dist
          retention-days: 1

  build-linux-amd64:
    name: Build Linux AMD64
    needs: [build-web-assets, runtime-image-manifest]
    # Pinned to 22.04 (glibc 2.35) so the released binary runs on Ubuntu 22.04+/Debian 12+.
    # ubuntu-latest currently resolves to 24.04 (glibc 2.39), which broke the binary on
    # older-but-still-common distros with a "GLIBC_2.38/2.39 not found" error.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-amd64-release
          save-if: false

      - name: Download web dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: crates/temps-cli/dist

      - name: Download verified runtime image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-image-manifest
          path: release-inputs

      - name: Build release binary
        run: cargo build --release --bin temps
        env:
          TEMPS_RELEASE_IMAGE_MANIFEST: ${{ github.workspace }}/release-inputs/runtime-images.json
          SKIP_WEB_BUILD: 1
          CARGO_INCREMENTAL: 0
          TEMPS_VERSION: ${{ github.ref_name }}

      - name: Strip binary
        run: strip target/release/temps

      - name: Rename binary
        run: cp target/release/temps temps

      - name: Create tarball
        run: |
          tar -czf temps-linux-amd64.tar.gz temps LICENSE LICENSE-MIT NOTICE -C release-inputs runtime-images.json
          ls -lh temps-linux-amd64.tar.gz

      - name: Generate checksum
        run: |
          sha256sum temps-linux-amd64.tar.gz > temps-linux-amd64.tar.gz.sha256
          cat temps-linux-amd64.tar.gz.sha256

      - name: Get binary info
        run: |
          file temps
          ./temps --version || echo "Note: Binary may require runtime dependencies"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temps-linux-amd64
          path: |
            temps-linux-amd64.tar.gz
            temps-linux-amd64.tar.gz.sha256

  build-linux-arm64:
    name: Build Linux ARM64
    needs: [build-web-assets, runtime-image-manifest]
    # See build-linux-amd64: pinned to 22.04 (glibc 2.35) for the same broad-compatibility reason.
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-arm64-release
          save-if: false

      - name: Download web dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: crates/temps-cli/dist

      - name: Download verified runtime image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-image-manifest
          path: release-inputs

      - name: Build release binary
        run: cargo build --release --bin temps
        env:
          TEMPS_RELEASE_IMAGE_MANIFEST: ${{ github.workspace }}/release-inputs/runtime-images.json
          SKIP_WEB_BUILD: 1
          CARGO_INCREMENTAL: 0
          TEMPS_VERSION: ${{ github.ref_name }}
          # jemalloc bakes max page size at build time; aarch64 kernels vary
          # (4K/16K/64K). lg-page=16 (64K) makes the binary run on all of them.
          JEMALLOC_SYS_WITH_LG_PAGE: 16

      - name: Strip binary
        run: strip target/release/temps

      - name: Rename binary
        run: cp target/release/temps temps

      - name: Create tarball
        run: |
          tar -czf temps-linux-arm64.tar.gz temps LICENSE LICENSE-MIT NOTICE -C release-inputs runtime-images.json
          ls -lh temps-linux-arm64.tar.gz

      - name: Generate checksum
        run: |
          sha256sum temps-linux-arm64.tar.gz > temps-linux-arm64.tar.gz.sha256
          cat temps-linux-arm64.tar.gz.sha256

      - name: Get binary info
        run: |
          file temps
          ./temps --version || echo "Note: Binary may require runtime dependencies"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temps-linux-arm64
          path: |
            temps-linux-arm64.tar.gz
            temps-linux-arm64.tar.gz.sha256

  build-darwin-amd64:
    name: Build macOS AMD64
    needs: [build-web-assets, runtime-image-manifest]
    # Cross-compiled from Apple Silicon (same host as build-darwin-arm64),
    # not run natively on Intel hardware. GitHub's Intel macOS pool is
    # smaller/older and measured ~2x the wall-clock of the arm64 pool for
    # this job (72m46s vs 40m52s on the last release). x86_64-apple-darwin is
    # a well-supported cross target from an aarch64-apple-darwin host: the
    # same Xcode toolchain/SDK provides both arch slices, and this
    # workspace's native deps (openssl via openssl-src, jemalloc via cc-rs)
    # build from source per-target rather than linking a host-arch system
    # lib, so there's no arch-mismatch risk at link time.
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: darwin-amd64-release
          save-if: false

      - name: Install system dependencies
        run: brew install protobuf

      - name: Download web dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: crates/temps-cli/dist

      - name: Download verified runtime image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-image-manifest
          path: release-inputs

      - name: Build release binary
        run: cargo build --release --bin temps --target x86_64-apple-darwin
        env:
          TEMPS_RELEASE_IMAGE_MANIFEST: ${{ github.workspace }}/release-inputs/runtime-images.json
          SKIP_WEB_BUILD: 1
          CARGO_INCREMENTAL: 0
          TEMPS_VERSION: ${{ github.ref_name }}

      - name: Strip binary
        run: strip target/x86_64-apple-darwin/release/temps

      - name: Rename binary
        run: cp target/x86_64-apple-darwin/release/temps temps

      - name: Create tarball
        run: |
          tar -czf temps-darwin-amd64.tar.gz temps LICENSE LICENSE-MIT NOTICE -C release-inputs runtime-images.json
          ls -lh temps-darwin-amd64.tar.gz

      - name: Generate checksum
        run: |
          shasum -a 256 temps-darwin-amd64.tar.gz > temps-darwin-amd64.tar.gz.sha256
          cat temps-darwin-amd64.tar.gz.sha256

      - name: Get binary info
        run: |
          file temps
          ./temps --version || echo "Note: Binary may require runtime dependencies"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temps-darwin-amd64
          path: |
            temps-darwin-amd64.tar.gz
            temps-darwin-amd64.tar.gz.sha256

  build-darwin-arm64:
    name: Build macOS ARM64
    needs: [build-web-assets, runtime-image-manifest]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install system dependencies
        run: brew install protobuf

      - name: Download web dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: crates/temps-cli/dist

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: darwin-arm64-release
          save-if: false

      - name: Download verified runtime image manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-image-manifest
          path: release-inputs

      - name: Build release binary
        run: cargo build --release --bin temps --target aarch64-apple-darwin
        env:
          TEMPS_RELEASE_IMAGE_MANIFEST: ${{ github.workspace }}/release-inputs/runtime-images.json
          SKIP_WEB_BUILD: 1
          CARGO_INCREMENTAL: 0
          TEMPS_VERSION: ${{ github.ref_name }}

      - name: Strip binary
        run: strip target/aarch64-apple-darwin/release/temps

      - name: Rename binary
        run: cp target/aarch64-apple-darwin/release/temps temps

      - name: Create tarball
        run: |
          tar -czf temps-darwin-arm64.tar.gz temps LICENSE LICENSE-MIT NOTICE -C release-inputs runtime-images.json
          ls -lh temps-darwin-arm64.tar.gz

      - name: Generate checksum
        run: |
          shasum -a 256 temps-darwin-arm64.tar.gz > temps-darwin-arm64.tar.gz.sha256
          cat temps-darwin-arm64.tar.gz.sha256

      - name: Get binary info
        run: |
          file temps
          ./temps --version || echo "Note: Binary may require runtime dependencies"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temps-darwin-arm64
          path: |
            temps-darwin-arm64.tar.gz
            temps-darwin-arm64.tar.gz.sha256


  runtime-image-manifest:
    name: Verify release runtime image set
    needs: [daemon-images, build-and-push-sandbox-images, build-and-push-preview-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: runtime-image-*
          path: image-records
          merge-multiple: true
      - name: Require every image and both architectures
        env:
          IMAGE_REVISION: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python3 .github/scripts/release_image_manifest.py assemble --directory image-records --revision "$IMAGE_REVISION" --output runtime-images.json "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-manifest
          path: runtime-images.json
          retention-days: 1


  promote-runtime-images:
    name: Promote verified runtime aliases
    needs: [require-tests, build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64, runtime-image-manifest, prepare-sandbox-context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-image-manifest
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only after every binary build succeeds
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          SANDBOX_VERSION: ${{ needs.prepare-sandbox-context.outputs.sandbox_image_version }}
          GATEWAY_VERSION: ${{ needs.prepare-sandbox-context.outputs.gateway_version }}
        run: |
          DAEMON_VERSION=$(python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "tools/sandbox-runtime"); from image_metadata import image_version; print(image_version(Path("crates/temps-sandbox/src/services/sandbox_service.rs").read_text()))')
          python3 .github/scripts/release_image_manifest.py promote --manifest runtime-images.json --revision "$IMAGE_REVISION" --channel "$IMAGE_CHANNEL" --daemon-version "$DAEMON_VERSION" --sandbox-version "$SANDBOX_VERSION" --gateway-version "$GATEWAY_VERSION"

  create-release:
    name: Create Release
    # All image sets, embedded manifests and binaries must succeed before
    # publication, and the commit must have passed rust-tests.yml.
    needs: [require-tests, build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64, runtime-image-manifest, promote-runtime-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing of the provenance/SBOM attestations (no secrets).
      id-token: write
      attestations: write
    outputs:
      # Single source of truth for "is this a prerelease?" so every downstream
      # job (server image, manifest merge) makes the same channel decision.
      # Prereleases are tags containing a `-` (e.g. `v0.1.0-beta.6`); stable
      # tags look like `v0.1.0`.
      is_prerelease: ${{ steps.channel.outputs.is_prerelease }}
      # The floating channel tag: stable -> "latest", `-beta.N`/`-rc.N` ->
      # "beta", nightly -> "nightly", anything else -> "" (no floating tag).
      # Image jobs append it so operators can pin to a channel
      # ("ghcr.io/.../temps:beta") instead of an exact version.
      channel_tag: ${{ steps.channel.outputs.channel_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git-cliff needs the full history and every tag to find the
          # previous release and group commits by version.
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release channel
        id: channel
        # Stable tags move `:latest`, real betas/RCs (`-beta.N`, `-rc.N`) move
        # `:beta`, nightlies move `:nightly`, and any other prerelease moves
        # no floating tag. Dry-runs are always prereleases so a test
        # invocation cannot promote to stable by accident. See the script.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/release-channel.sh "$DRY_RUN" "$RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release
          cp artifacts/temps-linux-amd64/* release/
          cp artifacts/temps-linux-arm64/* release/
          cp artifacts/temps-darwin-amd64/* release/
          cp artifacts/temps-darwin-arm64/* release/
          cp artifacts/runtime-image-manifest/runtime-images.json release/
          ls -lh release/

      - name: Create combined checksums file
        run: |
          cd release
          cat temps-linux-amd64.tar.gz.sha256 > checksums.txt
          cat temps-linux-arm64.tar.gz.sha256 >> checksums.txt
          cat temps-darwin-amd64.tar.gz.sha256 >> checksums.txt
          cat temps-darwin-arm64.tar.gz.sha256 >> checksums.txt
          sha256sum runtime-images.json >> checksums.txt
          echo "Combined checksums:"
          cat checksums.txt

      # Supply chain: an SPDX SBOM of what the binary is built from, plus
      # keyless Sigstore-signed attestations (SLSA build provenance and the
      # SBOM) for every published tarball. Keyless means no new secrets: the
      # job's OIDC token (id-token: write) gets a short-lived certificate
      # from the public-good Sigstore instance. Verify a download with
      #   gh attestation verify temps-linux-amd64.tar.gz --repo gotempsh/temps
      - name: Collect SBOM inputs
        run: |
          # Only the manifests that end up in the binary: the Rust workspace
          # and the web console bundled into it. Scanning the whole checkout
          # would also list examples, SDKs and test fixtures.
          mkdir -p sbom-input/web
          cp Cargo.lock sbom-input/
          cp web/package.json web/bun.lock sbom-input/web/

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ github.workspace }}/sbom-input
          format: spdx-json
          output-file: release/temps-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest build provenance for release tarballs
        if: inputs.dry_run != true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/temps-*.tar.gz
            release/runtime-images.json

      - name: Attest SBOM for release tarballs
        if: inputs.dry_run != true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/temps-*.tar.gz
          sbom-path: release/temps-sbom.spdx.json

      - name: Copy install script to release
        run: |
          cp scripts/install.sh release/install.sh
          chmod +x release/install.sh

      - name: Generate Homebrew formula
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A dry-run usually runs against a branch, so GITHUB_REF is
          # refs/heads/<branch> and the prefix-strip below would leave it
          # untouched. A real workflow_dispatch runs at a release tag.
          if [[ "$DRY_RUN" == "true" ]]; then
            VERSION="dryrun-${{ github.run_id }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          SHA256_LINUX_AMD64=$(awk '{print $1}' release/temps-linux-amd64.tar.gz.sha256)
          SHA256_LINUX_ARM64=$(awk '{print $1}' release/temps-linux-arm64.tar.gz.sha256)
          SHA256_DARWIN_AMD64=$(awk '{print $1}' release/temps-darwin-amd64.tar.gz.sha256)
          SHA256_DARWIN_ARM64=$(awk '{print $1}' release/temps-darwin-arm64.tar.gz.sha256)

          echo "Generating Homebrew formula for version $VERSION"
          echo "Linux AMD64 SHA256: $SHA256_LINUX_AMD64"
          echo "Linux ARM64 SHA256: $SHA256_LINUX_ARM64"
          echo "macOS AMD64 SHA256: $SHA256_DARWIN_AMD64"
          echo "macOS ARM64 SHA256: $SHA256_DARWIN_ARM64"

          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{SHA256_LINUX_AMD64}}/$SHA256_LINUX_AMD64/g" \
              -e "s/{{SHA256_LINUX_ARM64}}/$SHA256_LINUX_ARM64/g" \
              -e "s/{{SHA256_DARWIN_AMD64}}/$SHA256_DARWIN_AMD64/g" \
              -e "s/{{SHA256_DARWIN_ARM64}}/$SHA256_DARWIN_ARM64/g" \
              scripts/homebrew-formula.rb.template > release/temps.rb

          echo "Generated formula:"
          cat release/temps.rb

      # CHANGELOG.md is generated from Conventional Commits by git-cliff and
      # never hand-edited (AGENTS.md). `scripts/release.sh` regenerates the
      # committed copy for manual beta/stable cuts, but nightlies are tagged
      # by CI and never touch it, so the in-repo file goes stale between
      # betas. Generate both the notes for this release and the full
      # changelog here, from the tag being released, and publish them with
      # the release instead of linking to whatever the repo file says.
      - name: Select changelog range
        id: changelog
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "args=--strip all --unreleased" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RELEASE_TAG" == *-nightly.* ]]; then
            # A nightly lists what changed since the previous nightly.
            previous="$(git describe --tags --abbrev=0 --match 'v*-nightly.*' "$RELEASE_TAG^" 2>/dev/null || true)"
            ignore=""
          else
            # A beta/RC/stable lists everything since the previous non-nightly
            # release; the nightlies in between are folded into this section.
            previous="$(git describe --tags --abbrev=0 --exclude '*-nightly.*' "$RELEASE_TAG^" 2>/dev/null || true)"
            # Quoted so the pattern survives the action's unquoted expansion
            # of `args`; git-cliff matches it against the whole tag name.
            ignore="--ignore-tags '.*-nightly\\..*'"
          fi
          range="$RELEASE_TAG"
          if [[ -n "$previous" ]]; then
            range="$previous..$RELEASE_TAG"
          fi
          echo "Changelog range: $range"
          echo "args=--strip all $ignore $range" >> "$GITHUB_OUTPUT"

      - name: Generate release changelog section
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.changelog.outputs.args }}
        env:
          OUTPUT: release/release-section.md

      - name: Generate full CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: release/CHANGELOG.md

      - name: Create release notes file
        run: |
          {
            echo "## Changes"
            echo ""
            if grep -q '^- ' release/release-section.md; then
              cat release/release-section.md
            else
              echo "_No changes with a Conventional Commit type were recorded for this release._"
            fi
            echo ""
            echo "The complete, generated history is attached to this release as \`CHANGELOG.md\`."
            echo ""
          } > release/release-notes.md
          cat >> release/release-notes.md << 'EOF'
          ## Installation

          ### Quick Install (Recommended)

          **macOS, Linux, and WSL:**
          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | bash
          ```

          ### Homebrew (macOS and Linux)

          ```bash
          # Download formula
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/temps.rb -o /tmp/temps.rb

          # Install
          brew install /tmp/temps.rb

          # Verify
          temps --version
          ```

          ### Manual Installation

          #### Linux AMD64
          ```bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/temps-linux-amd64.tar.gz

          # Extract
          tar -xzf temps-linux-amd64.tar.gz

          # Move to PATH
          sudo mv temps /usr/local/bin/temps

          # Verify
          temps --version
          ```

          #### Linux ARM64
          ```bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/temps-linux-arm64.tar.gz

          # Extract
          tar -xzf temps-linux-arm64.tar.gz

          # Move to PATH
          sudo mv temps /usr/local/bin/temps

          # Verify
          temps --version
          ```

          #### macOS AMD64 (Intel)
          ```bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/temps-darwin-amd64.tar.gz

          # Extract
          tar -xzf temps-darwin-amd64.tar.gz

          # Move to PATH
          sudo mv temps /usr/local/bin/temps

          # Verify
          temps --version
          ```

          #### macOS ARM64 (Apple Silicon)
          ```bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/temps-darwin-arm64.tar.gz

          # Extract
          tar -xzf temps-darwin-arm64.tar.gz

          # Move to PATH
          sudo mv temps /usr/local/bin/temps

          # Verify
          temps --version
          ```

          ### Checksums
          ```bash
          # Download checksums
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/checksums.txt

          # Verify checksum (Linux/macOS)
          sha256sum -c checksums.txt --ignore-missing
          ```

          ### Provenance and SBOM
          Every tarball carries a Sigstore-signed SLSA build provenance
          attestation and an SBOM attestation (`temps-sbom.spdx.json`, also
          attached to this release):
          ```bash
          gh attestation verify temps-linux-amd64.tar.gz --repo ${{ github.repository }}
          ```
          EOF

          echo "Release notes created:"
          cat release/release-notes.md

      - name: Create GitHub Release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # workflow_dispatch dry-runs must not mint a real Release object
          # under the dispatched branch name — everything above this step
          # (artifact download, formula/checksum/notes generation) still
          # runs and is inspectable in the job logs/artifacts.
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry-run (workflow_dispatch): skipping actual GitHub Release creation for $RELEASE_TAG"
            exit 0
          fi

          echo "Creating release $RELEASE_TAG..."

          if [[ "${{ steps.channel.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
            echo "This is a pre-release"
          else
            PRERELEASE_FLAG="--latest"
            echo "This is a stable release"
          fi

          release_assets=(
            release/temps-linux-amd64.tar.gz
            release/temps-linux-amd64.tar.gz.sha256
            release/temps-linux-arm64.tar.gz
            release/temps-linux-arm64.tar.gz.sha256
            release/temps-darwin-amd64.tar.gz
            release/temps-darwin-amd64.tar.gz.sha256
            release/temps-darwin-arm64.tar.gz
            release/temps-darwin-arm64.tar.gz.sha256
            release/checksums.txt
            release/runtime-images.json
            release/install.sh
            release/temps.rb
            release/CHANGELOG.md
            release/temps-sbom.spdx.json
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refreshing metadata and assets."
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md \
              $PRERELEASE_FLAG
            gh release upload "$RELEASE_TAG" --clobber "${release_assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md \
              $PRERELEASE_FLAG \
              "${release_assets[@]}"
          fi

          echo ""
          echo "✓ Release $RELEASE_TAG published successfully!"
          echo ""
          echo "View release at: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"

  build-and-push-docker:
    name: Build and Push Docker Image (${{ matrix.platform }})
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64, create-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: temps-linux-amd64
            tarball: temps-linux-amd64.tar.gz
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: temps-linux-arm64
            tarball: temps-linux-arm64.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: artifacts

      - name: Extract binary
        run: |
          cd artifacts
          tar -xzf ${{ matrix.tarball }}
          chmod +x temps
          ls -lh temps
          file temps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # See the matching comment in create-release's "Generate Homebrew
          # formula" step: a branch-based dry-run needs a synthetic version.
          if [[ "$DRY_RUN" == "true" ]]; then
            VERSION="dryrun-${{ github.run_id }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract platform tag
        id: platform_tag
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT
          echo "Platform tag: $PLATFORM_TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.release
          platforms: ${{ matrix.platform }}
          # BuildKit attaches SPDX SBOMs and provenance to each platform manifest.
          sbom: true
          provenance: mode=max
          # Dry-run: build but don't push. Same guard used by the sandbox
          # and preview-gateway image jobs below — without it, every
          # workflow_dispatch (dry-run or not) overwrites the real
          # `:beta-<platform>` tags, which create-docker-manifest then
          # merges into the `:beta` channel operators pin to.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
          # Per-platform intermediate tags. The manifest-merge job below
          # combines amd64+arm64 into the final multi-arch refs. The channel
          # tag (`latest`, `beta` or `nightly`) keeps stable users from being
          # upgraded by a beta, and beta users from being moved onto a
          # nightly. An empty channel tag adds no floating tag at all (blank
          # lines are ignored by build-push-action).
          tags: |
            ${{ needs.create-release.outputs.channel_tag != '' && format('ghcr.io/{0}/temps:{1}-{2}', github.repository_owner, needs.create-release.outputs.channel_tag, steps.platform_tag.outputs.tag) || '' }}
            ghcr.io/${{ github.repository_owner }}/temps:${{ steps.version.outputs.version }}-${{ steps.platform_tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=Temps
            org.opencontainers.image.description=Open-source platform for deploying and managing applications
          # Read-only on purpose — see the "Actions cache is read-only here" note
          # at the top of this file. Publishing runs use tag refs whose cache
          # scope nothing else can read; manual dry-runs follow the same policy.
          cache-from: type=gha

  create-docker-manifest:
    name: Create Docker Manifest
    needs: [build-and-push-docker, create-release]
    # Merges per-platform tags that build-and-push-docker only pushes on a
    # real run. On a workflow_dispatch dry-run those source tags don't
    # exist, so skip the merge too (would otherwise fail on a missing tag).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # See the matching comment in create-release's "Generate Homebrew
          # formula" step: a branch-based dry-run needs a synthetic version.
          if [[ "$DRY_RUN" == "true" ]]; then
            VERSION="dryrun-${{ github.run_id }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Merge per-platform tags into a multi-arch manifest under the channel
      # ref (`:latest` for stable, `:beta` for betas/RCs, `:nightly` for
      # nightlies). Operators that pin to `:latest` never receive a
      # prerelease, and `:beta` never receives a nightly.
      - name: Create and push manifest for channel
        if: needs.create-release.outputs.channel_tag != ''
        env:
          CHANNEL: ${{ needs.create-release.outputs.channel_tag }}
        run: |
          docker buildx imagetools create -t "ghcr.io/${{ github.repository_owner }}/temps:${CHANNEL}" \
            "ghcr.io/${{ github.repository_owner }}/temps:${CHANNEL}-linux-amd64" \
            "ghcr.io/${{ github.repository_owner }}/temps:${CHANNEL}-linux-arm64"

      - name: Create and push manifest for version
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/temps:${{ steps.version.outputs.version }} \
            ghcr.io/${{ github.repository_owner }}/temps:${{ steps.version.outputs.version }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/temps:${{ steps.version.outputs.version }}-linux-arm64

      - name: Sign published multi-platform images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/temps
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_CHANNEL: ${{ needs.create-release.outputs.channel_tag }}
        run: bash .github/scripts/sign-release-image.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Sandbox images and preview gateway
  #
  # Stage revision tags before compiling Temps. The resulting multiarch
  # digests are verified, embedded in the binaries, and published in their
  # runtime-images.json. Version/channel aliases are operator conveniences
  # promoted only after every binary build passes.
  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────
  # Compile helpers + render every per-runtime Dockerfile + materialise
  # the shared bundle, ONCE. The matrix below depends on this — was
  # being repeated 6× in parallel across the matrix.
  # ─────────────────────────────────────────────────────────────────────
  prepare-sandbox-context:
    name: Prepare sandbox build context
    needs: validate-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sandbox_image_version: ${{ steps.version.outputs.sandbox_image_version }}
      gateway_version: ${{ steps.version.outputs.gateway_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo deps
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: sandbox-image-builder
          save-if: false

      - name: Build helpers (print_dockerfile + print_bundle)
        # Single source of truth: same examples the runtime ships use of.
        # `pty_agent_bundle::BUNDLE` and `git_credential_bundle::BUNDLE`
        # are linked into both, so what we materialise here is exactly
        # what `temps serve` would tar at runtime.
        run: |
          cargo build \
            --example print_dockerfile \
            --example print_bundle \
            -p temps-agents

      - name: Extract versions
        id: version
        run: |
          IMAGE_VERSION=$(grep -E '^pub const SANDBOX_IMAGE_VERSION' \
            crates/temps-agents/src/sandbox/docker.rs \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$IMAGE_VERSION" ]; then
            echo "::error::Failed to extract SANDBOX_IMAGE_VERSION from docker.rs"
            exit 1
          fi
          echo "sandbox_image_version=$IMAGE_VERSION" >> $GITHUB_OUTPUT

          GATEWAY_VERSION=$(grep -E '^version = ' \
            crates/temps-preview-gateway/Cargo.standalone.toml \
            | head -n 1 \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$GATEWAY_VERSION" ]; then
            echo "::error::Failed to extract preview gateway version"
            exit 1
          fi
          echo "gateway_version=$GATEWAY_VERSION" >> $GITHUB_OUTPUT

          echo "Sandbox image version: $IMAGE_VERSION"
          echo "Gateway version:       $GATEWAY_VERSION"

      - name: Render Dockerfiles for every runtime
        run: |
          mkdir -p sandbox-context/dockerfiles
          for runtime in node bun python rust go full; do
            ./target/debug/examples/print_dockerfile "$runtime" \
              > "sandbox-context/dockerfiles/$runtime.Dockerfile"
            echo "  rendered: $runtime"
          done

      - name: Materialise bundles into shared build context
        run: |
          mkdir -p sandbox-context/bundle
          ./target/debug/examples/print_bundle sandbox-context/bundle
          echo "Bundle layout:"
          find sandbox-context/bundle -type f | sort

      - name: Upload sandbox build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sandbox-context
          path: sandbox-context/
          retention-days: 1

  build-and-push-sandbox-images:
    name: Build sandbox image (${{ matrix.runtime }})
    needs: [validate-release-ref, prepare-sandbox-context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, python, rust, go, full]
    steps:
      - name: Checkout digest recording script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download prepared context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sandbox-context
          path: sandbox-context

      - name: Assemble per-runtime build context
        # `docker buildx build` wants a single directory: this runtime's
        # rendered Dockerfile + the materialised bundle, side by side.
        run: |
          mkdir -p build-context
          cp -r sandbox-context/bundle/. build-context/
          cp "sandbox-context/dockerfiles/${{ matrix.runtime }}.Dockerfile" \
             build-context/Dockerfile
          echo "Build context layout:"
          find build-context -maxdepth 2 | sort

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage a revision-only tag; no live channel moves before binaries pass.
      - name: Compose tag list
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/temps-sandbox-${{ matrix.runtime }}"
          SHA="${{ github.sha }}"
          {
            echo "list<<TAGS_EOF"
            echo "$REPO:$SHA"
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT


      - name: Build and push sandbox image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          sbom: true
          provenance: mode=max
          context: ./build-context
          platforms: linux/amd64,linux/arm64
          # Dry-run: build but don't push. Used by `workflow_dispatch` with
          # `dry_run=true` to verify the pipeline works without polluting
          # the registry. Real tag pushes always push.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
          outputs: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'type=oci,dest=/tmp/sandbox-image.oci.tar' || '' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare-sandbox-context.outputs.sandbox_image_version }}
            org.opencontainers.image.title=temps-sandbox-${{ matrix.runtime }}
            org.opencontainers.image.description=Temps workspace sandbox image (${{ matrix.runtime }} runtime)
          # Read-only: `sandbox-images-beta.yml` populates this scope from
          # `main`, where it is readable by every ref. See the "Actions cache is
          # read-only here" note at the top of this file.
          cache-from: type=gha,scope=sandbox-${{ matrix.runtime }}


      - name: Record runtime image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_KIND: sandbox_${{ matrix.runtime }}
          IMAGE_REVISION: ${{ github.sha }}
        run: python3 .github/scripts/release_image_manifest.py record --kind "$IMAGE_KIND" --digest "$IMAGE_DIGEST" --revision "$IMAGE_REVISION" --output "$IMAGE_KIND.json"

      - name: Upload runtime image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-sandbox_${{ matrix.runtime }}
          path: sandbox_${{ matrix.runtime }}.json
          retention-days: 1
      - name: Set up Cosign for runtime image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign published runtime image digest
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/temps-sandbox-${{ matrix.runtime }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid published image digest" >&2; exit 1; }
          cosign sign --yes "$IMAGE_REPOSITORY@$IMAGE_DIGEST"


  build-and-push-preview-gateway:
    name: Build preview gateway image
    needs: [validate-release-ref, prepare-sandbox-context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage a revision-only tag; the binary embeds the resulting digest.
      - name: Compose tag list
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/temps-preview-gateway"
          SHA="${{ github.sha }}"
          {
            echo "list<<TAGS_EOF"
            echo "$REPO:$SHA"
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push preview gateway image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          sbom: true
          provenance: mode=max
          context: ./crates/temps-preview-gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
          outputs: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'type=oci,dest=/tmp/gateway-image.oci.tar' || '' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare-sandbox-context.outputs.gateway_version }}
            org.opencontainers.image.title=temps-preview-gateway
            org.opencontainers.image.description=Temps preview gateway — routes ws-<sid>-<port> hosts to sandbox containers
          # Read-only, same reasoning as the sandbox images above.
          cache-from: type=gha,scope=preview-gateway

      - name: Record runtime image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_KIND: preview_gateway
          IMAGE_REVISION: ${{ github.sha }}
        run: python3 .github/scripts/release_image_manifest.py record --kind "$IMAGE_KIND" --digest "$IMAGE_DIGEST" --revision "$IMAGE_REVISION" --output "$IMAGE_KIND.json"

      - name: Upload runtime image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-image-preview_gateway
          path: preview_gateway.json
          retention-days: 1
      - name: Set up Cosign for runtime image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign published runtime image digest
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/temps-preview-gateway
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid published image digest" >&2; exit 1; }
          cosign sign --yes "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
