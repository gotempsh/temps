name: Dependency & Container Scan

# Supply-chain scanning for Temps' own code (tracked as bherila/temps#23).
# This is distinct from crates/temps-vulnerability-scanner, which only scans
# *deployed customer application images* -- nothing here previously checked
# Temps' own crates, its own web dependencies, or its own build images.
#
# - `cargo-audit` scans the Rust workspace's Cargo.lock against the RustSec
#   Advisory Database.
# - `web-audit` scans web/ (bun) dependencies against the same class of
#   advisory data via `bun audit`.
# - `container-scan` (schedule/dispatch only) scans the latest
#   published release image with Trivy. It intentionally does not run on
#   pull_request: a PR has no fresh image to scan (release.yml only builds
#   images for pushed `v*.*.*` tags), so scanning the last published
#   `:latest` (stable), `:beta` and `:nightly` tags weekly is the meaningful
#   signal here.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/dependency-scan.yml"
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo-audit:
    name: Rust Dependency Audit (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check publishes results as a GitHub check run.
      checks: write
      # On `schedule` runs specifically, the action also files/updates a
      # GitHub issue for any advisory found (see rustsec/audit-check's
      # README, "Granular Permissions" -- it only does this off cron, not on
      # pull_request/push). Without this, a schedule run 403s with
      # "Resource not accessible by integration" against the Issues API even
      # when zero vulnerabilities are found, since the action still needs to
      # check for/close a prior issue.
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: dependency-scan-cargo-audit
          # Save from `main` only -- writes are scoped to the producing ref,
          # so without this every open PR held its own ~340MB copy under this
          # key (9 simultaneous copies measured = ~2.9GB, more than a quarter
          # of the repo's 10GB cache pool). That's what was evicting
          # `temps-musl-fast-*` -- the much larger, much more valuable shared
          # musl build cache in rust-tests.yml -- turning its restore-keys
          # fallback into a full ~80min cold compile on every workflow run.
          # See the matching `save-if` note on the `test-build`/
          # `nextest-archive` caches in rust-tests.yml for the same lesson.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runs `cargo audit` against Cargo.lock and fails the job if any
      # RUSTSEC advisory matches a resolved dependency (all advisories, not
      # just a severity subset -- cargo-audit's advisory-db entries don't
      # uniformly carry CVSS severity, so "any match" is the safer default
      # for a supply-chain gate). See PR body for rationale on fail-vs-warn.
      #
      # Ignored below are "unmaintained crate" notices (not exploitable
      # CVEs) for deps we don't control directly:
      # - RUSTSEC-2025-0134 (rustls-pemfile): used directly across several
      #   crates; migrating to rustls-pki-types' PemObject API is tracked
      #   separately, not a drop-in version bump.
      # - RUSTSEC-2024-0436 (paste): proc-macro only (compile-time codegen,
      #   not linked into the binary). Cargo.lock dependents:
      #   * rav1e <- ravif <- image (default `avif` feature) <- temps-auth
      #     (direct `image` dep, and via qrcode for MFA QR codes). This is
      #     the only path in the default build -- temps-auth is depended on
      #     by nearly every service crate.
      #   * tokenizers (and macro_rules_attribute <- tokenizers) <-
      #     temps-embeddings, only behind its optional `huggingface`/`all`
      #     feature, which no workspace crate enables (in Cargo.lock but not
      #     compiled by default).
      # - RUSTSEC-2026-0173 (proc-macro-error2): proc-macro only. Paths:
      #   * sea-orm -> sea-orm-macros -> sea-bae -> proc-macro-error2
      #     (default build); sea-orm 1.1.20 is the pinned major, 2.0 is a
      #     breaking migration.
      #   * validator -> validator_derive -> proc-macro-error2, via
      #     temps-import-types' optional `validation` feature, which no
      #     workspace crate enables (in Cargo.lock only).
      # - RUSTSEC-2024-0388 (derivative): transitive via pingora-core and
      #   pingora-load-balancing -> derivative (temps-proxy, temps-edge).
      #   Proc-macro only; the pinned Pingora 0.9 dependency includes it.
      # - RUSTSEC-2024-0449 (unsafe-libyaml): workspace crates parse YAML
      #   with `yaml_serde` (maintained serde_yaml fork on `libyaml-rs`), so
      #   compose files, temps.yaml, Kamal and kubeconfig input never reach
      #   unsafe-libyaml. The only remaining path is pingora-core 0.9 ->
      #   serde_yaml, a non-optional dependency (also on Pingora main as of
      #   2026-10-12) used solely by ServerConf's YAML conf-file loader.
      #   Temps never gives Pingora a conf file: temps-proxy builds ServerConf
      #   in code with `Opt { conf: None }` and temps-edge passes
      #   `Opt::default()`, so the parser is linked but never fed input.
      # - RUSTSEC-2025-0141 (bincode 2.0.1): no workspace crate uses bincode.
      #   Its only dependents are microsandbox-filesystem, msb_krun_devices
      #   and msb_krun_vmm, all under temps-agents' exact-pinned microsandbox
      #   SDK (ADR-050), which is not linked on musl (the container image) or
      #   Intel macOS. They encode/decode VM and filesystem state blobs the
      #   microsandbox runtime writes itself. The latest releases checked on
      #   2026-10-12 (microsandbox 0.7.8, msb_krun 0.1.41) still require
      #   `bincode ^2.0.1` non-optionally, so no upgrade drops it. No
      #   vulnerability is reported against bincode 2.0.1. A temps-core
      #   Cargo.lock guard test fails if anything else starts depending on it.
      #
      # The three below are vulnerability/unsoundness advisories (not "unmaintained"
      # notices), blocked on upstream fixes with no non-forking workaround.
      # Full reachability analysis for each lives in the root Cargo.toml
      # under "Dependency Overrides - Security Fixes" -- re-verify that
      # analysis before removing/renewing these on advisory-db updates:
      # - RUSTSEC-2023-0071 (rsa, Marvin Attack). Locked paths and how each
      #   uses RSA:
      #   rsa 0.9.10:
      #   * jsonwebtoken 10 <- octocrab (temps-git, temps-deployments) and
      #     jsonwebtoken 11 direct in temps-git: GitHub App JWT RS256
      #     *signing* (temps-git github.rs, github_provider.rs,
      #     git_provider_manager.rs).
      #   * direct in temps-dns (providers/gcp.rs sign_rs256): GCP Cloud DNS
      #     service-account JWT *signing*.
      #   * openidconnect <- temps-auth: OIDC id_token signature
      #     *verification* (public-key op).
      #   * direct in temps-email-tracking (sns.rs verify_pkcs1v15): AWS SNS
      #     message signature *verification* only (public key from the SNS
      #     signing cert).
      #   * sqlx-mysql <- sqlx (built because the workspace sqlx enables the
      #     `mysql` feature): caching_sha2/sha256_password auth on non-TLS
      #     connections RSA-OAEP *encrypts* the password to the server's
      #     public key -- encryption, never decryption.
      #   * dev-dependency only: temps-deployments (cert_validator.rs test
      #     module generates throwaway RSA keys) and the
      #     examples/google-indexing-plugin test module (keygen); that
      #     example also signs RS256 JWTs via jsonwebtoken 11.
      #   rsa 0.10.0-rc.18: russh/ssh-key <- temps-deployments for SSH node
      #   enrollment, where RSA is only used for host-key/user-key signatures
      #   and verification -- no RSA decryption path exists in SSH2.
      #   Marvin Attack is a chosen-ciphertext *decryption* oracle attack;
      #   no workspace code calls RSA decryption (no Pkcs1v15Encrypt/Oaep
      #   decrypt on any input; every `.decrypt(` in the workspace is the
      #   AES-GCM EncryptionService/CookieCrypto). Uses are signing,
      #   verification, client-side encryption, and test keygen. The
      #   signing timing side-channel has not been independently assessed;
      #   network latency alone does not prove it unobservable. This exception
      #   requires maintainer risk review. No fixed `rsa` release exists upstream
      #   yet -- tracked for a ring/aws-lc-rs-backed signing migration.
      # - RUSTSEC-2026-0235 (rkyv 0.7.46 via rust_decimal <- sea-orm):
      #   out-of-bounds read when validating archives containing Rc/Arc.
      #   rkyv is an OPTIONAL feature of rust_decimal that nothing in this
      #   workspace enables -- it is in Cargo.lock (which cargo resolves over
      #   the maximal feature set) but has zero occurrences in
      #   `cargo tree --target all -e normal`, i.e. it is never compiled, let
      #   alone fed an archive. No fix is reachable from here: the patch is
      #   in 0.8.17, upstream dropped the 0.7 series, and rust_decimal 1.42.1
      #   (latest) still declares `rkyv ^0.7.46`.
      #   NOTE: this entry exists only because cargo-audit reads Cargo.lock
      #   rather than what is built. Switching this gate to cargo-auditable
      #   (`cargo audit bin` against the compiled binary) would drop it
      #   without an exception -- see the PR that added this line.
      # - RUSTSEC-2026-0253 (lru 0.16.4, unsound UAF in LruCache::pop()):
      #   transitive via aws-sdk-s3, which pins `lru = "^0.16.3"`. Verified
      #   2026-08-24 against aws-sdk-s3 1.143.0 (crates.io latest as of that
      #   date) that the requirement is unchanged -- upgrading aws-sdk-s3
      #   does not pull the fixed lru 0.18.2.
      #   Reviewed 2026-10-06 in locked aws-sdk-s3 1.138.1: its sole LruCache
      #   consumer uses CacheKey(String), without a custom Drop, and calls
      #   get_or_insert_mut rather than pop. The advisory's panicking-key-Drop
      #   prerequisite is absent there. Re-review when the SDK changes.
      # - RUSTSEC-2026-0381 (webpki-roots: bundled `emSign ECC Root CA - G3`
      #   lets paths through distrusted emSign intermediates; fixed in
      #   webpki-roots >= 1.0.10). Cargo.lock has webpki-roots 1.0.10. The
      #   advisory still matches the 0.26.11 copy that sqlx-core 0.8.6 requires,
      #   but that release is a semver-compatibility shim whose whole API is
      #   `pub use parent::TLS_SERVER_ROOTS` over webpki-roots ^1, so the roots
      #   it serves are 1.0.10's, without the distrusted root. Drop this entry
      #   once sqlx moves to webpki-roots 1, and re-check it if the shim is
      #   ever locked against a 1.x older than 1.0.10.
      # - RUSTSEC-2026-0387 (crypto-bigint: arithmetic meant to be
      #   constant-time can branch on secret values; fixed in >= 0.7.6).
      #   Cargo.lock has 0.7.6 for the copy that russh/rsa pulls in. The 0.5.5
      #   copy is a direct dependency of aws-sigv4 (checked 2026-10-24, still
      #   on 0.5 in aws-sigv4 1.6.0), and 0.5 has no patched release, so a
      #   version bump cannot reach it. aws-sigv4 uses it only to derive the
      #   ECDSA key for SigV4A (multi-region access points); the S3 requests
      #   this repository makes are signed with plain SigV4 (HMAC-SHA256),
      #   which does not touch it. Drop this entry once aws-sigv4 moves to
      #   crypto-bigint >= 0.7.6.
      # - RUSTSEC-2026-0391, RUSTSEC-2026-0398, RUSTSEC-2026-0403 (zstd 0.13.3
      #   / zstd-safe 7.2.4: data from an abandoned stream leaking into the
      #   next one on a reused context; `Seekable::decompress` past the end;
      #   uninitialized memory after a failed legacy-frame streaming decode;
      #   fixed in zstd >= 0.14.3 / zstd-safe >= 8.2.0). The workspace's own
      #   zstd is already 0.14.3. The 0.13.3 copy is locked by upstream crates
      #   whose latest releases (checked 2026-10-27) still require
      #   `zstd ^0.13`. Advisories:
      #   https://rustsec.org/advisories/RUSTSEC-2026-0391.html (affects only
      #   `zstd::stream::raw::{Encoder,Decoder}::with_context`),
      #   https://rustsec.org/advisories/RUSTSEC-2026-0398.html (only
      #   `zstd_safe::seekable::{,Advanced}Seekable::decompress`, behind the
      #   `seekable` feature),
      #   https://rustsec.org/advisories/RUSTSEC-2026-0403.html (only
      #   `zstd_safe::DCtx::decompress_stream`; the bulk API is unaffected).
      #   zstd-safe 7.3.0 predates these fixes; no 0.13.x/7.x release has them.
      #   * pingora-header-serde 0.9.0 (latest; Pingora 0.9.0 is the newest
      #     release) <- pingora-cache <- pingora-proxy (temps-proxy,
      #     temps-edge): compresses cached response headers (thread_zstd.rs).
      #     It calls only the one-shot bulk API on per-thread contexts --
      #     `CCtx::compress`/`compress_using_cdict` and
      #     `DCtx::decompress`/`decompress_using_ddict` -- plus `zstd::dict`
      #     training in an offline helper. Bulk calls start a fresh frame
      #     every time, so nothing carries over between calls: no
      #     `with_context` streams (0391), no seekable API (0398), no
      #     `decompress_stream` (0403). Even if Pingora's HTTP cache were turned
      #     on, it would not reach these functions, and Temps never turns it
      #     on (no `session.cache` use in the workspace).
      #     cargo-audit also prints ten `unsound` warnings against zstd-safe
      #     7.2.4 (RUSTSEC-2026-0395..0406); they do not fail this job. Of
      #     those, Pingora's calls appear only in 0400 (`DCtx::decompress*`),
      #     which needs a context shared with an open stream; Pingora's
      #     thread-local contexts never stream.
      #     Re-check if Pingora's header serde moves to streaming or seekable.
      #   * msb_krun_vmm 0.1.41 (0.1.42 is the same) <- microsandbox
      #     (temps-agents), a dependency only on x86_64 and, per the bincode
      #     entry above, not linked on musl. Its one call is
      #     `zstd::stream::copy_decode` on an external guest kernel file
      #     (builder.rs, `KernelFormat::ImageZstd`): a fresh decoder per call,
      #     so no context is reused (0391); the `seekable` feature is not
      #     enabled, so 0398's code is not compiled; and 0403 needs a malformed
      #     legacy frame in a kernel file on the host, which only someone who
      #     can already write the host's files could plant.
      #   Drop these three only once every path above resolves zstd >= 0.14.3:
      #   pingora-header-serde and msb_krun_vmm moving to zstd 0.14.
      # Remove an entry once its upstream is fixed/replaced.
      # Install a checksum-verified release binary before audit-check runs.
      # audit-check otherwise compiles cargo-audit from a newly-resolved
      # dependency graph, which can fail independently of this repository's
      # Cargo.lock (for example, when an upstream build-only crate is broken).
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Run cargo-audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2025-0134,RUSTSEC-2023-0071,RUSTSEC-2026-0235,RUSTSEC-2024-0436,RUSTSEC-2026-0173,RUSTSEC-2024-0388,RUSTSEC-2026-0253,RUSTSEC-2024-0449,RUSTSEC-2025-0141,RUSTSEC-2026-0381,RUSTSEC-2026-0387,RUSTSEC-2026-0391,RUSTSEC-2026-0398,RUSTSEC-2026-0403

  web-audit:
    name: Web Dependency Audit (bun audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: ${{ github.ref != 'refs/heads/main' }}

      # Restore always, save only from `main` (see the cargo-audit cache
      # above): a PR that changes web/bun.lock would otherwise store its own
      # node_modules copy that no other ref can read.
      - name: Restore Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: |
          cd web
          bun install --frozen-lockfile

      - name: Save Bun dependencies
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      # Fails the job if any high or critical severity advisory is found in
      # web/'s dependency tree. `bun audit` exits non-zero when findings meet
      # or exceed --audit-level. Lower severities (low/moderate) are still
      # printed by the command's own output but do not fail the build.
      #
      # Note: `bun audit --ignore` is silently non-functional in bun 1.3.14
      # (confirmed against both GHSA slugs and bun's own internal advisory
      # ids -- neither suppresses the finding). Transitive advisories here
      # are fixed via package.json `overrides` instead of ignored.
      - name: Run bun audit
        run: |
          cd web
          bun audit --audit-level=high

  container-scan:
    name: Container Image Scan (Trivy, ${{ matrix.channel }})
    # Only meaningful on a schedule/manual run: PRs don't produce a fresh
    # published image to scan (release.yml only builds+pushes on `v*.*.*`
    # tags). This job scans whatever is currently published on each release
    # channel. All three are needed: release.yml moves `:latest` on a stable
    # tag, `:beta` on betas/RCs and `:nightly` on nightlies, and
    # docker-compose.release.yml deploys `:latest` by default. Scanning only
    # `:latest` let the image every nightly ships go unscanned while
    # `:latest` sat unchanged for months; scanning only `:beta` would hide
    # vulnerabilities in the image stable installs actually pull.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # One channel's findings must not cancel the other channel's scan.
      fail-fast: false
      matrix:
        include:
          # `:latest` keeps the category this job uploaded under before it
          # scanned more than one channel, so its existing alerts stay
          # tracked (and close once a republished image no longer has them)
          # instead of being orphaned under a category nothing uploads to.
          - channel: latest
            sarif-category: ".github/workflows/dependency-scan.yml:container-scan"
          - channel: beta
            sarif-category: ".github/workflows/dependency-scan.yml:container-scan-beta"
          - channel: nightly
            sarif-category: ".github/workflows/dependency-scan.yml:container-scan-nightly"
    permissions:
      contents: read
      security-events: write
      # ghcr.io/${{ github.repository_owner }}/temps is a private package --
      # anonymous pulls 401 (confirmed: `curl
      # https://ghcr.io/token?scope=repository:gotempsh/temps:pull` returns
      # UNAUTHORIZED even for this public repo's own image). Trivy's `remote`
      # fallback therefore needs an authenticated pull, same as release.yml
      # uses to publish the image in the first place.
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin published image digest
        id: published_image
        env:
          CHANNEL: ${{ matrix.channel }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER}/temps:${CHANNEL}"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for $image" >&2
            exit 1
          fi
          printf 'ref=%s@%s\n' "${image%:"$CHANNEL"}" "$digest" >> "$GITHUB_OUTPUT"

      - name: Generate Trivy SARIF for published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Both scans use the same immutable digest if the tag moves mid-job.
          image-ref: ${{ steps.published_image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          # SARIF deliberately includes all severities for code scanning.
          # trivy-action clears the severity filter in SARIF mode by default,
          # so a separate table scan below enforces the HIGH/CRITICAL gate.
          exit-code: "0"
          ignore-unfixed: true

      # Best-effort: only succeeds if the repo has GitHub code scanning
      # (Advanced Security / public repo) enabled. Non-fatal if not, so it
      # never masks or replaces the pass/fail signal from the gate below.
      - name: Upload Trivy results to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.sarif-category }}

      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.published_image.outputs.ref }}
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
