name: Upgrade Tests

# Upgrade-from-previous-release test (scripts/test-upgrade-from-release.sh):
# seed an installation with a published release, upgrade it in place with the
# candidate binary, and check that every seeded record is
# intact, that a pre-migration backup was taken, that the schema guard refuses
# a newer database, and that restoring the backup rolls back to the previous
# release.
#
# - Pull requests and `main`: called from `rust-tests.yml` with the musl
#   `fast` binary its `build-binary` job already compiled.
# - Nightly (and manual runs): upgrades to the newest published nightly
#   build, so the release-to-release path is exercised even on days without
#   a code change to the test itself.
#
# Which release it starts from (`previous-channel`, chosen by version, never
# by publication date -- see .github/scripts/release_select.py):
# - stable (default): the highest stable release, i.e. the path most
#   operators take. Before the first stable release exists it falls back to
#   the highest beta/RC, so the test still runs.
# - beta: the highest `-beta.N`/`-rc.N` prerelease, for testing the path beta
#   testers take (manual runs).
# Only published, non-draft releases that ship `temps-linux-amd64.tar.gz`
# are candidates, so `test-v*` smoke-test releases and asset-less releases
# are never picked. Releases below v0.1.0 are not candidates either: they
# predate `temps migrate`, which the test drives on the old binary, so the
# stable default uses the beta fallback until v0.1.0 ships. A leftover
# v0.0.x stable tag would otherwise be chosen and fail at the first step.
# `previous-version` overrides the choice with a tag.
on:
  workflow_call:
    inputs:
      binary-artifact:
        description: "Name of the artifact holding the candidate `temps` binary"
        required: false
        default: temps-binary-musl-fast
        type: string
      previous-channel:
        description: "Channel of the release to upgrade from: stable (falls back to beta before the first stable release) or beta"
        required: false
        default: stable
        type: string
  schedule:
    # After nightly-release.yml (03:00 UTC) has had time to publish.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      previous-version:
        description: "Release tag to upgrade from (overrides previous-channel)"
        required: false
        type: string
      previous-channel:
        description: "Upgrade from the highest release on this channel (stable falls back to beta before the first stable release)"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

jobs:
  upgrade-from-release:
    name: Upgrade from previous release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_DB: temps
          POSTGRES_USER: temps
          POSTGRES_PASSWORD: temps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U temps -d temps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Never report CI instances to product telemetry.
      TEMPS_TELEMETRY: "0"
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_VERSION: ${{ github.event.inputs.previous-version }}
      # `inputs` covers workflow_call and workflow_dispatch; a scheduled run
      # has neither and takes the stable default.
      PREVIOUS_CHANNEL: ${{ inputs.previous-channel || 'stable' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download candidate binary (build artifact)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.binary-artifact }}
          path: candidate

      - name: Download candidate binary (latest nightly release)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # Published, non-draft releases that ship the tarball, highest
          # nightly by version.
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "temps-linux-amd64.tar.gz")) | .tag_name' |
            python3 .github/scripts/release_select.py --channel nightly)
          echo "Candidate: $tag"
          mkdir -p candidate
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'temps-linux-amd64.tar.gz' --dir candidate
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'temps-linux-amd64.tar.gz.sha256' --dir candidate
          (cd candidate && sha256sum --strict --check temps-linux-amd64.tar.gz.sha256)
          tar -xzf candidate/temps-linux-amd64.tar.gz -C candidate

      - name: Download previous release
        run: |
          set -euo pipefail
          tag="${PREVIOUS_VERSION:-}"
          if [ -z "$tag" ]; then
            case "$PREVIOUS_CHANNEL" in
              stable) fallback=(--fallback beta) ;;
              beta) fallback=() ;;
              *)
                echo "::error::previous-channel must be 'stable' or 'beta', got '$PREVIOUS_CHANNEL'"
                exit 1
                ;;
            esac
            tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "temps-linux-amd64.tar.gz")) | .tag_name' |
              python3 .github/scripts/release_select.py --channel "$PREVIOUS_CHANNEL" \
                "${fallback[@]}" --min-core v0.1.0)
          fi
          test -n "$tag"
          echo "Previous release: $tag"
          mkdir -p previous
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'temps-linux-amd64.tar.gz' --dir previous
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'temps-linux-amd64.tar.gz.sha256' --dir previous
          (cd previous && sha256sum --strict --check temps-linux-amd64.tar.gz.sha256)
          tar -xzf previous/temps-linux-amd64.tar.gz -C previous

      - name: Verify binaries run
        run: |
          chmod +x candidate/temps previous/temps
          previous/temps --version
          candidate/temps --version

      # Pulled up front so a slow registry shows up here, not as a timeout
      # inside the test. postgres:18 is what the pre-migration backup uses
      # when no matching pg_dump is installed (the runner ships an older one).
      - name: Pre-pull images
        run: |
          docker pull gotempsh/redis-walg:8-bookworm
          docker pull postgres:18

      - name: Upgrade, verify, guard and roll back
        env:
          OLD_BIN: previous/temps
          NEW_BIN: candidate/temps
          PG_CONTAINER: ${{ job.services.timescaledb.id }}
          WORK_DIR: ${{ runner.temp }}/upgrade-test
        run: scripts/test-upgrade-from-release.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upgrade-test-logs
          path: ${{ runner.temp }}/upgrade-test/logs
          retention-days: 7
          if-no-files-found: ignore
