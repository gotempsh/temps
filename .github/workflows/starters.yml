name: Starters

# Builds every temps-examples starter through the preset the deployment
# pipeline actually uses, runs the resulting image, and asks it for a page.
#
# The unit tests assert on generated Dockerfile *text*, which cannot tell a
# working build from a plausible-looking one. This is the job that would have
# caught a preset change that renders fine and deploys broken.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/temps-presets/**'
      - '.github/workflows/starters.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/temps-presets/**'
      - '.github/workflows/starters.yml'
  workflow_dispatch:
  # The starters live in another repository, so a green PR here can still break
  # when one of them changes. Re-run nightly to catch that.
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: starters-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Four jobs, not one per starter. A job per starter was 26 jobs, each
  # spending most of its ~2 minutes on checkout, toolchain and cache restore
  # before a build that takes seconds -- and 26 jobs at once filled the
  # runner pool, so Rust Tests jobs on the same PR sat queued behind them.
  deployment-regressions:
    name: Generated preset deployment regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out the starters
        uses: actions/checkout@v7.0.1
        with:
          repository: gotempsh/temps-examples
          path: temps-examples

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: starters
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - name: Require Docker and Buildx
        run: |
          docker info
          docker buildx version

      - name: Build and run deployment regression images
        # Each scenario owns and removes its builder, images and containers.
        # Run sequentially to bound image-build memory and disk on the runner.
        #
        # CARGO_BUILD_JOBS is set on this step, not the job: rust-cache hashes
        # the CARGO_* environment it sees into its key, so a job-level value
        # gave this job a different `starters` entry from the matrix below,
        # and cache-cleanup (prune-superseded-caches.py, which groups entries
        # by key minus that hash) deleted one of the two every day.
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --locked -p temps-presets --test deployment_regressions -- --nocapture --test-threads=1

      - name: Known-failing starters (report only)
        # These starters do not pass yet. They run anyway and never fail the
        # job, so the failure stays visible in the log without blocking a
        # merge -- a red check that everyone learns to ignore is worse than
        # no check at all. Both are defects in the starters themselves, not
        # in a preset, so the fix belongs in gotempsh/temps-examples; move
        # each one into a shard below once it is fixed there.
        #
        # java/spring-boot (#1319): src/main/resources/application.yaml
        # forces `spring.main.web-application-type: reactive`, but
        # build.gradle only has the servlet starter
        # (spring-boot-starter-web), so startup fails for want of a
        # ReactiveWebServerFactory. The image builds and the boot jar is the
        # right one; selecting `servlet` (or dropping the override) makes it
        # serve.
        #
        # dockerfile (#1318): built through its own Dockerfile, as the
        # Dockerfile preset deploys it. `RUN npm ci` fails because no
        # package-lock.json is checked in, and `CMD ["node",
        # "dist/index.js"]` names a file the build script never produces (it
        # writes dist/index.html).
        continue-on-error: true
        env:
          TEMPS_EXAMPLES_DIR: ${{ github.workspace }}/temps-examples/examples/starters
          TEMPS_STARTERS_ONLY: java/spring-boot,dockerfile
          DOCKER_BUILDKIT: '1'
        run: |
          cargo test -p temps-presets --test starters -- --ignored --nocapture

  starters:
    name: starters (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One red shard should not stop the others.
      fail-fast: false
      matrix:
        # Balanced by measured build time (swift/vapor, vite/react,
        # python/flask and nodejs/hono are the slow four, one per shard
        # where possible). A failure names the starter in the job's error
        # annotations, so grouping does not hide which language broke.
        shard:
          - name: swift, hono, go, deno, elixir
            starters: swift/vapor nodejs/hono go/gin go/net-http deno elixir/phoenix
          - name: vite, python, rust, ruby, php
            starters: vite/react python/flask python/django python/fastapi rust/actix ruby/rails php/laravel php/vanilla
          - name: js frameworks, bun, dotnet
            starters: nextjs/app-router nuxt astro sveltekit nodejs/nestjs nodejs/express nodejs/fastify bun/bun-server bun/elysia dotnet/web

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out the starters
        uses: actions/checkout@v7.0.1
        with:
          repository: gotempsh/temps-examples
          path: temps-examples

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache for every job: they all build the same test
          # binary, so per-shard caches would be copies of it.
          shared-key: starters
          # Only main may write the cache — a pull request that populates it
          # evicts main's entry from the repository's single LRU pool.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - name: Build, run and serve
        # One starter at a time, pruning the builder in between: the harness
        # removes each image, but not the Buildx build cache, and a shard's
        # worth of toolchain layers would otherwise fill the runner's disk.
        # The test binary is compiled once, by the first starter.
        env:
          TEMPS_EXAMPLES_DIR: ${{ github.workspace }}/temps-examples/examples/starters
          STARTERS: ${{ matrix.shard.starters }}
          DOCKER_BUILDKIT: '1'
        run: |
          failed=()
          for starter in $STARTERS; do
            echo "::group::$starter"
            if ! TEMPS_STARTERS_ONLY="$starter" cargo test -p temps-presets --test starters -- --ignored --nocapture; then
              failed+=("$starter")
              echo "::error title=Starter failed::$starter did not build, run and serve (see its log group)"
            fi
            echo "::endgroup::"
            docker builder prune -af >/dev/null
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed starters: ${failed[*]}"
            exit 1
          fi
