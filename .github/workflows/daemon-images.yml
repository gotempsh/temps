name: Agent runtime images

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing (manual publishing is beta only)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  images:
    name: Daemon image (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [nodejs, python, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate build inputs and publication policy
        id: metadata
        env:
          CHANNEL: ${{ inputs.channel || 'beta' }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          python3 tools/sandbox-runtime/test_build_inputs.py
          python3 tools/sandbox-runtime/image_metadata.py >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false

      - name: Log in to GHCR
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish daemon image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tools/sandbox-runtime
          target: ${{ matrix.flavor }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.metadata.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          # No floating legacy tags or cache writes: python shares a package
          # name with the standalone images, but not its version or channel aliases.
          cache-from: type=gha,scope=daemon-${{ matrix.flavor }}
