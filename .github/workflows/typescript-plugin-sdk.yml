name: TypeScript plugin SDK

on:
  push:
    branches: [main]
    paths:
      - "sdks/node/packages/plugin-sdk/**"
      - "sdks/node/examples/node-hello-plugin/**"
      - "sdks/node/examples/deployment-pulse-plugin/**"
      - "sdks/node/bun.lock"
      - ".github/workflows/typescript-plugin-sdk.yml"
      - ".github/workflows/publish-typescript-plugin-sdk.yml"
  pull_request:
    paths:
      - "sdks/node/packages/plugin-sdk/**"
      - "sdks/node/examples/node-hello-plugin/**"
      - "sdks/node/examples/deployment-pulse-plugin/**"
      - "sdks/node/bun.lock"
      - ".github/workflows/typescript-plugin-sdk.yml"
      - ".github/workflows/publish-typescript-plugin-sdk.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        working-directory: sdks/node
        run: bun install --frozen-lockfile
      - name: Build SDK
        working-directory: sdks/node/packages/plugin-sdk
        run: bun run build
      - name: Test SDK
        working-directory: sdks/node/packages/plugin-sdk
        run: bun run test:run
      - name: Build standalone TypeScript plugin
        working-directory: sdks/node/examples/node-hello-plugin
        run: bun run build
      - name: Test standalone plugin protocol
        working-directory: sdks/node/examples/node-hello-plugin
        run: bun run test
      - name: Test Deployment Pulse
        working-directory: sdks/node/examples/deployment-pulse-plugin
        run: bun run test
      - name: Build Deployment Pulse
        working-directory: sdks/node/examples/deployment-pulse-plugin
        run: bun run build
