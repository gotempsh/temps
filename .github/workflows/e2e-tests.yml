name: E2E Tests

# Called by `rust-tests.yml`, not triggered directly.
#
# This job used to build its own `--release` binary — a second full compile of
# the same workspace that `rust-tests.yml` was already building for Compose
# Security, plus a second web-UI and WASM build in front of it. It now takes
# the musl `fast` binary from the `build-binary` job as an artifact, which is
# both faster and a better test: that is the binary that ships in the Docker
# image, where `--release` glibc never was.
on:
  workflow_call:
    inputs:
      binary-artifact:
        description: "Name of the artifact holding the prebuilt `temps` binary"
        required: false
        default: temps-binary-musl-fast
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-test:
    name: E2E Deployment Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_DB: temps
          POSTGRES_USER: temps
          POSTGRES_PASSWORD: temps
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U temps -d temps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://temps:temps@localhost:5432/temps
      TEMPS_DATA_DIR: /tmp/temps-data
      ADMIN_EMAIL: admin@localho.st
      ADMIN_PASSWORD: E2eTestPass123!
      API_BASE: http://localhost:8081/api
      # Disable anonymous product telemetry for CI. Without this, every e2e run
      # boots a fresh instance and emits instance_started + project_created +
      # deploy_attempted for the example apps, polluting the real telemetry DB
      # with phantom "tried N deploys, never shipped" instances. (Opt-out values:
      # 0/false/off/no/disabled — see temps-telemetry/src/service.rs.)
      TEMPS_TELEMETRY: "0"
      TEMPS_BIN: ./ci-prebuilt/temps
      # Main and PR builds exercise the beta binary channel. Point sandbox
      # pulls at the matching published image set; the default stable tag is
      # only published by a stable release and otherwise forces a multi-minute
      # local image build that exceeds Playwright's request timeout.
      TEMPS_SANDBOX_CHANNEL: beta

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get autoremove -y && sudo apt-get clean

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # No Rust toolchain, no wasm-pack, no rsbuild production build — the
      # binary arrives prebuilt with the web UI already embedded. Bun stays,
      # but only to install web/node_modules for the Playwright console tests
      # below; it no longer builds the UI.
      - name: Download temps binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.binary-artifact }}
          path: ci-prebuilt

      - name: Verify prebuilt binary runs
        run: |
          chmod +x "$TEMPS_BIN"
          file "$TEMPS_BIN"
          "$TEMPS_BIN" --version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Restore always, save only from `main` — see the cache-scoping note in
      # rust-tests.yml. Saving from every ref stored a byte-identical 161MB
      # node_modules copy in each open PR's scope (5 copies, ~805MB) for a
      # `bun install` that takes seconds to redo.
      - name: Restore Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies (Playwright tests)
        run: cd web && bun install

      - name: Save Bun dependencies
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      - name: Generate self-signed localho.st certificate
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout localho.st.key -out localho.st.crt \
            -days 1 -nodes -subj "/CN=localho.st" \
            -addext "subjectAltName=DNS:localho.st,DNS:*.localho.st"

      - name: Install localho.st certificate into trust store
        run: |
          sudo cp localho.st.crt /usr/local/share/ca-certificates/localho.st.crt
          sudo update-ca-certificates

      - name: Prepare data directory
        run: |
          mkdir -p "$TEMPS_DATA_DIR"
          # GeoLite2 database is checked into the repo
          cp crates/temps-cli/GeoLite2-City.mmdb "$TEMPS_DATA_DIR/GeoLite2-City.mmdb"

      - name: Verify TimescaleDB is ready
        run: |
          timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          echo "TimescaleDB is ready"

      # Pulled explicitly (rather than left to the first `docker run` that
      # needs it) so a slow/rate-limited registry pull fails clearly here,
      # under an obvious step name, instead of surfacing later as a mystery
      # delay inside the pre-flight check below or the Playwright test itself.
      - name: Pre-pull alpine:latest (used by the host.docker.internal pre-flight)
        run: docker pull alpine:latest

      # domain-tls-pebble.spec.ts and email-provider-mailpit.spec.ts (below)
      # each document this requirement themselves ("Requires docker compose
      # -f apps/temps-e2e/docker-compose.e2e.yml up -d") -- brought up here so
      # it's ready before `temps serve` starts (it needs a live ACME
      # directory to point ACME_DIRECTORY_URL at) and well before the
      # Playwright run reaches those specs. minio isn't started: nothing in
      # this job (console/API e2e, not apps/temps-e2e's own scenarios) needs it.
      - name: Start Pebble + Mailpit test infra
        run: |
          set -o pipefail

          docker compose -f apps/temps-e2e/docker-compose.e2e.yml up -d pebble pebble-challtestsrv mailpit
          echo "Waiting for Pebble (ACME directory, :14000)..."
          timeout 60 bash -c 'until nc -z localhost 14000; do sleep 1; done'
          echo "Waiting for pebble-challtestsrv (management API, :8056)..."
          timeout 60 bash -c 'until nc -z localhost 8056; do sleep 1; done'
          echo "Waiting for Mailpit (SMTP :1025, API :8025)..."
          timeout 60 bash -c 'until nc -z localhost 1025 && nc -z localhost 8025; do sleep 1; done'
          echo "Pebble + Mailpit test infra ready"

          # Pre-flight: reproduce domain-tls-pebble.spec.ts's
          # resolveHostDockerInternal() exactly (same network, same image, same
          # free-resolution-then---add-host fallback order), so a broken
          # host.docker.internal resolution on this runner fails HERE, with a
          # clear step name, instead of three minutes later as a Playwright
          # retry timeout inside the TLS-via-Pebble test.
          PEBBLE_NET="temps-e2e-pebble-net"
          IPV4_RE='^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
          echo "Resolving host.docker.internal on $PEBBLE_NET (as domain-tls-pebble.spec.ts does)..."

          HOST_IP=""
          if GETENT_OUT=$(docker run --rm --network "$PEBBLE_NET" alpine:latest getent hosts host.docker.internal 2>&1); then
            # A no-match here is a legitimate outcome (falls through to the
            # --add-host retry below), not a script error -- hence `|| true`.
            HOST_IP=$(awk '{print $1}' <<<"$GETENT_OUT" | grep -E "$IPV4_RE" | head -n1 || true)
          fi

          if [ -z "$HOST_IP" ]; then
            echo "Free resolution found no IPv4 address; retrying with --add-host host.docker.internal:host-gateway..."
            if GETENT_OUT=$(docker run --rm --network "$PEBBLE_NET" --add-host host.docker.internal:host-gateway alpine:latest getent hosts host.docker.internal 2>&1); then
              HOST_IP=$(awk '{print $1}' <<<"$GETENT_OUT" | grep -E "$IPV4_RE" | head -n1 || true)
            else
              echo "$GETENT_OUT"
            fi
          fi

          if [ -z "$HOST_IP" ]; then
            echo "ERROR: could not resolve an IPv4 host.docker.internal on $PEBBLE_NET (needed by domain-tls-pebble.spec.ts)." >&2
            echo "--- docker version ---"
            docker version || true
            echo "--- docker network ls ---"
            docker network ls || true
            echo "--- docker network inspect $PEBBLE_NET ---"
            docker network inspect "$PEBBLE_NET" || true
            exit 1
          fi

          echo "host.docker.internal -> $HOST_IP (pre-flight OK)"

      - name: Run temps setup
        run: |
          "$TEMPS_BIN" setup --non-interactive \
            --database-url "$DATABASE_URL" \
            --data-dir "$TEMPS_DATA_DIR" \
            --admin-email "$ADMIN_EMAIL" \
            --admin-password "$ADMIN_PASSWORD" \
            --wildcard-domain "*.localho.st" \
            --wildcard-domain-cert localho.st.crt \
            --wildcard-domain-key localho.st.key \
            --skip-dns-records \
            --skip-git \
            --skip-geolite2-download \
            --output-format json

      - name: Prepare temps runtime files
        run: |
          # Sync encryption key to working directory (temps serve reads from cwd)
          cp "$TEMPS_DATA_DIR/encryption_key" ./encryption_key 2>/dev/null || true
          # Symlink GeoLite2 to working directory
          ln -sf "$TEMPS_DATA_DIR/GeoLite2-City.mmdb" ./GeoLite2-City.mmdb 2>/dev/null || true

      - name: Start temps serve
        env:
          # domain-tls-pebble.spec.ts needs a real ACME exchange against
          # Pebble instead of real Let's Encrypt -- see
          # crates/temps-domains/src/tls/providers.rs's get_acme_url (reads
          # ACME_DIRECTORY_URL) and crates/temps-dns/src/providers/pebble.rs
          # (gated behind TEMPS_ALLOW_PEBBLE_PROVIDER). ACME_INSECURE trusts
          # Pebble's self-signed directory cert.
          ACME_DIRECTORY_URL: https://localhost:14000/dir
          ACME_INSECURE: "1"
          TEMPS_ALLOW_PEBBLE_PROVIDER: "1"
        run: |
          "$TEMPS_BIN" serve \
            --database-url "$DATABASE_URL" \
            --data-dir "$TEMPS_DATA_DIR" \
            --address 0.0.0.0:5002 \
            --tls-address 0.0.0.0:3443 \
            --console-address 0.0.0.0:8081 \
            --disable-https-redirect \
            --screenshot-provider noop \
            > /tmp/temps.log 2>&1 &
          echo $! > /tmp/temps.pid
          echo "Temps server started with PID $(cat /tmp/temps.pid)"
          # Give it a moment to either start or crash
          sleep 3
          if ! kill -0 "$(cat /tmp/temps.pid)" 2>/dev/null; then
            echo "ERROR: Temps server died immediately. Logs:"
            cat /tmp/temps.log
            exit 1
          fi

      - name: Wait for platform health
        run: |
          echo "Waiting for Temps to become healthy..."
          timeout 120 bash -c 'until curl -sf http://localhost:8081/ > /dev/null 2>&1; do sleep 2; done'
          echo "Platform is healthy"
          # NOTE: this only proves the shell is served. A console whose JS dies
          # on boot still answers 200 here -- that is exactly how #504 shipped.
          # The console UI tests below are what actually verify it works.
          curl -s -o /dev/null -w "Console HTTP %{http_code}" http://localhost:8081/
          echo ""

      # Drives the real console in a real browser against the instance started
      # above. Runs before the API-level deploys so a broken UI is reported as a
      # UI failure rather than being buried behind a 20-minute deploy matrix.
      - name: Install Playwright browser
        run: cd web && bunx playwright install --with-deps chromium

      - name: Console UI end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_EMAIL: ${{ env.ADMIN_EMAIL }}
          E2E_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          E2E_REPO_URL: https://github.com/${{ github.repository }}.git
        run: cd web && bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Create API key via CLI
        id: auth
        run: |
          if ! API_OUTPUT=$("$TEMPS_BIN" api-key \
            --database-url "$DATABASE_URL" \
            --name "e2e-test" \
            --role admin \
            --output-format json 2>/dev/null); then
            echo "Failed to create the E2E API key (credential-bearing stdout/stderr suppressed)"
            exit 1
          fi

          API_KEY=$(echo "$API_OUTPUT" | jq -r '.api_key // empty' 2>/dev/null)
          if [ -z "$API_KEY" ]; then
            echo "Failed to extract API key from credential-bearing CLI output (output suppressed)"
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          KEY_ID=$(echo "$API_OUTPUT" | jq -r '.id // "unknown"')
          KEY_PREFIX=$(echo "$API_OUTPUT" | jq -r '.key_prefix // "unknown"')
          echo "API key created: id=$KEY_ID prefix=$KEY_PREFIX"
          printf 'api_key=%s\n' "$API_KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy example applications
        env:
          API_KEY: ${{ steps.auth.outputs.api_key }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          REPO_URL="https://github.com/${{ github.repository }}.git"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BRANCH="$SOURCE_BRANCH"

          # Define example apps: name|directory|preset
          APPS=(
            "nextjs-e2e|examples/nextjs/basic|nextjs"
            "vite-e2e|examples/vite/react-basic|vite"
            "go-e2e|examples/go/gin-basic|go"
          )

          RESULTS=()
          FAILED=0

          for APP_DEF in "${APPS[@]}"; do
            IFS='|' read -r APP_NAME APP_DIR APP_PRESET <<< "$APP_DEF"
            echo ""
            echo "============================================"
            echo "Deploying: $APP_NAME (preset: $APP_PRESET)"
            echo "  Directory: $APP_DIR"
            echo "  Branch: $BRANCH"
            echo "============================================"

            # --- Create project ---
            CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "$API_BASE/projects" \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"$APP_NAME\",
                \"repo_name\": \"$REPO_NAME\",
                \"repo_owner\": \"$REPO_OWNER\",
                \"directory\": \"$APP_DIR\",
                \"main_branch\": \"$BRANCH\",
                \"preset\": \"$APP_PRESET\",
                \"git_url\": \"$REPO_URL\",
                \"is_public_repo\": true,
                \"automatic_deploy\": true,
                \"storage_service_ids\": [],
                \"performance_metrics_enabled\": false
              }")

            HTTP_CODE=$(echo "$CREATE_RESPONSE" | tail -1)
            CREATE_BODY=$(echo "$CREATE_RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "FAIL: Project creation failed with HTTP $HTTP_CODE"
              echo "$CREATE_BODY" | jq . 2>/dev/null || echo "$CREATE_BODY"
              RESULTS+=("$APP_NAME: FAIL (project creation)")
              FAILED=$((FAILED + 1))
              continue
            fi

            PROJECT_ID=$(echo "$CREATE_BODY" | jq -r '.id' 2>/dev/null || true)
            if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
              echo "FAIL: Could not parse project ID from response"
              echo "$CREATE_BODY"
              RESULTS+=("$APP_NAME: FAIL (parse project ID)")
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Project created: id=$PROJECT_ID"

            # --- Get production environment ID ---
            ENV_RESPONSE=$(curl -s \
              -H "Authorization: Bearer $API_KEY" \
              "$API_BASE/projects/$PROJECT_ID/environments")
            ENV_ID=$(echo "$ENV_RESPONSE" | jq -r '.[0].id // .environments[0].id // empty' 2>/dev/null || true)

            if [ -z "$ENV_ID" ]; then
              echo "FAIL: Could not find environment for project $PROJECT_ID"
              RESULTS+=("$APP_NAME: FAIL (no environment)")
              FAILED=$((FAILED + 1))
              continue
            fi
            echo "Environment ID: $ENV_ID"

            # Project creation emits a GitPushEvent which is gated by
            # automatic_deploy. We pass automatic_deploy=true above so the
            # event creates the initial deployment.
            echo "Waiting for auto-triggered deployment to be created..."
            sleep 5

            # --- Poll deployment status ---
            # PipelineStatus enum: pending | running | built | completed | failed | cancelled
            # 'running' means the workflow is executing (build, deploy_container, etc).
            # 'completed' is the only terminal-success state — the route table is updated
            # and the container is serving traffic only after this.
            echo "Polling deployment status (timeout: 10 minutes)..."
            DEPLOY_STATE="pending"
            DEPLOY_ID=""
            DEADLINE=$((SECONDS + 600))

            while [ $SECONDS -lt $DEADLINE ]; do
              DEPLOY_LIST=$(curl -s \
                -H "Authorization: Bearer $API_KEY" \
                "$API_BASE/projects/$PROJECT_ID/deployments?per_page=1")

              DEPLOY_STATE=$(echo "$DEPLOY_LIST" | jq -r '.deployments[0].status // "pending"' 2>/dev/null || echo "pending")
              DEPLOY_ID=$(echo "$DEPLOY_LIST" | jq -r '.deployments[0].id // empty' 2>/dev/null || true)

              if [ "$DEPLOY_STATE" = "completed" ]; then
                echo "Deployment $DEPLOY_ID reached terminal state: $DEPLOY_STATE"
                break
              fi

              if [ "$DEPLOY_STATE" = "failed" ] || [ "$DEPLOY_STATE" = "cancelled" ]; then
                echo "Deployment $DEPLOY_ID failed with state: $DEPLOY_STATE"
                if [ -n "$DEPLOY_ID" ]; then
                  echo "--- Deployment jobs ---"
                  curl -s -H "Authorization: Bearer $API_KEY" \
                    "$API_BASE/projects/$PROJECT_ID/deployments/$DEPLOY_ID/jobs" | jq '.[] | {name: .name, status: .status}' 2>/dev/null || true
                fi
                break
              fi

              echo "  State: $DEPLOY_STATE (waiting for completed...)"
              sleep 15
            done

            if [ "$DEPLOY_STATE" != "completed" ]; then
              echo "FAIL: Deployment did not reach completed state (last state: $DEPLOY_STATE)"
              RESULTS+=("$APP_NAME: FAIL (state: $DEPLOY_STATE)")
              FAILED=$((FAILED + 1))
              continue
            fi

            # --- Verify app is reachable ---
            # Even after deployment.status=completed the route table propagation and
            # container HTTP readiness can lag a few seconds; retry up to ~60s.
            APP_URL="https://$APP_NAME.localho.st:3443/"
            echo "Verifying app at $APP_URL ..."

            VERIFY_DEADLINE=$((SECONDS + 60))
            VERIFY_CODE="000"
            while [ $SECONDS -lt $VERIFY_DEADLINE ]; do
              VERIFY_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL" || echo "000")
              if [ "$VERIFY_CODE" = "200" ] || [ "$VERIFY_CODE" = "304" ]; then
                break
              fi
              echo "  HTTP $VERIFY_CODE — waiting for app to be reachable..."
              sleep 5
            done

            if [ "$VERIFY_CODE" = "200" ] || [ "$VERIFY_CODE" = "304" ]; then
              echo "PASS: $APP_NAME is reachable (HTTP $VERIFY_CODE)"
              RESULTS+=("$APP_NAME: PASS (HTTP $VERIFY_CODE)")
            else
              echo "FAIL: $APP_NAME not reachable (HTTP $VERIFY_CODE)"
              RESULTS+=("$APP_NAME: FAIL (HTTP $VERIFY_CODE)")
              FAILED=$((FAILED + 1))
            fi
          done

          # --- Summary ---
          echo ""
          echo "============================================"
          echo "E2E Test Results"
          echo "============================================"
          for RESULT in "${RESULTS[@]}"; do
            echo "  $RESULT"
          done
          echo "============================================"

          if [ $FAILED -gt 0 ]; then
            echo "FAILED: $FAILED app(s) failed"
            exit 1
          else
            echo "ALL PASSED"
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Temps server logs (last 100 lines) ==="
          if [ -f /tmp/temps.log ]; then
            tail -100 /tmp/temps.log
          else
            echo "No temps log file found"
          fi

          echo ""
          echo "=== Temps process status ==="
          if [ -f /tmp/temps.pid ]; then
            PID=$(cat /tmp/temps.pid)
            echo "Temps PID: $PID"
            pgrep -af temps || true
          fi

          echo ""
          echo "=== Docker containers ==="
          docker ps -a 2>/dev/null || true

          echo ""
          echo "=== Docker logs (last running containers) ==="
          for CID in $(docker ps -q --last 5 2>/dev/null); do
            echo "--- Container $CID ---"
            docker logs --tail 50 "$CID" 2>&1 || true
          done

          echo ""
          echo "=== Disk usage ==="
          df -h /

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/temps.pid ]; then
            kill "$(cat /tmp/temps.pid)" 2>/dev/null || true
          fi
          docker system prune -f 2>/dev/null || true
