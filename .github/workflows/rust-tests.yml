name: Rust Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue runs every test, whatever a pull request's own run
  # selected (see `tests` below), against the exact commit that will land.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# PR-controlled build scripts and privileged E2E containers do not need a
# repository-write token. Keep the run read-only even if repository defaults
# are later broadened.
permissions:
  contents: read

# Superseded PR pushes used to leave the previous run's jobs going to
# completion — including an 80-minute cold musl build whose output nobody
# would ever look at, while the new commit's jobs queued behind it. Cancel
# them. Never on `main`: those runs are what populate the default-branch
# cache scope that every PR reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Pull requests skip the jobs that cannot see what they changed.
  #
  # .github/scripts/classify-ci-changes.py sorts the changed files into areas:
  #   code  "false" when every changed file is documentation (including the
  #         docs pages CI itself reads, which count as code)
  #   rust  "false" when nothing outside docs, web/, apps/temps-cli/ and
  #         skills/ changed: no Rust input, so Cargo Check, Clippy and every
  #         Rust test group are skipped, and build-binary reuses the binary
  #         main built instead of compiling one
  #   web   "true" when web/ changed, or rust is "true"
  #   cli   "true" when apps/temps-cli/ changed, or rust is "true"
  #
  # .github/scripts/ci-affected-crates.py then narrows the Rust tests:
  #   tests         nextest filterset of the crates the change can reach (the
  #                 changed crates, everything depending on them, and any
  #                 crate reading a changed file); `all()` for anything it
  #                 cannot place, such as Cargo.lock or .github/
  #   docker_tests  "false" when temps-providers and temps-backup are out of
  #                 reach, so their docker-tests archive is not built
  # Every test group still runs, on its share of that set: a pull request to
  # the proxy runs the proxy's tests and its dependents', not the backup
  # suites. The merge queue and `main` run all of them, so what this misses
  # is caught before it lands (the Zed CI model).
  #
  # Pushes to `main` and merge-queue runs always run everything, since they
  # seed the caches, the binaries pull requests reuse, and the nightly-release
  # decision.
  #
  # Gated jobs test `!= 'false'` under `!cancelled()`, so if this job fails
  # every output is empty and everything runs: a broken classifier costs
  # runner time, never coverage. Jobs skipped through `if:` report success, so
  # required checks still pass. Matrix jobs are the exception -- a skipped
  # matrix is never expanded, so `Unit Tests (unit-a)` would never report --
  # which is why unit-tests skips its steps instead.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      cli: ${{ steps.classify.outputs.cli }}
      release: ${{ steps.classify.outputs.release }}
      tests: ${{ steps.affected.outputs.tests }}
      docker_tests: ${{ steps.affected.outputs.docker_tests }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          # The pull_request checkout is the merge commit; its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Not a pull request ($GITHUB_EVENT_NAME); running every job."
            printf '%s\n' code=true rust=true web=true cli=true release=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/classify-ci-changes.py --base HEAD^1 --head HEAD
          # A pull request compiles one binary: the debug build that comes
          # out of build-test-binaries. The musl release build and Compose
          # Security, the one suite that needs it, run in the merge queue and
          # on `main` (see build-binary).
          echo "release=false" >> "$GITHUB_OUTPUT"

      - name: Select the crates whose tests can see the change
        id: affected
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Not a pull request ($GITHUB_EVENT_NAME); testing every crate."
            printf '%s\n' 'tests=all()' docker_tests=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/ci-affected-crates.py --base HEAD^1 --head HEAD

  workflow-contracts:
    name: Release Workflow Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify nightly release wiring
        run: .github/scripts/test-nightly-release-workflows.sh

      - name: Test worker agent service installer
        run: scripts/test-install-agent-service.sh

      - name: Verify release image runtime contract
        run: scripts/test-release-dockerfile.sh

      - name: Verify runtime image signing fails closed
        run: python3 .github/scripts/test_runtime_image_signing.py

      - name: Verify workflow caches are save-if guarded
        # An unguarded Swatinem/rust-cache step in a pull_request-triggered
        # workflow duplicates that cache once per open PR ref, evicting the
        # shared temps-musl-fast-* build cache from the repo's 10GB pool and
        # turning every musl build into a ~80min cold compile. Has bitten us
        # twice already (dependency-scan.yml, network-kernel-tests.yml).
        run: python3 .github/scripts/check-cache-save-guards.py

      - name: Test CI crate selection and flaky-test tooling
        run: |
          python3 .github/scripts/test-ci-affected-crates.py
          python3 .github/scripts/test-nextest-flaky.py

      - name: Test musl build cache pruning
        run: python3 .github/scripts/test-prune-cargo-build-cache.py

      - name: Verify pinned agent SDK and daemon build inputs
        run: python3 tools/sandbox-runtime/test_build_inputs.py

      - name: Test CAPTCHA WASM rebuild gate
        run: python3 scripts/test_captcha_wasm_build.py

      - name: Test source attribution tooling
        run: |
          python3 scripts/test_source_attribution.py
          python3 scripts/test_release_attribution.py

      - name: Test stateless file migration safety
        run: python3 scripts/test_migrate_stateless_files.py

      - name: Test release qualification evidence checker
        run: python3 scripts/test_check_release_qualification.py

      - name: Test release test gate
        run: python3 .github/scripts/test_release_test_gate.py

      - name: Test release binary signing
        run: python3 .github/scripts/test_sign_release_binaries.py

      - name: Test installer release lookup and channel selection
        run: python3 .github/scripts/test_install_release_lookup.py

      - name: Test which stable release is marked Latest
        run: python3 .github/scripts/test_release_latest.py

      - name: Test upgrade-test release selection
        run: python3 .github/scripts/test_release_select.py

      - name: Test CI change classification
        run: python3 .github/scripts/test-classify-ci-changes.py

      - name: Test main binary reuse lookup
        run: python3 .github/scripts/test-find-reusable-binary.py

      - name: Test the console proxy E2E uses with a reused binary
        run: python3 .github/scripts/test-serve-console-from-source.py

      - name: Verify source attribution headers
        run: python3 scripts/source_attribution.py check

  otel-protobuf-compat:
    name: OTEL protobuf compatibility (Ubuntu 22.04)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    # The release workflow uses Ubuntu 22.04, whose protobuf compiler requires
    # an explicit proto3-optional flag for the OpenTelemetry metrics schema.
    # Keep this check on the same runner so newer `protoc` versions cannot mask
    # a release-only build failure.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Compile OTEL protobuf bindings
        run: cargo check --lib -p temps-otel

  # ---------------------------------------------------------------------------
  # The musl release binary: merge queue and `main` only.
  #
  # A pull request compiles the workspace once, in build-test-binaries, and
  # every suite runs against the debug `temps` that build produces. This job
  # compiles the second, static musl `fast` binary -- the one that ships in
  # the Docker image -- which takes 45-75 minutes on its own. In the merge
  # queue and on `main` (`release`), E2E, Upgrade and the scenarios run
  # against it, and Compose Security assembles the production image around
  # it, so the artifact users get is tested before it lands.
  #
  # A pull request that changes no Rust input (`rust == 'false'`) does not
  # compile at all. It downloads the binary a `main` push already built from
  # the same Rust source (.github/scripts/find-reusable-binary.py) and
  # re-uploads it under the usual name, so every consumer is unchanged. That
  # binary embeds main's console, not this pull request's, so the E2E job is
  # told (`reused-from`) to serve the console from this checkout in front of
  # it. On a pull request the compile takes 45-65 minutes; the download takes
  # seconds. No match, or any error on the way, builds as before.
  # ---------------------------------------------------------------------------
  build-binary:
    name: Build temps Binary (musl)
    needs: changes
    # Two different jobs share this one.
    #
    # On a pull request with no Rust change it reuses main's binary, in
    # seconds, for the console and CLI suites below (docs- and skills-only
    # changes have no consumer). No other pull request runs it: there is no
    # debug build to test when nothing in Rust changed, and when something
    # did, build-test-binaries already produced one.
    #
    # In the merge queue and on `main` (`release`) it compiles the musl
    # release binary.
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.release != 'false'
      || (needs.changes.outputs.rust == 'false'
      && (needs.changes.outputs.web != 'false' || needs.changes.outputs.cli != 'false'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Looks up main's rust-tests runs and downloads their binary artifact.
      actions: read
    outputs:
      # The main commit whose binary was reused, or empty when it was built.
      reused-from: ${{ steps.binary-source.outputs.reused-from }}
    # Measured, not warm-cache folklore: on `main` with an exact cache hit this
    # job takes 65-83 minutes, because every one of the ~95 workspace crates
    # recompiles on each run. A pull request that moves Cargo.lock also
    # recompiles the dependencies that changed (172 crates for a RustCrypto
    # bump) on top of that, and pull requests never save the cache, so every
    # push pays it again. One such run needed 93.5 minutes and was cancelled
    # by the old 100 minute ceiling in the same second cargo finished, before
    # the artifact upload. 130 leaves room for that case.
    timeout-minutes: 130
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # The reuse lookup walks main's first-parent history back from the
          # merge commit's base, and diffs each candidate against the merge
          # commit, so it needs that much history.
          fetch-depth: ${{ needs.changes.outputs.rust == 'false' && 20 || 1 }}

      - name: Find a reusable main binary
        id: reuse
        if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 .github/scripts/find-reusable-binary.py
          --base HEAD^1 --head HEAD --artifact temps-binary-musl-fast

      - name: Download reusable main binary
        id: reuse-download
        if: steps.reuse.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.reuse.outputs.artifact-name }}
          path: ci-prebuilt
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Every step from here to the upload compiles, and is skipped when this
      # reports a reused binary.
      - name: Record binary source
        id: binary-source
        env:
          DOWNLOAD_OUTCOME: ${{ steps.reuse-download.outcome }}
          REUSE_SHA: ${{ steps.reuse.outputs.sha }}
          REUSE_RUN: ${{ steps.reuse.outputs.run-id }}
        run: |
          if [[ "$DOWNLOAD_OUTCOME" == success ]] \
            && chmod +x ci-prebuilt/temps && ci-prebuilt/temps --version; then
            echo "::notice title=temps binary reused::No Rust input changed, so this run uses the binary main built for $REUSE_SHA (run $REUSE_RUN) instead of compiling one. E2E serves this pull request's console in front of it."
            echo "reused-from=$REUSE_SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$REUSE_RUN" ]]; then
              echo "::warning::Could not use main's binary from run $REUSE_RUN (download: $DOWNLOAD_OUTCOME); building it instead."
            fi
            rm -rf ci-prebuilt
            echo "reused-from=" >> "$GITHUB_OUTPUT"
          fi

      # The runner starts with ~27GiB free. The restored cache archive, its
      # extracted target dir, the build and the archive written on save all
      # need room at once: with the 21GB entry, restores aborted partway and a
      # save died with "No space left on device", which left its key reserved
      # so later runs could not save either. Same cleanup as the test jobs.
      - name: Free up disk space
        if: steps.binary-source.outputs.reused-from == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        if: steps.binary-source.outputs.reused-from == ''
        uses: docker/setup-buildx-action@v4

      # The toolchain stage (apk deps, bun, wasm-pack/wasm-bindgen-cli compiled
      # from source) only changes when the Dockerfile does, so cache it as
      # image layers. It doubles as the build container below: compiling
      # inside it produces the same musl binary the production builder stage
      # would, but with a cargo target dir that persists across runs — the
      # one thing an in-Docker build can never have.
      - name: Build toolchain image (GHA layer cache)
        if: steps.binary-source.outputs.reused-from == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: toolchain
          platforms: linux/amd64
          load: true
          tags: temps-toolchain:ci
          cache-from: type=gha,scope=temps-toolchain
          # Write from `main` only. Cache writes are scoped to the producing
          # ref, so exporting from PRs stored a private copy of a
          # byte-identical image in every open PR's scope — four concurrent
          # PRs held four copies of the same layer set, ~718MB each, ~2.9GB
          # of a 10GB pool, evicting the cargo caches this job depends on.
          # Reads see `main`'s copy, which is what every ref can read anyway.
          # A PR touching the Dockerfile's toolchain stage rebuilds it (~7min)
          # and can't cache that for its own next push; toolchain changes are
          # rare enough that this is the cheaper side of the trade.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=temps-toolchain,mode=max' || '' }}

      # Keyed on Cargo.lock + Dockerfile, so any dependency bump misses. The
      # `restore-keys` prefix is what makes that survivable: it falls back to
      # the most recent musl target dir and rebuilds only what changed. That
      # fallback only works if the entry still exists — see the note in
      # `release.yml` about the 10GB pool being flooded by dead tag-scoped
      # buildkit blobs, which is what made this miss outright and turned a
      # ~5 minute incremental build into 81 minutes of cold compile.
      #
      # Restore always, save from `main` only. This is the largest single
      # cache in the repo (a musl target dir plus cargo registry for 55
      # crates), so a per-ref copy of it is what pushed the pool over its
      # 10GB limit fastest — four open PRs each holding their own was several
      # GB spent guaranteeing that nobody's copy survived. A PR that changes
      # Cargo.lock now rebuilds the delta on top of main's copy on every
      # push, instead of everyone cold-building because the pool thrashed.
      - name: Restore cargo target dir (musl, fast profile)
        if: steps.binary-source.outputs.reused-from == ''
        id: musl-cache
        uses: actions/cache/restore@v6
        with:
          path: ci-build-cache
          key: temps-musl-fast-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          restore-keys: |
            temps-musl-fast-

      # Build the CAPTCHA from source before embedding it in the application.
      # Byte differences from the committed package do not block the build.
      - name: Rebuild CAPTCHA WASM in toolchain container
        if: steps.binary-source.outputs.reused-from == ''
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD":/build --workdir /build/crates/temps-captcha-wasm \
            --env CARGO_TARGET_DIR=/tmp/captcha-target \
            temps-toolchain:ci \
            sh -ec 'git config --global --add safe.directory /build; rustc -Vv; wasm-pack --version; wasm-bindgen --version; npm run build'

      # Continues the Dockerfile builder stage (web UI -> cargo build)
      # inside the toolchain container, with target/ and the cargo registry
      # mounted from the persistent cache so rebuilds are incremental. Uses
      # the `fast` profile (release semantics, parallel codegen, no LTO);
      # production images keep the default `release` profile. The JSON
      # messages list every unit of the build, fresh or not, which is what
      # the prune step below keys on.
      - name: Build temps binary in toolchain container
        if: steps.binary-source.outputs.reused-from == ''
        run: |
          mkdir -p ci-build-cache/target ci-build-cache/cargo-registry ci-prebuilt
          docker run --rm \
            --volume "$PWD":/build --workdir /build \
            --volume "$PWD/ci-build-cache/target":/build/target \
            --volume "$PWD/ci-build-cache/cargo-registry":/usr/local/cargo/registry \
            temps-toolchain:ci \
            sh -ec '
              git config --global --add safe.directory /build
              cd /build/web && bun install && \
                RSBUILD_OUTPUT_PATH=/build/crates/temps-cli/dist bun run build
              cd /build
              cargo build --profile fast --bin temps --package temps-cli \
                --message-format=json-render-diagnostics > cargo-build-messages.json
              cp target/fast/temps ci-prebuilt/temps
              chown -R '"$(id -u):$(id -g)"' /build/target /usr/local/cargo/registry \
                ci-prebuilt crates/temps-cli/dist cargo-build-messages.json
            '
          chmod +x ci-prebuilt/temps
          file ci-prebuilt/temps

      # Restoring from the newest older entry and saving under a new key
      # carries every earlier generation of build output forward: each
      # dependency bump left a full second copy of the workspace's rlibs and
      # incremental sessions behind, and the entry reached 21GB. Drop what
      # this build did not use before saving. Runs that don't save only
      # report what would go, so the numbers stay visible on every PR.
      - name: Prune stale build output from cargo cache
        if: steps.binary-source.outputs.reused-from == ''
        env:
          PRUNE_MODE: ${{ github.ref == 'refs/heads/main' && steps.musl-cache.outputs.cache-hit != 'true' && '--apply' || '' }}
        run: |
          prune_args=()
          if [[ -n "$PRUNE_MODE" ]]; then prune_args+=("$PRUNE_MODE"); fi
          python3 .github/scripts/prune-cargo-build-cache.py "${prune_args[@]}" \
            --messages cargo-build-messages.json \
            --target-dir ci-build-cache/target \
            --registry ci-build-cache/cargo-registry \
            --lockfile Cargo.lock

      # Pruning decides "stale" from cargo's hashes. If a cargo release ever
      # changes how those map to file names, this rebuild puts back whatever
      # was wrongly removed before the save, so the cache stays complete, and
      # the warning says the prune script needs updating.
      - name: Verify pruned cache is still fresh
        if: steps.binary-source.outputs.reused-from == '' && github.ref == 'refs/heads/main' && steps.musl-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            --volume "$PWD":/build --workdir /build \
            --volume "$PWD/ci-build-cache/target":/build/target \
            --volume "$PWD/ci-build-cache/cargo-registry":/usr/local/cargo/registry \
            temps-toolchain:ci \
            sh -ec '
              git config --global --add safe.directory /build
              cargo build --profile fast --bin temps --package temps-cli \
                --message-format=json-render-diagnostics > cargo-verify-messages.json
              chown -R '"$(id -u):$(id -g)"' /build/target /usr/local/cargo/registry \
                cargo-verify-messages.json
            '
          rebuilt=$(jq -r 'select(.reason == "compiler-artifact" and .fresh == false) | .target.name' \
            cargo-verify-messages.json)
          if [ -n "$rebuilt" ]; then
            echo "::warning::Pruning removed build output that was still in use (rebuilt before saving): ${rebuilt//$'\n'/, }"
          else
            echo "All units fresh after pruning."
          fi

      - name: Save cargo target dir (musl, fast profile)
        if: steps.binary-source.outputs.reused-from == '' && github.ref == 'refs/heads/main' && steps.musl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ci-build-cache
          key: temps-musl-fast-${{ hashFiles('Cargo.lock', 'Dockerfile') }}

      - name: Upload temps binary
        uses: actions/upload-artifact@v7
        with:
          name: temps-binary-musl-fast
          path: ci-prebuilt/temps
          # Pull requests that change no Rust input reuse main's copy, so keep
          # it long enough to outlive a quiet weekend on main: a base whose
          # binary has expired means a 45-65 minute compile instead. Pull
          # request copies are only read within their own run.
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}
          # Already a stripped binary; re-compressing costs more than it saves.
          compression-level: 0

  # Lives in its own file for readability; called from here so it can reuse
  # the binary `build-binary` already compiled. Artifacts are per-run, and a
  # called workflow is part of the same run, so the download just works.
  #
  # The consumers below each run only for the areas they can see. Their
  # `!cancelled()` plus the explicit build-binary check keeps them running
  # when `changes` itself failed (every output empty), which the implicit
  # success() would not.
  #   e2e           console + API: Rust or web/ changes
  #   scenario-e2e  drives the CLI against the API: Rust or apps/temps-cli/
  #   upgrade-test, compose-security  the binary and the install path: Rust
  #
  # Each consumer takes the musl binary when build-binary produced one (main's
  # reused copy, or the release compile in the merge queue and on `main`),
  # and otherwise the debug binary from build-test-binaries. Neither binary carries this checkout's console --
  # main's embeds main's, a debug build embeds a placeholder -- so the
  # console is served from source unless this run compiled the release binary.
  e2e:
    name: E2E
    needs: [changes, build-binary, build-test-binaries]
    if: >-
      ${{ !cancelled()
      && (needs.build-binary.result == 'success' || needs.build-test-binaries.result == 'success')
      && (needs.changes.outputs.rust != 'false' || needs.changes.outputs.web != 'false') }}
    uses: ./.github/workflows/e2e-tests.yml
    with:
      binary-artifact: ${{ needs.build-binary.result == 'success' && 'temps-binary-musl-fast' || 'temps-binary-debug' }}
      console-from-source: ${{ needs.build-binary.result != 'success' || needs.build-binary.outputs.reused-from != '' }}
      # The merge gate: boot, login, navigation, real deploys. The UI-copy
      # specs run as the non-blocking `e2e-ui` report below.
      suite: smoke

  # Every Playwright spec, on its own runner so it adds no wall-clock time to
  # the gate above. Non-blocking by construction (see the `suite` input in
  # e2e-tests.yml): failures surface as a warning and a step summary. Runs
  # whenever the console could have changed (`web` is also set by any Rust
  # change), and on every push to `main`.
  e2e-ui:
    name: E2E UI
    needs: [changes, build-binary, build-test-binaries]
    if: >-
      ${{ !cancelled()
      && (needs.build-binary.result == 'success' || needs.build-test-binaries.result == 'success')
      && needs.changes.outputs.web != 'false' }}
    uses: ./.github/workflows/e2e-tests.yml
    with:
      binary-artifact: ${{ needs.build-binary.result == 'success' && 'temps-binary-musl-fast' || 'temps-binary-debug' }}
      console-from-source: ${{ needs.build-binary.result != 'success' || needs.build-binary.outputs.reused-from != '' }}
      suite: full

  # The existing E2E workflow above covers Playwright and three example
  # deployments. This separate matrix runs the real apps/temps-e2e scenario
  # CLI in isolated shards, including the dedicated multinode/mTLS topology.
  scenario-e2e:
    name: Scenario E2E
    needs: [changes, build-binary, build-test-binaries]
    if: >-
      ${{ !cancelled()
      && (needs.build-binary.result == 'success' || needs.build-test-binaries.result == 'success')
      && (needs.changes.outputs.rust != 'false' || needs.changes.outputs.cli != 'false') }}
    uses: ./.github/workflows/apps-e2e-tests.yml
    with:
      binary-artifact: ${{ needs.build-binary.result == 'success' && 'temps-binary-musl-fast' || 'temps-binary-debug' }}

  # Seeds an installation with the newest published release, upgrades it with
  # this build, and checks data, the pre-migration backup, the schema guard
  # and a backup-based rollback. Also runs nightly from its own file.
  upgrade-test:
    name: Upgrade
    needs: [changes, build-binary, build-test-binaries]
    if: >-
      ${{ !cancelled()
      && (needs.build-binary.result == 'success' || needs.build-test-binaries.result == 'success')
      && needs.changes.outputs.rust != 'false' }}
    uses: ./.github/workflows/upgrade-tests.yml
    with:
      binary-artifact: ${{ needs.build-binary.result == 'success' && 'temps-binary-musl-fast' || 'temps-binary-debug' }}

  compose-security:
    name: Compose Security
    runs-on: ubuntu-latest
    needs: [changes, build-binary]
    # Merge queue and `main` only: it needs the release build.
    if: ${{ !cancelled() && needs.build-binary.result == 'success' && needs.changes.outputs.rust != 'false' && needs.changes.outputs.release != 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download temps binary
        uses: actions/download-artifact@v8
        with:
          name: temps-binary-musl-fast
          path: ci-prebuilt

      - name: Restore executable bit
        run: chmod +x ci-prebuilt/temps

      # Assemble the production runtime stage around the prebuilt binary —
      # the builder stage is skipped entirely, so this takes ~1 minute.
      - name: Build temps image from prebuilt binary
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: temps-compose-security:ci
          build-args: |
            TEMPS_ARTIFACTS=artifacts-prebuilt

      - name: Validate secure Compose defaults
        env:
          COMPOSE_SECURITY_OVERRIDE: .github/compose-security.prebuilt.yml
          COMPOSE_SECURITY_PREBUILT: "1"
        run: scripts/test-compose-security.sh

      # Same harness against the source-free release manifest. The prebuilt
      # override replaces `services.temps.image`, so this exercises the
      # release wiring against the image this run just built rather than
      # whatever tag GHCR currently serves.
      - name: Validate secure Compose defaults (release manifest)
        env:
          COMPOSE_SECURITY_MANIFEST: docker-compose.release.yml
          COMPOSE_SECURITY_OVERRIDE: .github/compose-security.prebuilt.yml
          COMPOSE_SECURITY_PREBUILT: "1"
        run: scripts/test-compose-security.sh

  # `Cargo Check` is a required status check, but it no longer compiles
  # anything. `cargo check --workspace --all-targets` compiled the whole
  # workspace a third time to prove what two other jobs already prove:
  # build-test-binaries builds every target with default features (a
  # superset of check), and clippy checks every target with all features and
  # also denies warnings. This job reports their verdict under the required
  # name, so branch protection keeps meaning "the workspace compiles". Its
  # one unique step, the agent service installer test, now runs in
  # workflow-contracts.
  check:
    name: Cargo Check
    needs: [changes, build-test-binaries, clippy]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the workspace to compile with default and all features
        env:
          BUILD_TEST_BINARIES: ${{ needs.build-test-binaries.result }}
          CLIPPY: ${{ needs.clippy.result }}
        run: |
          echo "Build Test Binaries (default features, all targets): $BUILD_TEST_BINARIES"
          echo "Clippy (all features, all targets): $CLIPPY"
          if [[ "$BUILD_TEST_BINARIES" != success || "$CLIPPY" != success ]]; then
            echo "::error::The workspace did not compile; see the Build Test Binaries and Clippy jobs."
            exit 1
          fi

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  web-typecheck:
    name: Web TypeScript Check
    needs: changes
    # Skipped only for docs-, CLI- and skills-only changes. Anything web/
    # imports from outside itself is in the Rust area, which sets `web` too.
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          no-cache: ${{ github.ref != 'refs/heads/main' }}

      # Restore always, save only from `main` — see the cache-scoping note on
      # the toolchain export above.
      # Exact-key only: a partial restore from another lockfile leaves
      # packages the lockfile no longer pins, and `bun install` does not
      # evict them, so tsc then checks against a node_modules nobody
      # declared. Frozen, so a lockfile that does not match package.json
      # fails here instead of being silently rewritten.
      - name: Restore Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      # Main builds the console once more for e2e-tests.yml, which serves it
      # in front of a debug binary whenever web/ is unchanged (pull requests
      # never embed it). Looked up before `bun install`: the key must hash
      # the same files e2e-tests.yml hashes.
      # Keyed once, up front: the steps below may leave files in web/ (a
      # tsbuildinfo, an ESLint cache) that would change a key computed later.
      - name: Key the console build
        id: console-key
        if: github.ref == 'refs/heads/main'
        run: echo "key=console-dist-${{ hashFiles('web/**', '!web/**/node_modules/**', '!web/dist/**') }}" >> "$GITHUB_OUTPUT"

      - name: Look up the cached console build
        id: console-cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: web/dist
          key: ${{ steps.console-key.outputs.key }}
          lookup-only: true

      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Save Bun dependencies
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      # react/react-dom drifting apart is invisible to tsc and rsbuild but
      # blanks the console at runtime with React error #527 (issue #504).
      - name: Check react/react-dom versions match
        run: cd web && bun run check:react-versions

      - name: Type check
        run: cd web && bunx tsc --noEmit

      - name: Web unit tests
        run: cd web && bun run test

      - name: Web ESLint
        run: cd web && bunx eslint . --quiet

      - name: Build the console for E2E to reuse
        if: github.ref == 'refs/heads/main' && steps.console-cache.outputs.cache-hit != 'true'
        run: cd web && bun run build

      - name: Save the console build
        if: github.ref == 'refs/heads/main' && steps.console-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: web/dist
          key: ${{ steps.console-key.outputs.key }}

  openapi-canonical:
    name: OpenAPI Spec Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          no-cache: ${{ github.ref != 'refs/heads/main' }}

      # No `bun install`: the check reads the committed file and needs nothing
      # but Bun itself, so it reports in seconds on every pull request.
      #
      # What it catches: the CLI's client is generated from a *committed* spec,
      # and the server serves that document minified on one line. Writing the
      # response straight to the file turns ~92,000 lines into 1, so the diff
      # reports ~92,000 deletions and the real change becomes unreviewable.
      - name: Check openapi.json is canonical
        run: bun apps/temps-cli/scripts/check-openapi.ts

  clippy:
    name: Clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Saved from `main` only: writes are scoped to the producing ref, so
          # `save-if: true` stored a separate ~886MB copy in every open PR's
          # scope. PRs restore main's copy and rebuild the delta on top.
          # (This key used to be shared with a `cargo check` job that built
          # default features, so whichever of the two saved first left the
          # other recompiling every dependency whose features differ.)
          shared-key: test-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No CAPTCHA WASM rebuild: temps-proxy include_bytes!-es the committed
      # crates/temps-captcha-wasm/pkg, which is all clippy needs to compile.
      # The rebuild-from-source check lives in build-binary, before the
      # binary that ships is linked.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Build every test binary exactly once, archive it, share across all
  # downstream test jobs.
  # ---------------------------------------------------------------------------
  # Two archives, not one: `cargo nextest archive --workspace` unifies
  # features the same way for every crate in a given invocation, so as long
  # as every consumer of an archive selects tests via `-E 'package(...)'`
  # (not `-p`, which nextest rejects alongside --archive-file anyway) against
  # THIS SAME invocation's output, there's no resolver-scope mismatch and
  # nothing needs to recompile downstream (verified locally: archiving a
  # subset, then `cargo nextest run --archive-file ... -E 'package(x)'` for
  # an even narrower selection produces zero "Compiling" output).
  #
  # temps-providers/temps-backup's docker-tests feature can't be baked into
  # one shared archive unconditionally, though: GitHub's ubuntu-latest
  # runners have a live Docker daemon by default, so if unit-tests' runner
  # executed those Docker-heavy tests (S3 backup/restore, pg17/pg18 major
  # upgrades) they would NOT gracefully no-op like they do on a
  # Docker-less host -- they'd actually run, against none of the shared
  # service containers integration-tests sets up. Building a second
  # archive with docker-tests on, used only by the groups that actually
  # provision Docker/DB services, keeps that boundary intact.
  build-test-binaries:
    name: Build Test Binaries
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free up disk space
        # In the background: deleting these took up to 3.6 minutes, and
        # nothing needs the space until the compile is well under way. This
        # job runs no containers, so there are no images to prune.
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            > /dev/null 2>&1 &

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # This is now the only job that compiles anything -- every
          # downstream job runs pre-built binaries from the archives below,
          # so there's no cross-scope resolver mismatch to worry about (see
          # the removed per-group cache keys this replaces).
          shared-key: nextest-archive
          # Save from `main` only — this key's archive runs ~1.3GB, and
          # per-PR copies of it were a top-three consumer of the repo's 10GB
          # cache pool. See the check job for the full reasoning.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache above restores third-party crates only; every workspace
      # crate used to recompile on every run. sccache caches those by content
      # hash, so a pull request recompiles only the crates its change reaches
      # (and their dependents). `main` writes the entries, pull requests only
      # read them -- the same rule as every other cache here, since a pull
      # request's writes would evict main's. Enabled after rust-cache so its
      # key, which hashes RUST* variables, stays the same. Test harnesses are
      # bin targets, which sccache does not cache, so each crate's
      # #[cfg(test)] build still compiles every time.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            fi
          } >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Archive default-feature test binaries
        # Used by unit-tests (both groups) and the docker-deployments
        # integration group -- none of them need temps-providers/temps-backup's
        # docker-tests feature.
        run: cargo nextest archive --workspace --all-targets --archive-file test-binaries-default.tar.zst
        env:
          CARGO_INCREMENTAL: 0

      # The archive above builds every target, the `temps` binary included,
      # with the feature set the whole workspace resolves to. Building it on
      # its own (`cargo build -p temps-cli`) resolves different features for
      # shared dependencies and recompiled them: 12 extra minutes, measured.
      - name: Collect debug temps binary
        run: |
          mkdir -p ci-prebuilt
          cp target/debug/temps ci-prebuilt/temps
          ci-prebuilt/temps --version

      - name: Upload debug temps binary
        uses: actions/upload-artifact@v7
        with:
          name: temps-binary-debug
          path: ci-prebuilt/temps
          retention-days: 1

      - name: Archive docker-tests test binaries
        # Used by docker-providers/docker-backups/postgres-upgrades and
        # mariadb-pitr-e2e. `docker-tests = []` on both crates (no optional
        # deps), so this only recompiles temps-providers/temps-backup
        # themselves on top of the previous step's already-built dependency
        # graph, not the whole workspace again. Still ~5 minutes, so it is
        # skipped when the change cannot reach either crate.
        if: needs.changes.outputs.docker_tests != 'false'
        run: cargo nextest archive --package temps-providers --package temps-backup --all-targets --features temps-providers/docker-tests,temps-backup/docker-tests --archive-file test-binaries-docker-tests.tar.zst
        env:
          CARGO_INCREMENTAL: 0

      - name: Upload default-feature archive
        uses: actions/upload-artifact@v7
        with:
          name: test-binaries-default
          path: test-binaries-default.tar.zst
          compression-level: 0
          retention-days: 1

      - name: Upload docker-tests archive
        if: needs.changes.outputs.docker_tests != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: test-binaries-docker-tests
          path: test-binaries-docker-tests.tar.zst
          compression-level: 0
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 1: Unit tests (fast, no Docker containers needed)
  # ---------------------------------------------------------------------------
  # Runs all workspace tests WITHOUT the docker-tests feature. Both groups
  # only download the archive and run it -- no compilation happens here.
  #
  # These three checks are required by branch protection, and a matrix job
  # skipped through `if:` is never expanded, so `Unit Tests (unit-a)` would
  # never report and a PR without Rust changes could not merge. On such a PR
  # (`rust == 'false'`) the job therefore still runs once per group, but every
  # step is skipped. Otherwise it runs exactly as before: only after
  # build-test-binaries succeeds.
  unit-tests:
    name: "Unit Tests (${{ matrix.group }})"
    runs-on: ubuntu-latest
    needs: [changes, build-test-binaries]
    if: ${{ !cancelled() && (needs.build-test-binaries.result == 'success' || needs.changes.outputs.rust == 'false') }}
    permissions:
      contents: read
      # Read the learned-serial artifact (nextest-apply-learned-serial.sh).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit-a
            # kind(=lib): the old `--lib` flag excluded tests/*.rs integration
            # test files. Some of those files (e.g. temps-providers' Docker
            # integration tests) were never run by ANY CI job and aren't
            # necessarily green -- switching the shared archive to
            # --all-targets pulled them in by accident once (see PR
            # discussion), so every group that used to pass --lib keeps that
            # exact scope here via kind(=lib) instead.
            filter: >-
              (package(temps-providers) or package(temps-presets) or
              package(temps-auth) or package(temps-core) or
              package(temps-monitoring) or package(temps-kv) or
              package(temps-analytics-funnels) or package(temps-webhooks) or
              package(temps-infra) or package(temps-captcha-wasm) or
              package(temps-geo) or package(temps-environments) or
              package(temps-audit) or package(temps-analytics-performance) or
              package(temps-shield))
              and kind(=lib)
          - group: unit-b
            # `not (temps-git and *_real_api)`: those tests call the live
            # github.com / gitlab.com REST APIs unauthenticated, so they share
            # a per-IP rate limit with every other job on the runner fleet.
            # They only tolerate `RateLimitExceeded`, but a throttled provider
            # answers with a body the parser can't decode, which surfaces as
            # `ApiError("Failed to parse tree: error decoding response body")`
            # and panics -- turning third-party availability into a red build
            # on PRs that never touched temps-git. Same reasoning already
            # applied to temps-auth::oidc_discovery_live and
            # temps-git::gitea_e2e in unit-integration below. They still run
            # (and still assert strictly) with `cargo test -p temps-git`.
            filter: >-
              (package(temps-proxy) or package(temps-error-tracking) or
              package(temps-git) or package(temps-screenshots) or
              package(temps-routes) or package(temps-entities) or
              package(temps-cli) or package(temps-status-page) or
              package(temps-import) or package(temps-queue) or
              package(temps-query) or package(temps-analytics-session-replay) or
              package(temps-dns) or package(temps-email) or
              package(temps-analytics) or package(temps-analytics-events) or
              package(temps-otel)) and kind(=lib)
              and not (package(temps-git) and test(/_real_api$/))
          - group: unit-integration
            # The kind(=test) counterpart to the two groups above: crates
            # whose tests/*.rs files need neither Docker nor a database, and
            # which therefore no CI job has ever run (the groups above are
            # all kind(=lib)).
            #
            # This list is deliberately short. Every candidate was run
            # locally first, and two were dropped because they FAIL today —
            # they are not in scope here and each needs its own fix:
            #   temps-dns-resolver  both end_to_end tests time out
            #                       ("first sync converged: Elapsed(())")
            #   temps-agents        sandbox_credential_smoke_test builds a
            #                       Docker image; `cargo build --release
            #                       --bin temps-pty-agent` exits 101
            # Also excluded, needing infrastructure CI does not have:
            # temps-network (it_kernel/it_allocator — covered by
            # network-kernel-tests.yml), temps-agents::firecracker_e2e (KVM),
            # temps-auth::oidc_discovery_live and temps-git::gitea_e2e (live
            # network / a Gitea server).
            filter: >-
              (package(temps-ai-gateway) or package(temps-git-credential) or
              package(temps-memory) or package(temps-pty-agent))
              and kind(=test)

    steps:
      - name: Skip when no Rust input changed
        if: needs.changes.outputs.rust == 'false'
        run: echo "No Rust input changed; nothing for ${{ matrix.group }} to test."

      - name: Free up disk space
        if: needs.changes.outputs.rust != 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      # TestDatabase::new() (crates/temps-database/src/test_utils.rs) falls
      # back to lazily booting its own TimescaleDB container via a
      # process-local `OnceCell` when TEMPS_TEST_DATABASE_URL isn't set --
      # reused across tests only within the SAME process. Nextest runs every
      # test in its own fresh process by design (its core isolation
      # feature), so that OnceCell resets before every single test: instead
      # of one container booted once per crate (cargo test's per-binary
      # model), nextest was trying to cold-boot a brand new container for
      # EVERY test, which starved connect_with_retry's budget (tuned for "an
      # already-warm container", not "just called .start() this instant")
      # and caused Docker port-allocation races from the extra churn.
      # Pointing at one externally-started, already-running TimescaleDB via
      # TEMPS_TEST_DATABASE_URL (matching integration-tests/mariadb-pitr-e2e
      # below) sidesteps that: TestDatabase connects and isolates via a
      # unique schema per test instead of booting a container at all, which
      # is exactly what those other jobs already do safely across many
      # separate processes hitting one shared instance (see
      # run_migrations_with_retry's deadlock-retry logic in test_utils.rs).
      - name: Start TimescaleDB (background workers disabled)
        if: needs.changes.outputs.rust != 'false'
        run: |
          docker run -d --name timescaledb \
            -e POSTGRES_DB=test_db \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            timescale/timescaledb-ha:pg18 \
            postgres -c timescaledb.max_background_workers=0 -c max_connections=400

      - name: Checkout code
        if: needs.changes.outputs.rust != 'false'
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        if: needs.changes.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        if: needs.changes.outputs.rust != 'false'
        uses: taiki-e/install-action@nextest

      - name: Download test binaries
        if: needs.changes.outputs.rust != 'false'
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-default

      - name: Verify TimescaleDB is ready
        if: needs.changes.outputs.rust != 'false'
        run: |
          timeout 60 bash -c 'until docker exec timescaledb pg_isready -U test_user -d test_db; do sleep 1; done'
          echo "TimescaleDB is ready"

      - name: Serialise the tests CI has seen flake
        if: needs.changes.outputs.rust != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/nextest-apply-learned-serial.sh

      - name: Run unit tests
        if: needs.changes.outputs.rust != 'false'
        env:
          RUST_BACKTRACE: 1
          TEMPS_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        # Parallel (one test per CPU, nextest's default). These groups ran
        # with --test-threads=1 for a long time because every test migrated
        # its own schema inside one shared database, and that DDL deadlocked
        # across test processes (40P01). Each test now gets a database of its
        # own, cloned from a template migrated once per run, so there is no
        # shared catalog left to deadlock on. The few tests that share
        # something else are serialized by name in .config/nextest.toml.
        #
        # The group's own filter is narrowed to the crates this change can
        # reach (`tests`, all of them outside pull requests); a group left
        # with nothing to run passes. `--profile ci` retries a failing test
        # twice and writes the JUnit report the next two steps read.
        run: >-
          cargo nextest run --profile ci --no-tests=pass
          --archive-file test-binaries-default.tar.zst --workspace-remap .
          -E '(${{ matrix.filter }}) and (${{ needs.changes.outputs.tests || 'all()' }})'

      - name: Report flaky tests
        if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
        # nextest writes it under target/nextest/ci/ of the remapped
        # workspace; found rather than assumed, and copied to one fixed path
        # for the upload.
        run: |
          junit=$(find . -path '*/nextest/ci/junit.xml' -print -quit)
          if [[ -n "$junit" ]]; then cp "$junit" nextest-junit.xml; fi
          python3 .github/scripts/nextest-flaky.py report --group "${{ matrix.group }}" nextest-junit.xml

      - name: Upload JUnit report
        if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.group }}
          path: nextest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Phase 2: Integration tests (Docker + Database required)
  # ---------------------------------------------------------------------------
  # Runs tests that need Docker daemon and/or a real database. Runs
  # alongside unit-tests (both only need build-test-binaries), not after it --
  # nothing here depends on unit-tests' result anymore since a compile
  # failure would already fail build-test-binaries before either starts.
  integration-tests:
    name: "Integration Tests (${{ matrix.group }})"
    runs-on: ubuntu-latest
    needs: [changes, build-test-binaries]
    # Not the implicit success(): a failed `changes` must still run these,
    # with every output empty, which reads as "test everything".
    if: ${{ !cancelled() && needs.build-test-binaries.result == 'success' }}
    permissions:
      contents: read
      # Read the learned-serial artifact (nextest-apply-learned-serial.sh).
      actions: read
    # 90 min headroom for the postgres-upgrades group, which can spike past
    # 45 min when pg17/pg18 image pulls land on a cold runner and several
    # orchestrator tests recover serially. Other groups still finish well
    # under that — the timeout only kicks in for true outliers.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: docker-providers
            # temps-providers with Docker tests enabled.
            # NOTE: orchestrator_* tests run in a dedicated `postgres-upgrades`
            # group, and *_backup_and_restore_to_s3 tests in a dedicated
            # `docker-backups` group (both serial, long-running, container-heavy).
            # Skip them here so this group stays fast.
            # Two at a time. This group ran at 1 because its tests raced each
            # other in the one shared database (40P01 deadlocks, background-
            # worker exhaustion in test_delete_service); each test now has a
            # database of its own. More than 2 mostly adds Docker contention:
            # most tests here start a service container, and host-port picks
            # (externalsvc/port_util.rs) can still collide across processes,
            # which postgres/redis/mongodb/s3 retry and MariaDB does not.
            # kind(=lib): matches the old --lib flag -- excludes
            # tests/*.rs integration test files (e.g. temps-providers'
            # mariadb_binlog_health_integration.rs), which no CI job has ever
            # run and aren't necessarily green yet.
            archive: docker-tests
            filter: package(temps-providers) and kind(=lib) and not test(orchestrator_) and not test(backup_and_restore_to_s3)
            test_threads: "2"
          - group: docker-backups
            # Heavyweight S3 backup/restore integration tests
            # (test_{mongodb,postgres,redis,s3}_backup_and_restore_to_s3). Each
            # spins up an S3-compatible container plus a service container and streams a
            # real wal-g/mongodump backup, so running them in parallel saturates
            # Docker and races for host ports (`port is already allocated`),
            # causing 300s hangs. --test-threads=1 guarantees serial execution.
            archive: docker-tests
            filter: package(temps-providers) and kind(=lib) and test(backup_and_restore_to_s3)
            extra_args: --no-capture
            test_threads: "1"
          - group: postgres-upgrades
            # PostgreSQL major-version upgrade orchestrator integration tests.
            # Each test pulls pg17 + pg18 images and runs a real dump/restore,
            # so they're 2–6 min apiece and must not contend for Docker.
            # --test-threads=1 guarantees serial execution.
            archive: docker-tests
            filter: package(temps-providers) and kind(=lib) and test(orchestrator_)
            extra_args: --no-capture
            test_threads: "1"
          - group: docker-deployments
            # Crates that use TestDatabase and/or Docker, fanned out across one
            # shared TimescaleDB server. Parallel: these deadlocked (40P01) at
            # any concurrency while every test migrated a schema inside one
            # shared database; each test now gets a database of its own. The
            # Docker-build and Trivy tests that share host resources are
            # throttled by name in .config/nextest.toml.
            #
            # Also runs temps-otel's TestDatabase-backed integration binaries,
            # which had a runner of their own (`otel`) only because, serial,
            # they took long enough to need one. They must keep the shared
            # server: without TEMPS_TEST_DATABASE_URL, TestDatabase boots a
            # container per test process (measured: 195s vs ~90 minutes).
            #
            # temps-agent belongs here rather than in a unit group: it had no
            # group at all (its tests only ever got compiled, never run), and
            # the platform-detection tests it now carries assert against a
            # real `docker info`.
            #
            # temps-metrics is here for the same reason: no group ran it, so
            # its TestDatabase-backed store tests and the ClickHouse
            # testcontainers tests (which check rows read via
            # system.query_log) never executed. kind(=lib) keeps its
            # tests/*.rs binary out until that is shown to be green.
            archive: default
            filter: >-
              package(temps-deployments) or package(temps-backup) or
              package(temps-vulnerability-scanner) or package(temps-import-docker) or
              package(temps-database) or
              package(temps-blob) or package(temps-query-s3) or
              package(temps-query-redis) or package(temps-query-mongodb) or
              package(temps-query-postgres) or package(temps-embeddings) or
              package(temps-config) or package(temps-notifications) or
              package(temps-deployer) or package(temps-logs) or
              package(temps-domains) or package(temps-projects) or
              package(temps-agent) or
              (package(temps-metrics) and kind(=lib)) or
              (package(temps-otel) and kind(=test) and
               (binary(timescaledb_storage_test) or binary(e2e_http_test) or
                binary(dynamic_alert_integration_test) or
                binary(decode_to_store_test)))
            test_threads: num-cpus
          - group: migrations
            # temps-migrations' up()/down() tests guard on
            # TEMPS_TEST_DATABASE_URL and skip-as-pass when it's set (a full
            # migration cycle would destroy a shared database). Inside the
            # shared-DB groups above that guard always fired, so this suite
            # had never actually run in CI. This entry runs it for real:
            # the env var is left unset (see the run step's conditional) and
            # each test provisions its own disposable TimescaleDB via
            # testcontainers -- isolated, so two can run at once.
            archive: default
            filter: package(temps-migrations)
            test_threads: "2"
          # temps-otel's ClickHouse integration binaries. Each test provisions
          # its own ClickHouse via testcontainers and uses a MockDatabase for
          # the inner store, so the shared server is irrelevant and the
          # container cost (~60s/test, 23 tests) is unavoidable. Isolated
          # containers mean no shared state, so two at a time is safe. Its
          # TestDatabase-backed siblings run in docker-deployments above.
          - group: otel-clickhouse
            archive: default
            filter: >-
              package(temps-otel) and kind(=test) and
              (binary(clickhouse_storage_test) or
               binary(clickhouse_query_spans_test) or
               binary(clickhouse_trace_summaries_test))
            test_threads: "2"

    steps:
      # The docker-tests archive is only built when the change reaches
      # temps-providers or temps-backup (`docker_tests`); without it, the
      # groups that run it have nothing to do. A matrix entry cannot be
      # skipped through `if:`, so every step below checks this instead.
      - name: Decide whether this group runs
        env:
          ARCHIVE: ${{ matrix.archive }}
          DOCKER_TESTS: ${{ needs.changes.outputs.docker_tests }}
        run: |
          if [[ "$ARCHIVE" == docker-tests && "$DOCKER_TESTS" == false ]]; then
            echo "This change reaches neither temps-providers nor temps-backup; nothing for ${{ matrix.group }} to test."
            echo "GROUP_RUNS=false" >> "$GITHUB_ENV"
          else
            echo "GROUP_RUNS=true" >> "$GITHUB_ENV"
          fi

      - name: Free up disk space
        if: env.GROUP_RUNS == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      # Started as a plain `docker run` step (not a `services:` container)
      # because GitHub Actions' `services:` block has no way to override a
      # service image's CMD, and every migration-driven test here creates
      # its own hypertables/continuous aggregates (with refresh policies)
      # in a fresh, short-lived schema against this one shared instance.
      # TimescaleDB's background worker launcher polls for due jobs every
      # ~60s independent of test concurrency, and if its scan lands while
      # one of those schemas is still alive, it launches a real background
      # worker that races the test's own foreground transaction -- the same
      # root cause fixed for TestDatabase's own containers in #196, just
      # needed here too since this job never goes through that Rust code
      # path. `max_background_workers=0` still allows CREATE EXTENSION /
      # create_hypertable / add_continuous_aggregate_policy to succeed; it
      # only stops the launcher from ever executing scheduled jobs, which no
      # test here relies on.
      - name: Start TimescaleDB (background workers disabled)
        if: env.GROUP_RUNS == 'true'
        run: |
          docker run -d --name timescaledb \
            -e POSTGRES_DB=test_db \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            timescale/timescaledb-ha:pg18 \
            postgres -c timescaledb.max_background_workers=0 -c max_connections=400

      - name: Checkout code
        if: env.GROUP_RUNS == 'true'
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        if: env.GROUP_RUNS == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        if: env.GROUP_RUNS == 'true'
        uses: taiki-e/install-action@nextest

      - name: Download test binaries
        if: env.GROUP_RUNS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-${{ matrix.archive }}

      - name: Verify TimescaleDB is ready
        if: env.GROUP_RUNS == 'true'
        run: |
          # pg_isready runs inside the container -- GitHub Actions'
          # `services:` block used to gate the job on this same check via
          # its `options: --health-cmd`, which we lost by switching to a
          # plain `docker run` step (needed to pass a custom postgres CMD,
          # see the step above). A bare `nc -z` here would only prove the
          # TCP listener is up, not that Postgres has finished its
          # first-boot initdb+restart cycle.
          timeout 60 bash -c 'until docker exec timescaledb pg_isready -U test_user -d test_db; do sleep 1; done'
          echo "TimescaleDB is ready"

      - name: Serialise the tests CI has seen flake
        if: env.GROUP_RUNS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/nextest-apply-learned-serial.sh

      - name: Run integration tests
        if: env.GROUP_RUNS == 'true'
        env:
          RUST_BACKTRACE: 1
          # The migrations group must NOT see this variable: its tests
          # skip-as-pass against external databases (see matrix comment).
          # GitHub env vars can't be conditionally omitted, only emptied —
          # the test-side guard treats empty as unset to close that gap.
          TEMPS_TEST_DATABASE_URL: ${{ matrix.group != 'migrations' && 'postgresql://test_user:test_password@localhost:5432/test_db' || '' }}
        # Narrowed to the crates this change can reach, retried and reported
        # like the unit groups above.
        run: >-
          cargo nextest run --profile ci --no-tests=pass
          --archive-file test-binaries-${{ matrix.archive }}.tar.zst --workspace-remap .
          -E '(${{ matrix.filter }}) and (${{ needs.changes.outputs.tests || 'all()' }})'
          --test-threads=${{ matrix.test_threads }} ${{ matrix.extra_args }}

      - name: Report flaky tests
        if: ${{ !cancelled() && env.GROUP_RUNS == 'true' }}
        # nextest writes it under target/nextest/ci/ of the remapped
        # workspace; found rather than assumed, and copied to one fixed path
        # for the upload.
        run: |
          junit=$(find . -path '*/nextest/ci/junit.xml' -print -quit)
          if [[ -n "$junit" ]]; then cp "$junit" nextest-junit.xml; fi
          python3 .github/scripts/nextest-flaky.py report --group "${{ matrix.group }}" nextest-junit.xml

      - name: Upload JUnit report
        if: ${{ !cancelled() && env.GROUP_RUNS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.group }}
          path: nextest-junit.xml
          if-no-files-found: ignore
          retention-days: 14
  # ---------------------------------------------------------------------------
  # Phase 2b: MariaDB PITR full-chain E2E
  # ---------------------------------------------------------------------------
  # Keep this heavyweight single test out of the generic Docker matrix so it can
  # start immediately, and so Actions shows each expensive phase (image pull,
  # test run, diagnostics) separately. Runs alongside unit-tests/
  # integration-tests -- only needs build-test-binaries.
  mariadb-pitr-e2e:
    name: "MariaDB PITR E2E"
    runs-on: ubuntu-latest
    needs: [changes, build-test-binaries]
    # Runs the docker-tests archive, which is only built when the change
    # reaches temps-providers or temps-backup.
    if: ${{ !cancelled() && needs.build-test-binaries.result == 'success' && needs.changes.outputs.docker_tests != 'false' }}
    timeout-minutes: 35

    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-docker-tests

      - name: Verify TimescaleDB is ready
        run: |
          timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          echo "TimescaleDB is ready"

      - name: Show Docker environment
        run: |
          docker version
          docker info
          docker system df

      - name: Pull E2E images
        run: |
          timeout 10m docker pull rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          timeout 10m docker build --pull \
            --build-arg MARIADB_VERSION=11.4 \
            --tag ghcr.io/gotempsh/mariadb-walg:11.4 \
            images/mariadb-walg
          docker image ls | grep -E '^(rustfs/rustfs|ghcr.io/gotempsh/mariadb-walg)\s' || true

      - name: Run MariaDB PITR E2E
        env:
          RUST_BACKTRACE: 1
          TEMPS_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          timeout --foreground 20m bash -lc 'set -o pipefail; cargo nextest run --archive-file test-binaries-docker-tests.tar.zst --workspace-remap . -E "package(temps-backup) and test(mariadb_pitr_full_chain_e2e)" --test-threads=1 --no-capture 2>&1 | tee /tmp/mariadb-pitr-e2e.log'

      - name: Summarize MariaDB PITR E2E diagnostics
        if: always()
        run: |
          if [ -f /tmp/mariadb-pitr-e2e.log ]; then
            grep -E 'Restored row counts|test result|FAILED|Timed out|timed out|Fetched MariaDB PITR|Uploading MariaDB PITR|Uploaded MariaDB PITR|Replaying MariaDB|temps-mariadb-pitr-replay|docker exec timed out|DIAG|Booted MariaDB|Base backup|archive_binlogs|Restore produced' /tmp/mariadb-pitr-e2e.log | tail -n 240 || true
          else
            echo "No MariaDB PITR E2E log was written"
          fi

          echo ""
          echo "Docker containers:"
          docker ps -a || true
          echo ""
          echo "Docker images:"
          docker image ls || true
          echo ""
          echo "Docker disk usage:"
          docker system df || true

      - name: Upload MariaDB PITR E2E log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-pitr-e2e-log
          path: /tmp/mariadb-pitr-e2e.log
          if-no-files-found: ignore

  sentry-sdk-acceptance:
    name: Sentry SDK Acceptance
    needs: [changes, build-test-binaries]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.build-test-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    # The tests themselves take ~5 minutes, but the apt install and the
    # shared test-archive download each vary from seconds to ~10 minutes on
    # hosted runners; 20 minutes left the tests no room when both were slow.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Make room for the shared test archive
        # This job runs on a fresh hosted runner; keep existing Docker images.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          no-cache: true

      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install Chromium system dependencies
        run: bunx playwright@1.64.1 install-deps chromium

      - name: Download existing Rust test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-default

      - name: Start isolated TimescaleDB
        shell: bash
        run: |
          set -euo pipefail
          db_container="sentry-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "TEMPS_SENTRY_CI_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          docker run --detach --name "$db_container" \
            --label "temps.sentry-test=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -e POSTGRES_DB=test_db -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -p 127.0.0.1::5432 timescale/timescaledb-ha:pg18 \
            postgres -c timescaledb.max_background_workers=0
          ready=false
          for attempt in {1..60}; do
            if docker exec "$db_container" pg_isready -U test_user -d test_db; then
              ready=true
              break
            fi
            echo "Waiting for the SDK acceptance database ($attempt/60)"
            sleep 1
          done
          [[ "$ready" == true ]]
          db_address=$(docker port "$db_container" 5432/tcp | head -1)
          echo "TEMPS_TEST_DATABASE_URL=postgresql://test_user:test_password@${db_address}/test_db" >> "$GITHUB_ENV"

      - name: Run official SDK traffic and Rust native assertions
        env:
          # Execute the already-built Rust tests, including explicitly ignored
          # SDK cases. Only the tiny official Rust SDK fixture is compiled here.
          TEMPS_SENTRY_TEST_ARCHIVE: ${{ github.workspace }}/test-binaries-default.tar.zst
          TEMPS_SENTRY_FIXTURES_ROOT: ${{ runner.temp }}/temps-sentry-sdk-fixtures
        run: scripts/sentry-acceptance.sh sdk

      - name: Clean up this job's database
        if: always()
        shell: bash
        run: |
          if [[ -n "${TEMPS_SENTRY_CI_DB_CONTAINER:-}" ]]; then
            docker rm --force "$TEMPS_SENTRY_CI_DB_CONTAINER"
          fi
