name: Rust Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR-controlled build scripts and privileged E2E containers do not need a
# repository-write token. Keep the run read-only even if repository defaults
# are later broadened.
permissions:
  contents: read

# Superseded PR pushes used to leave the previous run's jobs going to
# completion — including an 80-minute cold musl build whose output nobody
# would ever look at, while the new commit's jobs queued behind it. Cancel
# them. Never on `main`: those runs are what populate the default-branch
# cache scope that every PR reads from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workflow-contracts:
    name: Release Workflow Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify nightly release wiring
        run: .github/scripts/test-nightly-release-workflows.sh

      - name: Verify workflow caches are save-if guarded
        # An unguarded Swatinem/rust-cache step in a pull_request-triggered
        # workflow duplicates that cache once per open PR ref, evicting the
        # shared temps-musl-fast-* build cache from the repo's 10GB pool and
        # turning every musl build into a ~80min cold compile. Has bitten us
        # twice already (dependency-scan.yml, network-kernel-tests.yml).
        run: python3 .github/scripts/check-cache-save-guards.py

  # ---------------------------------------------------------------------------
  # One `temps` binary, two consumers.
  #
  # Compose Security needs a musl binary to assemble the production image
  # around; the e2e job needs a runnable `temps` to drive real deployments.
  # These used to be two separate compiles of the same workspace — a `fast`
  # musl build here and a `--release` glibc build in `e2e-tests.yml`, each
  # with its own web-UI + WASM build in front of it. Now this job compiles
  # once and both consume the artifact.
  #
  # musl-static is the right target for both: it is exactly the binary that
  # ships in the Docker image, and a static binary runs fine directly on the
  # runner. E2E therefore now tests the artifact users actually get.
  # ---------------------------------------------------------------------------
  build-binary:
    name: Build temps Binary (musl)
    runs-on: ubuntu-latest
    # Warm this is ~5 minutes. The ceiling is sized for a fully cold cache,
    # which took 81 minutes the last time the cargo cache was evicted — a
    # tighter bound would turn a slow run into a failed one.
    timeout-minutes: 100
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The toolchain stage (apk deps, bun, wasm-pack/wasm-bindgen-cli compiled
      # from source) only changes when the Dockerfile does, so cache it as
      # image layers. It doubles as the build container below: compiling
      # inside it produces the same musl binary the production builder stage
      # would, but with a cargo target dir that persists across runs — the
      # one thing an in-Docker build can never have.
      - name: Build toolchain image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: toolchain
          load: true
          tags: temps-toolchain:ci
          # Second entry is the pre-rename scope, kept so in-flight PRs don't
          # all pay for a cold toolchain build until `main` repopulates the
          # new one. Safe to drop after a `main` build has run.
          cache-from: |
            type=gha,scope=temps-toolchain
            type=gha,scope=compose-security-toolchain
          # Write from `main` only. Cache writes are scoped to the producing
          # ref, so exporting from PRs stored a private copy of a
          # byte-identical image in every open PR's scope — four concurrent
          # PRs held four copies of the same layer set, ~718MB each, ~2.9GB
          # of a 10GB pool, evicting the cargo caches this job depends on.
          # Reads see `main`'s copy, which is what every ref can read anyway.
          # A PR touching the Dockerfile's toolchain stage rebuilds it (~7min)
          # and can't cache that for its own next push; toolchain changes are
          # rare enough that this is the cheaper side of the trade.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=temps-toolchain,mode=max' || '' }}

      # Keyed on Cargo.lock + Dockerfile, so any dependency bump misses. The
      # `restore-keys` prefix is what makes that survivable: it falls back to
      # the most recent musl target dir and rebuilds only what changed. That
      # fallback only works if the entry still exists — see the note in
      # `release.yml` about the 10GB pool being flooded by dead tag-scoped
      # buildkit blobs, which is what made this miss outright and turned a
      # ~5 minute incremental build into 81 minutes of cold compile.
      #
      # Restore always, save from `main` only. This is the largest single
      # cache in the repo (a musl target dir plus cargo registry for 55
      # crates), so a per-ref copy of it is what pushed the pool over its
      # 10GB limit fastest — four open PRs each holding their own was several
      # GB spent guaranteeing that nobody's copy survived. A PR that changes
      # Cargo.lock now rebuilds the delta on top of main's copy on every
      # push, instead of everyone cold-building because the pool thrashed.
      - name: Restore cargo target dir (musl, fast profile)
        id: musl-cache
        uses: actions/cache/restore@v6
        with:
          path: ci-build-cache
          key: temps-musl-fast-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          restore-keys: |
            temps-musl-fast-
            compose-security-musl-

      # Mirrors the Dockerfile builder stage (WASM -> web UI -> cargo build)
      # inside the toolchain container, with target/ and the cargo registry
      # mounted from the persistent cache so rebuilds are incremental. Uses
      # the `fast` profile (release semantics, parallel codegen, no LTO);
      # production images keep the default `release` profile.
      - name: Build temps binary in toolchain container
        run: |
          mkdir -p ci-build-cache/target ci-build-cache/cargo-registry ci-prebuilt
          docker run --rm \
            --volume "$PWD":/build --workdir /build \
            --volume "$PWD/ci-build-cache/target":/build/target \
            --volume "$PWD/ci-build-cache/cargo-registry":/usr/local/cargo/registry \
            temps-toolchain:ci \
            sh -ec '
              git config --global --add safe.directory /build
              cd /build/crates/temps-captcha-wasm && bun install && npm run build
              cd /build/web && bun install && \
                RSBUILD_OUTPUT_PATH=/build/crates/temps-cli/dist bun run build
              cd /build
              cargo build --profile fast --bin temps --package temps-cli
              cp target/fast/temps ci-prebuilt/temps
              chown -R '"$(id -u):$(id -g)"' /build/target /usr/local/cargo/registry \
                ci-prebuilt crates/temps-cli/dist
            '
          chmod +x ci-prebuilt/temps
          file ci-prebuilt/temps

      - name: Save cargo target dir (musl, fast profile)
        if: github.ref == 'refs/heads/main' && steps.musl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ci-build-cache
          key: temps-musl-fast-${{ hashFiles('Cargo.lock', 'Dockerfile') }}

      - name: Upload temps binary
        uses: actions/upload-artifact@v7
        with:
          name: temps-binary-musl-fast
          path: ci-prebuilt/temps
          retention-days: 1
          # Already a stripped binary; re-compressing costs more than it saves.
          compression-level: 0

  # Lives in its own file for readability; called from here so it can reuse
  # the binary `build-binary` already compiled. Artifacts are per-run, and a
  # called workflow is part of the same run, so the download just works.
  e2e:
    name: E2E
    needs: build-binary
    uses: ./.github/workflows/e2e-tests.yml
    with:
      binary-artifact: temps-binary-musl-fast

  # The existing E2E workflow above covers Playwright and three example
  # deployments. This separate matrix runs the real apps/temps-e2e scenario
  # CLI in isolated shards, including the dedicated multinode/mTLS topology.
  scenario-e2e:
    name: Scenario E2E
    needs: build-binary
    uses: ./.github/workflows/apps-e2e-tests.yml
    with:
      binary-artifact: temps-binary-musl-fast

  compose-security:
    name: Compose Security
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download temps binary
        uses: actions/download-artifact@v8
        with:
          name: temps-binary-musl-fast
          path: ci-prebuilt

      - name: Restore executable bit
        run: chmod +x ci-prebuilt/temps

      # Assemble the production runtime stage around the prebuilt binary —
      # the builder stage is skipped entirely, so this takes ~1 minute.
      - name: Build temps image from prebuilt binary
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: temps-compose-security:ci
          build-args: |
            TEMPS_ARTIFACTS=artifacts-prebuilt

      - name: Validate secure Compose defaults
        env:
          COMPOSE_SECURITY_OVERRIDE: .github/compose-security.prebuilt.yml
          COMPOSE_SECURITY_PREBUILT: "1"
        run: scripts/test-compose-security.sh

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Share the same cache slot as build-tests/clippy instead of each
          # getting its own — they compile largely the same dependency graph,
          # and per-job caches were bloating the repo's total cache footprint
          # enough to evict other workflows' caches well before their 7-day
          # idle expiry.
          #
          # Deduping by key was only half of it: writes are also scoped to the
          # producing ref, so `save-if: true` stored a separate ~886MB copy in
          # every open PR's scope. A snapshot with three PRs in flight held
          # 2.66GB of this one key. Save from `main` — the scope every ref can
          # read — and let PRs restore from it. A PR that shifts the
          # dependency graph rebuilds the delta on top of main's copy, which
          # is what the prefix restore-keys are for.
          shared-key: test-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache wasm-pack binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install wasm-pack and Build WASM
        run: |
          if [ ! -f ~/.cargo/bin/wasm-pack ]; then
            cargo install wasm-pack
          fi
          cd crates/temps-captcha-wasm
          bun run build

      - name: Check workspace
        run: cargo check --workspace --all-targets

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  web-typecheck:
    name: Web TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Restore always, save only from `main` — see the cache-scoping note on
      # the toolchain export above.
      - name: Restore Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: cd web && bun install

      - name: Save Bun dependencies
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      # react/react-dom drifting apart is invisible to tsc and rsbuild but
      # blanks the console at runtime with React error #527 (issue #504).
      - name: Check react/react-dom versions match
        run: cd web && bun run check:react-versions

      - name: Type check
        run: cd web && bunx tsc --noEmit

  openapi-canonical:
    name: OpenAPI Spec Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `bun install`: the check reads the committed file and needs nothing
      # but Bun itself, so it reports in seconds on every pull request.
      #
      # What it catches: the CLI's client is generated from a *committed* spec,
      # and the server serves that document minified on one line. Writing the
      # response straight to the file turns ~92,000 lines into 1, so the diff
      # reports ~92,000 deletions and the real change becomes unreviewable.
      - name: Check openapi.json is canonical
        run: bun apps/temps-cli/scripts/check-openapi.ts

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-latest
    # Non-blocking: clippy warnings are reported but do not fail the build
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # See the check job above for why this shares build-tests' key
          # and why it only saves from `main`.
          shared-key: test-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache wasm-pack binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install wasm-pack and Build WASM
        run: |
          if [ ! -f ~/.cargo/bin/wasm-pack ]; then
            cargo install wasm-pack
          fi
          cd crates/temps-captcha-wasm
          bun run build

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Build every test binary exactly once, archive it, share across all
  # downstream test jobs.
  # ---------------------------------------------------------------------------
  # Two archives, not one: `cargo nextest archive --workspace` unifies
  # features the same way for every crate in a given invocation, so as long
  # as every consumer of an archive selects tests via `-E 'package(...)'`
  # (not `-p`, which nextest rejects alongside --archive-file anyway) against
  # THIS SAME invocation's output, there's no resolver-scope mismatch and
  # nothing needs to recompile downstream (verified locally: archiving a
  # subset, then `cargo nextest run --archive-file ... -E 'package(x)'` for
  # an even narrower selection produces zero "Compiling" output).
  #
  # temps-providers/temps-backup's docker-tests feature can't be baked into
  # one shared archive unconditionally, though: GitHub's ubuntu-latest
  # runners have a live Docker daemon by default, so if unit-tests' runner
  # executed those Docker-heavy tests (S3 backup/restore, pg17/pg18 major
  # upgrades) they would NOT gracefully no-op like they do on a
  # Docker-less host -- they'd actually run, against none of the shared
  # service containers integration-tests sets up. Building a second
  # archive with docker-tests on, used only by the groups that actually
  # provision Docker/DB services, keeps that boundary intact.
  build-test-binaries:
    name: Build Test Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get autoremove -y && sudo apt-get clean

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # This is now the only job that compiles anything -- every
          # downstream job runs pre-built binaries from the archives below,
          # so there's no cross-scope resolver mismatch to worry about (see
          # the removed per-group cache keys this replaces).
          shared-key: nextest-archive
          # Save from `main` only — this key's archive runs ~1.3GB, and
          # per-PR copies of it were a top-three consumer of the repo's 10GB
          # cache pool. See the check job for the full reasoning.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Archive default-feature test binaries
        # Used by unit-tests (both groups) and the docker-deployments
        # integration group -- none of them need temps-providers/temps-backup's
        # docker-tests feature.
        run: cargo nextest archive --workspace --all-targets --archive-file test-binaries-default.tar.zst
        env:
          CARGO_INCREMENTAL: 0

      - name: Archive docker-tests test binaries
        # Used by docker-providers/docker-backups/postgres-upgrades and
        # mariadb-pitr-e2e. `docker-tests = []` on both crates (no optional
        # deps), so this only recompiles temps-providers/temps-backup
        # themselves on top of the previous step's already-built dependency
        # graph, not the whole workspace again.
        run: cargo nextest archive --workspace --all-targets --features temps-providers/docker-tests,temps-backup/docker-tests --archive-file test-binaries-docker-tests.tar.zst
        env:
          CARGO_INCREMENTAL: 0

      - name: Upload default-feature archive
        uses: actions/upload-artifact@v7
        with:
          name: test-binaries-default
          path: test-binaries-default.tar.zst
          retention-days: 1

      - name: Upload docker-tests archive
        uses: actions/upload-artifact@v7
        with:
          name: test-binaries-docker-tests
          path: test-binaries-docker-tests.tar.zst
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 1: Unit tests (fast, no Docker containers needed)
  # ---------------------------------------------------------------------------
  # Runs all workspace tests WITHOUT the docker-tests feature. Both groups
  # only download the archive and run it -- no compilation happens here.
  unit-tests:
    name: "Unit Tests (${{ matrix.group }})"
    runs-on: ubuntu-latest
    needs: build-test-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit-a
            # kind(=lib): the old `--lib` flag excluded tests/*.rs integration
            # test files. Some of those files (e.g. temps-providers' Docker
            # integration tests) were never run by ANY CI job and aren't
            # necessarily green -- switching the shared archive to
            # --all-targets pulled them in by accident once (see PR
            # discussion), so every group that used to pass --lib keeps that
            # exact scope here via kind(=lib) instead.
            filter: >-
              (package(temps-providers) or package(temps-presets) or
              package(temps-auth) or package(temps-core) or
              package(temps-monitoring) or package(temps-kv) or
              package(temps-analytics-funnels) or package(temps-webhooks) or
              package(temps-infra) or package(temps-captcha-wasm) or
              package(temps-geo) or package(temps-environments) or
              package(temps-audit) or package(temps-analytics-performance))
              and kind(=lib)
          - group: unit-b
            # `not (temps-git and *_real_api)`: those six tests call the live
            # github.com / gitlab.com REST APIs unauthenticated, so they share
            # a per-IP rate limit with every other job on the runner fleet.
            # They only tolerate `RateLimitExceeded`, but a throttled provider
            # answers with a body the parser can't decode, which surfaces as
            # `ApiError("Failed to parse tree: error decoding response body")`
            # and panics -- turning third-party availability into a red build
            # on PRs that never touched temps-git. Same reasoning already
            # applied to temps-auth::oidc_discovery_live and
            # temps-git::gitea_e2e in unit-integration below. They still run
            # (and still assert strictly) with `cargo test -p temps-git`.
            filter: >-
              (package(temps-proxy) or package(temps-error-tracking) or
              package(temps-git) or package(temps-screenshots) or
              package(temps-routes) or package(temps-entities) or
              package(temps-cli) or package(temps-status-page) or
              package(temps-import) or package(temps-queue) or
              package(temps-query) or package(temps-analytics-session-replay) or
              package(temps-dns) or package(temps-email) or
              package(temps-analytics) or package(temps-analytics-events) or
              package(temps-otel)) and kind(=lib)
              and not (package(temps-git) and test(/_real_api$/))
          - group: unit-integration
            # The kind(=test) counterpart to the two groups above: crates
            # whose tests/*.rs files need neither Docker nor a database, and
            # which therefore no CI job has ever run (the groups above are
            # all kind(=lib)).
            #
            # This list is deliberately short. Every candidate was run
            # locally first, and two were dropped because they FAIL today —
            # they are not in scope here and each needs its own fix:
            #   temps-dns-resolver  both end_to_end tests time out
            #                       ("first sync converged: Elapsed(())")
            #   temps-agents        sandbox_credential_smoke_test builds a
            #                       Docker image; `cargo build --release
            #                       --bin temps-pty-agent` exits 101
            # Also excluded, needing infrastructure CI does not have:
            # temps-network (it_kernel/it_allocator — covered by
            # network-kernel-tests.yml), temps-agents::firecracker_e2e (KVM),
            # temps-auth::oidc_discovery_live and temps-git::gitea_e2e (live
            # network / a Gitea server).
            filter: >-
              (package(temps-ai-gateway) or package(temps-git-credential) or
              package(temps-memory) or package(temps-pty-agent))
              and kind(=test)

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get autoremove -y && sudo apt-get clean

      # TestDatabase::new() (crates/temps-database/src/test_utils.rs) falls
      # back to lazily booting its own TimescaleDB container via a
      # process-local `OnceCell` when TEMPS_TEST_DATABASE_URL isn't set --
      # reused across tests only within the SAME process. Nextest runs every
      # test in its own fresh process by design (its core isolation
      # feature), so that OnceCell resets before every single test: instead
      # of one container booted once per crate (cargo test's per-binary
      # model), nextest was trying to cold-boot a brand new container for
      # EVERY test, which starved connect_with_retry's budget (tuned for "an
      # already-warm container", not "just called .start() this instant")
      # and caused Docker port-allocation races from the extra churn.
      # Pointing at one externally-started, already-running TimescaleDB via
      # TEMPS_TEST_DATABASE_URL (matching integration-tests/mariadb-pitr-e2e
      # below) sidesteps that: TestDatabase connects and isolates via a
      # unique schema per test instead of booting a container at all, which
      # is exactly what those other jobs already do safely across many
      # separate processes hitting one shared instance (see
      # run_migrations_with_retry's deadlock-retry logic in test_utils.rs).
      - name: Start TimescaleDB (background workers disabled)
        run: |
          docker run -d --name timescaledb \
            -e POSTGRES_DB=test_db \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            timescale/timescaledb-ha:pg18 \
            postgres -c timescaledb.max_background_workers=0

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-default

      - name: Verify TimescaleDB is ready
        run: |
          timeout 60 bash -c 'until docker exec timescaledb pg_isready -U test_user -d test_db; do sleep 1; done'
          echo "TimescaleDB is ready"

      - name: Run unit tests
        env:
          RUST_BACKTRACE: 1
          TEMPS_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        # Many crates' tests spin up a real Postgres/TimescaleDB-backed
        # TestDatabase, and their DDL/DML against the one shared TimescaleDB
        # instance can genuinely deadlock (Postgres error 40P01) -- confirmed
        # across multiple CI runs hitting different tests in different crates
        # each time. Nextest runs every selected test through one global
        # scheduler regardless of which binary it came from, so
        # --test-threads=1 alone fully serializes execution here -- there's
        # no separate build-concurrency flag to accidentally collide with,
        # since nothing is being compiled in this job at all.
        run: cargo nextest run --archive-file test-binaries-default.tar.zst --workspace-remap . -E '${{ matrix.filter }}' --test-threads=1

  # ---------------------------------------------------------------------------
  # Phase 2: Integration tests (Docker + Database required)
  # ---------------------------------------------------------------------------
  # Runs tests that need Docker daemon and/or a real database. Runs
  # alongside unit-tests (both only need build-test-binaries), not after it --
  # nothing here depends on unit-tests' result anymore since a compile
  # failure would already fail build-test-binaries before either starts.
  integration-tests:
    name: "Integration Tests (${{ matrix.group }})"
    runs-on: ubuntu-latest
    needs: build-test-binaries
    # 90 min headroom for the postgres-upgrades group, which can spike past
    # 45 min when pg17/pg18 image pulls land on a cold runner and several
    # orchestrator tests recover serially. Other groups still finish well
    # under that — the timeout only kicks in for true outliers.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: docker-providers
            # temps-providers with Docker tests enabled.
            # NOTE: orchestrator_* tests run in a dedicated `postgres-upgrades`
            # group, and *_backup_and_restore_to_s3 tests in a dedicated
            # `docker-backups` group (both serial, long-running, container-heavy).
            # Skip them here so this group stays fast.
            # --test-threads=1: this group's tests hit the shared `services:
            # timescaledb` container just like docker-backups/postgres-upgrades/
            # docker-deployments below, and the default multi-threaded runner
            # was racing against it -- observed as a Postgres deadlock (40P01)
            # and background-worker exhaustion (e.g. test_delete_service).
            # kind(=lib): matches the old --lib flag -- excludes
            # tests/*.rs integration test files (e.g. temps-providers'
            # mariadb_binlog_health_integration.rs), which no CI job has ever
            # run and aren't necessarily green yet.
            archive: docker-tests
            filter: package(temps-providers) and kind(=lib) and not test(orchestrator_) and not test(backup_and_restore_to_s3)
            test_threads: "1"
          - group: docker-backups
            # Heavyweight S3 backup/restore integration tests
            # (test_{mongodb,postgres,redis,s3}_backup_and_restore_to_s3). Each
            # spins up a MinIO container plus a service container and streams a
            # real wal-g/mongodump backup, so running them in parallel saturates
            # Docker and races for host ports (`port is already allocated`),
            # causing 300s hangs. --test-threads=1 guarantees serial execution.
            archive: docker-tests
            filter: package(temps-providers) and kind(=lib) and test(backup_and_restore_to_s3)
            extra_args: --no-capture
            test_threads: "1"
          - group: postgres-upgrades
            # PostgreSQL major-version upgrade orchestrator integration tests.
            # Each test pulls pg17 + pg18 images and runs a real dump/restore,
            # so they're 2–6 min apiece and must not contend for Docker.
            # --test-threads=1 guarantees serial execution.
            archive: docker-tests
            filter: package(temps-providers) and kind(=lib) and test(orchestrator_)
            extra_args: --no-capture
            test_threads: "1"
          - group: docker-deployments
            # Crates that use TestDatabase and/or Docker. Like unit-tests
            # above, this fans out across many crates in one run against the
            # single shared `services: timescaledb` container below -- same
            # shape that made cross-binary/cross-test Postgres deadlocks
            # (40P01) show up in unit-tests. Reproduced locally: without
            # --test-threads=1, a plain INSERT in temps-deployments' test
            # setup deadlocked against a concurrently-running test in the
            # same shared DB within a couple of runs.
            #
            # temps-agent belongs here rather than in a unit group: it had no
            # group at all (its tests only ever got compiled, never run), and
            # the platform-detection tests it now carries assert against a
            # real `docker info`.
            archive: default
            filter: >-
              package(temps-deployments) or package(temps-backup) or
              package(temps-vulnerability-scanner) or package(temps-import-docker) or
              package(temps-database) or
              package(temps-blob) or package(temps-query-s3) or
              package(temps-query-redis) or package(temps-query-mongodb) or
              package(temps-query-postgres) or package(temps-embeddings) or
              package(temps-config) or package(temps-notifications) or
              package(temps-deployer) or package(temps-logs) or
              package(temps-domains) or package(temps-projects) or
              package(temps-agent)
            test_threads: "1"
          - group: migrations
            # temps-migrations' up()/down() tests guard on
            # TEMPS_TEST_DATABASE_URL and skip-as-pass when it's set (a full
            # migration cycle would destroy a shared database). Inside the
            # shared-DB groups above that guard always fired, so this suite
            # had never actually run in CI. This entry runs it for real:
            # the env var is left unset (see the run step's conditional) and
            # each test provisions its own disposable TimescaleDB via
            # testcontainers.
            archive: default
            filter: package(temps-migrations)
            test_threads: "1"
          # ---------------------------------------------------------------
          # temps-otel integration tests. Previously NO CI job ran these: the
          # unit-tests groups are pinned to kind(=lib), which excludes
          # tests/*.rs entirely. An audit of the whole workspace found 37 of
          # 47 integration-test binaries, across 18 crates, in that state.
          # These two groups close the temps-otel share of it.
          #
          # Split by what each binary needs, not by size:
          #
          #   otel        — TestDatabase-backed. These MUST keep the shared
          #                 TimescaleDB (i.e. must NOT be added to the
          #                 TEMPS_TEST_DATABASE_URL exclusion below). Without
          #                 it, TestDatabase falls back to a process-local
          #                 OnceCell container, and because nextest runs every
          #                 test in its own process that means cold-booting a
          #                 fresh container PER TEST — the exact pathology the
          #                 unit-tests job documents. Measured: 41 tests take
          #                 195s against the shared DB and roughly 90 MINUTES
          #                 without it. --test-threads=1 for the same
          #                 shared-DB deadlock reason as docker-deployments.
          #
          #   otel-clickhouse — provisions its own ClickHouse per test via
          #                 testcontainers and uses a MockDatabase for the
          #                 inner store, so the shared DB is irrelevant here
          #                 and the container cost is unavoidable (~60s/test,
          #                 23 tests). Isolated containers mean no shared
          #                 state, so --test-threads=2 is safe.
          - group: otel
            archive: default
            filter: >-
              package(temps-otel) and kind(=test) and
              (binary(timescaledb_storage_test) or binary(e2e_http_test) or
               binary(dynamic_alert_integration_test) or
               binary(decode_to_store_test))
            test_threads: "1"
          - group: otel-clickhouse
            archive: default
            filter: >-
              package(temps-otel) and kind(=test) and
              (binary(clickhouse_storage_test) or
               binary(clickhouse_query_spans_test) or
               binary(clickhouse_trace_summaries_test))
            test_threads: "2"

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get autoremove -y && sudo apt-get clean

      # Started as a plain `docker run` step (not a `services:` container)
      # because GitHub Actions' `services:` block has no way to override a
      # service image's CMD, and every migration-driven test here creates
      # its own hypertables/continuous aggregates (with refresh policies)
      # in a fresh, short-lived schema against this one shared instance.
      # TimescaleDB's background worker launcher polls for due jobs every
      # ~60s independent of test concurrency, and if its scan lands while
      # one of those schemas is still alive, it launches a real background
      # worker that races the test's own foreground transaction -- the same
      # root cause fixed for TestDatabase's own containers in #196, just
      # needed here too since this job never goes through that Rust code
      # path. `max_background_workers=0` still allows CREATE EXTENSION /
      # create_hypertable / add_continuous_aggregate_policy to succeed; it
      # only stops the launcher from ever executing scheduled jobs, which no
      # test here relies on.
      - name: Start TimescaleDB (background workers disabled)
        run: |
          docker run -d --name timescaledb \
            -e POSTGRES_DB=test_db \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            timescale/timescaledb-ha:pg18 \
            postgres -c timescaledb.max_background_workers=0

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-${{ matrix.archive }}

      - name: Verify TimescaleDB is ready
        run: |
          # pg_isready runs inside the container -- GitHub Actions'
          # `services:` block used to gate the job on this same check via
          # its `options: --health-cmd`, which we lost by switching to a
          # plain `docker run` step (needed to pass a custom postgres CMD,
          # see the step above). A bare `nc -z` here would only prove the
          # TCP listener is up, not that Postgres has finished its
          # first-boot initdb+restart cycle.
          timeout 60 bash -c 'until docker exec timescaledb pg_isready -U test_user -d test_db; do sleep 1; done'
          echo "TimescaleDB is ready"

      - name: Run integration tests
        env:
          RUST_BACKTRACE: 1
          # The migrations group must NOT see this variable: its tests
          # skip-as-pass against external databases (see matrix comment).
          # GitHub env vars can't be conditionally omitted, only emptied —
          # the test-side guard treats empty as unset to close that gap.
          TEMPS_TEST_DATABASE_URL: ${{ matrix.group != 'migrations' && 'postgresql://test_user:test_password@localhost:5432/test_db' || '' }}
        run: cargo nextest run --archive-file test-binaries-${{ matrix.archive }}.tar.zst --workspace-remap . -E '${{ matrix.filter }}' --test-threads=${{ matrix.test_threads }} ${{ matrix.extra_args }}
  # ---------------------------------------------------------------------------
  # Phase 2b: MariaDB PITR full-chain E2E
  # ---------------------------------------------------------------------------
  # Keep this heavyweight single test out of the generic Docker matrix so it can
  # start immediately, and so Actions shows each expensive phase (image pull,
  # test run, diagnostics) separately. Runs alongside unit-tests/
  # integration-tests -- only needs build-test-binaries.
  mariadb-pitr-e2e:
    name: "MariaDB PITR E2E"
    runs-on: ubuntu-latest
    needs: build-test-binaries
    timeout-minutes: 35

    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get autoremove -y && sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-binaries-docker-tests

      - name: Verify TimescaleDB is ready
        run: |
          timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'
          echo "TimescaleDB is ready"

      - name: Show Docker environment
        run: |
          docker version
          docker info
          docker system df

      - name: Pull E2E images
        run: |
          timeout 10m docker pull minio/minio:latest
          timeout 10m docker pull mariadb:lts
          docker image ls | grep -E '^(minio/minio|mariadb)\s' || true

      - name: Run MariaDB PITR E2E
        env:
          RUST_BACKTRACE: 1
          TEMPS_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          timeout --foreground 20m bash -lc 'set -o pipefail; cargo nextest run --archive-file test-binaries-docker-tests.tar.zst --workspace-remap . -E "package(temps-backup) and test(mariadb_pitr_full_chain_e2e)" --test-threads=1 --no-capture 2>&1 | tee /tmp/mariadb-pitr-e2e.log'

      - name: Summarize MariaDB PITR E2E diagnostics
        if: always()
        run: |
          if [ -f /tmp/mariadb-pitr-e2e.log ]; then
            grep -E 'Restored row counts|test result|FAILED|Timed out|timed out|Fetched MariaDB PITR|Uploading MariaDB PITR|Uploaded MariaDB PITR|Replaying MariaDB|temps-mariadb-pitr-replay|docker exec timed out|DIAG|Booted MariaDB|Base backup|archive_binlogs|Restore produced' /tmp/mariadb-pitr-e2e.log | tail -n 240 || true
          else
            echo "No MariaDB PITR E2E log was written"
          fi

          echo ""
          echo "Docker containers:"
          docker ps -a || true
          echo ""
          echo "Docker images:"
          docker image ls || true
          echo ""
          echo "Docker disk usage:"
          docker system df || true

      - name: Upload MariaDB PITR E2E log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-pitr-e2e-log
          path: /tmp/mariadb-pitr-e2e.log
          if-no-files-found: ignore
