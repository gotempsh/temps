name: Actionlint

# Static checks for GitHub Actions workflows: expression and context types,
# `needs` graphs, permission names, action inputs, and -- through
# shellcheck -- the shell in every `run:` block. Shellcheck findings gate at
# warning severity; info/style suggestions are left to local runs
# (`actionlint` with no options) so they do not block unrelated changes.
#
# actionlint is downloaded from its GitHub release and checked against a
# pinned SHA-256 rather than run through a third-party action.
on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --strict --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          shellcheck --version
          actionlint -color
