name: Hosted runtime compatibility image

# Repackage one immutable, already-published binary to unblock hosted consoles.
# This never changes the nightly, beta, latest, or original version tags.
on:
  push:
    branches: [fix/release-image-libc]
    paths:
      - Dockerfile.release
      - scripts/test-release-dockerfile.sh
      - .github/workflows/hosted-runtime-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'gotempsh/temps' && github.ref == 'refs/heads/fix/release-image-libc'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SOURCE_IMAGE: ghcr.io/gotempsh/temps@sha256:86592b15a4c54b85f1eb29245a6b7b6f51085e1d083f1e781d7b7ca6e37e5cf4
      PLATFORM: ${{ matrix.platform }}
      IMAGE: ghcr.io/gotempsh/temps:compat-9b9e5b45-${{ github.sha }}-${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the runtime contract
        run: bash scripts/test-release-dockerfile.sh

      - name: Extract the unchanged pinned binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          # Pin the bundled GeoLite2 snapshot independently of the binary.
          echo "e0f23703c82661377a6e16d763a5a7b580dd34b617219705f34f86d07a3c7eb1  crates/temps-cli/GeoLite2-City.mmdb" | sha256sum --check
          docker pull --platform "$PLATFORM" "$SOURCE_IMAGE"
          source_container=$(docker create --platform "$PLATFORM" "$SOURCE_IMAGE")
          # Expand the container ID when the trap runs.
          # shellcheck disable=SC2016
          trap 'docker rm -f "$source_container" >/dev/null' EXIT
          mkdir -p artifacts
          docker cp "$source_container:/usr/local/bin/temps" artifacts/temps
          chmod 0755 artifacts/temps
          echo "sha256=$(sha256sum artifacts/temps | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile.release executes --version before an image can be pushed.
      - name: Build and publish the compatible runtime
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/gotempsh/temps
            org.opencontainers.image.revision=9b9e5b4529795e90020b712e2ec827f307011b58
            org.temps.runtime.revision=${{ github.sha }}
            org.temps.binary.sha256=${{ steps.binary.outputs.sha256 }}

      - name: Verify the published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          BINARY_SHA256: ${{ steps.binary.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          pinned="ghcr.io/gotempsh/temps@$DIGEST"
          docker pull --platform "$PLATFORM" "$pinned"
          docker run --rm --network none --read-only "$pinned" --version
          runtime_container=$(docker create "$pinned")
          # Expand the container ID when the trap runs.
          # shellcheck disable=SC2016
          trap 'docker rm -f "$runtime_container" >/dev/null' EXIT
          docker cp "$runtime_container:/usr/local/bin/temps" artifacts/runtime-temps
          test "$(sha256sum artifacts/runtime-temps | cut -d' ' -f1)" = "$BINARY_SHA256"
          printf 'Verified %s: %s\n' "$PLATFORM" "$pinned" >> "$GITHUB_STEP_SUMMARY"
