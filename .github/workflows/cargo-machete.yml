name: Cargo Machete

# Fails a pull request that declares a Cargo dependency no source file uses.
# An unused dependency still has to be downloaded, compiled and audited, and
# an unused internal `temps-*` edge lengthens the build's critical path for
# nothing.
#
# cargo-machete only reads manifests and sources, so this needs no Rust
# toolchain and no build. A dependency that is deliberately unreferenced (one
# that exists only to switch on a feature of a transitive crate) goes in the
# crate's `[package.metadata.cargo-machete] ignored = [...]`, with a comment
# saying why. cargo-machete does not report unused `[dev-dependencies]`, so
# those still rely on review.
#
# cargo-machete is downloaded from its GitHub release and checked against a
# pinned SHA-256 rather than run through a third-party action.
on:
  pull_request:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/*.rs"
      - ".github/workflows/cargo-machete.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-machete
        env:
          MACHETE_VERSION: 0.9.2
          MACHETE_SHA256: 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9
        run: |
          set -euo pipefail
          name="cargo-machete-v${MACHETE_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/bnjbvr/cargo-machete/releases/download/v${MACHETE_VERSION}/$name.tar.gz"
          echo "${MACHETE_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-machete" "$RUNNER_TEMP/cargo-machete"

      - name: Find unused dependencies
        run: "$RUNNER_TEMP/cargo-machete"
